<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>octodeck</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --ink-2: #55554f;
    --line: #e2e2dc;
    --accent: #2f6fdb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --surface: #1a1a19;
      --ink: #ededea;
      --ink-2: #b5b5ae;
      --line: #2e2e2b;
      --accent: #6c9cf0;
    }
  }

  * { box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  h1 { margin: 0; font-size: 28px; }

  p { margin: 0; color: var(--ink-2); }

  button {
    margin-top: 8px;
    padding: 6px 16px;
    color: var(--ink);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover { color: var(--accent); border-color: var(--accent); }

  #recent { width: 100%; max-width: 480px; }

  h2 { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; }

  #recent-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 60vh;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    list-style: none;
  }

  button.recent {
    display: block;
    width: 100%;
    margin: 0;
    padding: 8px 12px;
    text-align: left;
  }

  .recent span { display: block; overflow-wrap: anywhere; }

  .recent .path { color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
  <h1>octodeck</h1>
  <p>Open a folder that holds a .factory folder.</p>

  <section id="recent" hidden>
    <h2>Recent</h2>
    <ul id="recent-list"></ul>
  </section>

  <button id="open" type="button">Open Project…</button>

  <script>
    const { invoke } = window.__TAURI__.core;
    const recent = document.getElementById('recent');
    const list = document.getElementById('recent-list');

    function row(entry) {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;

      const path = document.createElement('span');
      path.className = 'path';
      path.textContent = entry.display;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'recent';
      button.append(name, path);
      button.addEventListener('click', () => {
        invoke('open_recent_factory', { path: entry.path }).finally(render);
      });

      const item = document.createElement('li');
      item.append(button);
      return item;
    }

    function render() {
      return invoke('recent_factories').then((entries) => {
        list.replaceChildren(...entries.map(row));
        recent.hidden = entries.length === 0;
      });
    }

    document.getElementById('open').addEventListener('click', () => {
      invoke('open_project_folder');
    });

    render();
  </script>
</body>
</html>
