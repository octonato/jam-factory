  updatePrsPart('card', 'pr-card', prCardHtml(repo))
  updatePrsPart('list', 'pr-list', prListHtml(repo))
}

// Shows the PRs that match the typed filter.
function onPrFilter(event) {
  prFilter = event.currentTarget.value
  renderPrsPage(prsView.path)
}

// Returns the shown PR of `number`, or undefined.
function shownPr(number) {
  return shownPrs().find((pr) => pr.number === number)
}

// Runs the action of the clicked PR icon, or selects the PR whose row was clicked.
// Cmd+click on a row in the app also opens the PR's worktree page in a new window, after its checkout.
function onPrListClick(event) {
  const button = event.target.closest('button[data-action]')
  if (button) {
    const pr = shownPr(Number(button.dataset.number))
    if (pr !== undefined) runPrAction(prsView.path, pr, button.dataset.action)
    return
  }

  const row = event.target.closest('.row.pr')
  if (!row) return

  selectedPr = Number(row.dataset.number)
  renderPrsPage(prsView.path)

  if (!event.metaKey || window.__TAURI__ === undefined) return

  const pr = shownPr(selectedPr)
  if (pr !== undefined) runPrAction(prsView.path, pr, 'window')
}

// Moves the selection by `step` shown PRs and stops at the first and last PRs.
function movePrSelection(step) {
  const numbers = shownPrs().map((pr) => pr.number)
  if (numbers.length === 0) return

  const last = numbers.length - 1
  const first = step > 0 ? 0 : last
  const current = numbers.indexOf(selectedPr)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedPr = numbers[next]
  renderPrsPage(prsView.path)
  $('pr-list').querySelector('.row.selected')?.scrollIntoView({ block: 'nearest' })
}

function missingScripts() {
  const missing = []
  if (typeof marked === 'undefined') missing.push('marked.min.js not loaded')
  if (typeof DOMPurify === 'undefined') missing.push('purify.min.js not loaded')
  if (typeof hljs === 'undefined') missing.push('highlight.min.js not loaded')
  if (typeof Diff2HtmlUI === 'undefined') missing.push('diff2html-ui-base.min.js not loaded')
  if (typeof Terminal === 'undefined') missing.push('xterm.js not loaded')
  if (typeof FitAddon === 'undefined') missing.push('addon-fit.js not loaded')
  return missing
}

function codeBlock(text) {
  return `<pre><code>${escape(text)}</code></pre>`
}

function prettyJson(text) {
  try {
    return JSON.stringify(JSON.parse(text), null, 2)
  } catch {
    return text
  }
}

// Returns the language, `path=` and `lines=` words of a fence info string.
function parseInfo(info) {
  const words = info.split(/\s+/).filter((word) => word !== '')
  const value = (key) => words.find((word) => word.startsWith(`${key}=`))?.slice(key.length + 1) ?? null
  return { lang: words[0] ?? '', path: value('path'), lines: value('lines') }
}

// Tells whether `text` holds a `diff --git` line or a `---` line followed by a `+++` line.
function hasDiffHeaders(text) {
  return /^diff --git /m.test(text) || /^--- [^\n]*\n\+\+\+ /m.test(text)
}

// Returns a diff block with a layout toggle for a `diff` fence with file headers, else the code in highlight.js colours under its `path:lines`.
function fenceHtml(text, info) {
  const { lang, path, lines } = parseInfo(info)
  if (lang === 'diff' && hasDiffHeaders(text)) {
    const index = pendingDiffs.push(text) - 1
    return (
      `<div class="diff" data-diff="${index}"><div class="diff-bar">` +
      '<button type="button" data-layout="line-by-line" aria-pressed="true">Unified</button>' +
      '<button type="button" data-layout="side-by-side" aria-pressed="false">Split</button>' +
      '</div><div class="diff-body"></div></div>'
    )
  }

  const head = path && lines ? `<div class="code-path">${escape(path)}:${escape(lines)}</div>` : ''
  const code = hljs.getLanguage(lang) ? hljs.highlight(text, { language: lang }).value : escape(text)
  return `<div class="code">${head}<pre><code class="hljs">${code}</code></pre></div>`
}

function markdownRenderer() {
  const renderer = new marked.Renderer()
  renderer.code = ({ text, lang }) => fenceHtml(text, lang ?? '')
  return renderer
}

function fileHtml(path, text) {
  if (path.endsWith('.md') && missingScripts().length === 0) {
    pendingDiffs = []
    const markdown = marked.parse(text, { gfm: true, renderer: markdownRenderer() })
    const html = DOMPurify.sanitize(markdown, { FORBID_TAGS: ['style', 'form'] })
    return `<div class="markdown">${html}</div>`
  }
  if (path.endsWith('.json')) return codeBlock(prettyJson(text))
  return codeBlock(text)
}

// Draws each diff block of `view` unified from `pendingDiffs`, and keeps its text on the block.
function drawDiffs(view) {
  for (const block of view.querySelectorAll('.diff[data-diff]')) {
    block.diffText = pendingDiffs[Number(block.dataset.diff)] ?? ''
    drawDiff(block, 'line-by-line')
  }
}

// Draws the text of the diff block `block` into its body in `outputFormat`.
function drawDiff(block, outputFormat) {
  const body = block.querySelector('.diff-body')
  const config = { outputFormat, drawFileList: false, matching: 'lines', highlight: true }
  new Diff2HtmlUI(body, block.diffText, config, hljs).draw()
}

// Redraws the diff block of the clicked toggle button in its layout, and presses only that button.
function onDiffToggle(event) {
  const button = event.target.closest('.diff-bar button[data-layout]')
  const block = button?.closest('.diff[data-diff]')
  if (!block) return

  for (const other of block.querySelectorAll('.diff-bar button[data-layout]')) {
    other.setAttribute('aria-pressed', String(other === button))
  }
  drawDiff(block, button.dataset.layout)
}

function reviewNames(files, round) {
  const prefix = `round-${round}/reviews/`
  return files
    .filter((path) => path.startsWith(prefix) && path.endsWith('.md') && !path.slice(prefix.length).includes('/'))
    .map((path) => path.slice(prefix.length, -3))
    .sort((a, b) => a.localeCompare(b))
}

function displayName(path) {
  return path.endsWith('.md') ? path.slice(0, -3) : path
}

// Returns the file the pane shows when the route names none.
function defaultFile(session, files, round) {
  if (sessionFlow(session) === 'review') return reviewDefaultFile(session, files, round)
  if (sessionFlow(session) === 'vibe') return vibeDefaultFile(session)
  if (session.stage === 'blocked') return 'session.json'
  if (sessionFlow(session) === 'walk') return 'overview.md'

  const stage = phaseStage(session)
  const report = `round-${round}/report.md`
  if (stage === 'verify') return files.includes(report) ? report : 'tasks.md'
  if (stage === 'triage') return report
  return Object.hasOwn(STAGE_FILE, stage) ? STAGE_FILE[stage] : null
}

// Returns the file the pane shows for a review session when the route names none.
function reviewDefaultFile(session, files, round) {
  if (session.stage === 'blocked') return 'session.json'

  const report = `round-${round}/report.md`
  const submit = `round-${round}/submit.md`
  if (session.stage === 'verify') return files.includes(report) ? report : 'request.md'
  if (session.stage === 'submit' || session.stage === 'done') return files.includes(submit) ? submit : report
  return null
}

// Returns the file the pane shows for a vibe session when the route names none.
function vibeDefaultFile(session) {
  if (session.stage === 'blocked') return 'session.json'
  if (session.stage === 'implement') return 'request.md'
  if (session.stage === 'done') return 'tasks.md'
  return null
}

function sessionRound(session) {
  return Number.isInteger(session.round) && session.round > 0 ? session.round : 0
}

// Returns true when `round` has its `triage.md`, or for a review session its `submit.md` or a done `comment` run.
function roundClosed(session, round, files, runs) {
  if (sessionFlow(session) !== 'review') return files.includes(`round-${round}/triage.md`)

  const commented = runs.some((run) => run.stop === 'comment' && run.round === round && run.outcome === 'done')
  return commented || files.includes(`round-${round}/submit.md`)
}

// Returns `round` while it is not closed, else the next round.
function openRound(session, files, runs) {
  const round = sessionRound(session)
  return round > 0 && !roundClosed(session, round, files, runs) ? round : round + 1
}

// Returns true when a build session implements once more after its last round.
function hasFinalImplement(session, files) {
  const round = sessionRound(session)
  return session.lastRound === true && round > 0 && files.includes(`round-${round}/triage.md`)
}

// Returns the rounds the line shows, in order.
function shownRounds(session, files, runs) {
  const round = sessionRound(session)
  const open = openRound(session, files, runs)
  const rounds = []
  for (let n = 1; n <= round; n += 1) rounds.push(n)

  const working = ['implement', 'verify'].includes(phaseStage(session))
  if (open > round && working && !hasFinalImplement(session, files)) rounds.push(open)
  if (rounds.length === 0) rounds.push(1)
  return rounds
}

// Returns a pending stop of `kind`, with `file` as its main file when the file exists.
function newStop(kind, round, file, files) {
  return {
    kind,
    round,
    label: STOP_LABELS[kind],
    state: 'pending',
    file: files.includes(file) ? file : null,
    links: [],
    reviewers: null,
    runs: [],
    durationMs: null,
    note: null,
    summary: null,
    progress: null,
    triage: null,
  }
}

// Attaches to `stop` the runs of its kind in `round` and returns it.
function withRuns(stop, runs, round = stop.round) {
  stop.runs = runs.filter((run) => run.stop === stop.kind && run.round === round)
  return stop
}

function existingLinks(files, links) {
  return links.filter((link) => files.includes(link.path))
}

function findStop(stops, kind, round) {
  return stops.findIndex((stop) => stop.kind === kind && stop.round === round)
}

function taskProgress(session) {
  const done = integerOrNull(session.counts?.tasksDone)
  const open = integerOrNull(session.counts?.tasksOpen)
  if (done === null || open === null || done + open === 0) return null
  return { done, total: done + open }
}

function triageCounts(session) {
  const triage = {
    mustFix: integerOrNull(session.counts?.mustFix),
    shouldFix: integerOrNull(session.counts?.shouldFix),
    nit: integerOrNull(session.counts?.nit),
  }
  return Object.values(triage).some((count) => count !== null) ? triage : null
}

// Returns the Review stop of `round`, with one reviewer per review file, the runs of `kinds` that no reviewer claims, and the time of all its runs.
function reviewStop(round, files, runs, kinds) {
  const stop = newStop('review', round, `round-${round}/report.md`, files)
  stop.links = existingLinks(files, [{ label: 'extras', path: `round-${round}/extras.md` }])

  const reviews = runs.filter((run) => run.stop === 'review' && run.round === round)
  stop.reviewers = reviewNames(files, round).map((name) => {
    const path = `round-${round}/reviews/${name}.md`
    return { name, path, run: reviews.findLast((run) => run.file === path) ?? null }
  })

  const owned = runs.filter((run) => kinds.includes(run.stop) && run.round === round)
  const claimed = new Set(stop.reviewers.map((reviewer) => reviewer.path))
  const claims = (run) => run.stop === 'review' && claimed.has(run.file)
  stop.runs = owned.filter((run) => !claims(run))
  stop.durationMs = elapsedMs(owned)
  return stop
}

// Returns the Triage stop of `round`, linking each round file that no other stop shows.
function triageStop(session, round, files, runs) {
  const prefix = `round-${round}/`
  const stop = withRuns(newStop('triage', round, `${prefix}triage.md`, files), runs)

  const shown = new Set([
    ...['report.md', 'triage.md', 'extras.md', 'submit.md'].map((name) => prefix + name),
    ...reviewNames(files, round).map((name) => `${prefix}reviews/${name}.md`),
  ])
  stop.links = files
    .filter((path) => path.startsWith(prefix) && !shown.has(path))
    .sort((a, b) => a.localeCompare(b))
    .map((path) => ({ label: displayName(path.slice(prefix.length)), path }))

  if (round === sessionRound(session) && stop.file !== null) stop.triage = triageCounts(session)
  return stop
}

function doneStop(files) {
  const stop = newStop('done', 0, 'deferred.md', files)
  stop.links = existingLinks(files, [{ label: 'decisions', path: 'decisions.md' }])
  return stop
}

// Returns the stops of a build session and the index of its current stop.
function buildFlowStops(session, files, runs, outcomes) {
  const stops = [
    withRuns(newStop('request', 0, 'request.md', files), runs),
    withRuns(newStop('spec', 0, 'spec.md', files), runs),
    withRuns(newStop('plan', 0, 'plan.md', files), runs),
  ]
  const open = openRound(session, files, runs)
  const progress = taskProgress(session)

  for (const round of shownRounds(session, files, runs)) {
    // A round after a `finalize` triage starts at its Review.
    if (outcomes[round - 1] !== 'finalize') {
      const implement = withRuns(newStop('implement', round, 'tasks.md', files), runs)
      if (round === open) implement.progress = progress
      stops.push(implement)
    }
    stops.push(reviewStop(round, files, runs, ['review', 'report']), triageStop(session, round, files, runs))
  }

  const final = hasFinalImplement(session, files)
  if (final) {
    const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs, open)
    implement.progress = progress
    stops.push(implement)
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'spec' || stage === 'plan') current = findStop(stops, stage, 0)
  if (stage === 'implement') current = findStop(stops, 'implement', final ? 0 : open)
  if (stage === 'verify') current = findStop(stops, 'review', open)
  if (stage === 'triage') current = findStop(stops, 'triage', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a review session and the index of its current stop.
function reviewFlowStops(session, files, runs) {
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs)]
  for (const round of shownRounds(session, files, runs)) {
    stops.push(
      reviewStop(round, files, runs, ['review']),
      withRuns(newStop('report', round, `round-${round}/report.md`, files), runs),
      withRuns(newStop('comment', round, `round-${round}/submit.md`, files), runs),
    )
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  const open = openRound(session, files, runs)
  let current = -1
  if (stage === 'verify') current = findStop(stops, files.includes(`round-${open}/report.md`) ? 'report' : 'review', open)
  if (stage === 'submit') current = findStop(stops, 'comment', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a vibe session and the index of its current stop.
function vibeFlowStops(session, files, runs) {
  const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs)
  implement.progress = taskProgress(session)
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs), implement, doneStop(files)]

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'implement') current = 1
  if (stage === 'done') current = 2
  return { stops, current }
}

// Returns the stops of a walk session: the overview, then one stop per step of `walk` with its file when it is written.
function walkFlowStops(session, files, runs, walk) {
  const overview = { ...newStop('overview', 0, null, files), file: 'overview.md', summary: stringOrNull(walk?.summary) }
  const steps = (walk?.steps ?? []).map(({ n, title, summary }) => ({
    ...newStop('step', 0, stepPath(n), files),
    label: `Step ${n}: ${title}`,
    summary: stringOrNull(summary),
  }))
  return [overview, ...steps]
}

// Sets the states of the walk stops, and puts the reason of a blocked walk on the overview.
function setWalkStates(session, stops) {
  const unwritten = (stop) => stop.kind === 'step' && stop.file === null
  const writing = session.stage === 'walk' ? stops.findIndex(unwritten) : -1
  stops.forEach((stop, i) => {
    if (!unwritten(stop)) stop.state = 'done'
    else stop.state = i === writing ? 'writing' : 'pending'
  })

  const overview = stops[0]
  if (session.stage === 'blocked') {
    overview.state = 'blocked'
    overview.note = stringOrNull(session.blocked?.reason)
    overview.links.push({ label: 'session.json', path: 'session.json' })
  }
  return stops
}

function currentState(session, stop) {
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done' && stop.kind === 'done') return 'done'
  if ((session.stage === 'triage' || session.stage === 'submit') && sessionMode(session) === 'interactive') return 'waiting'
  return 'current'
}

// Returns the stops of the session's line, with their states, files and runs.
function buildStops(session, files, runs, outcomes = {}, walk = null) {
  const flow = sessionFlow(session)
  if (flow === 'walk') return setWalkStates(session, walkFlowStops(session, files, runs, walk))

  const flowStops = flow === 'review' ? reviewFlowStops : flow === 'vibe' ? vibeFlowStops : buildFlowStops
  const { stops, current } = flowStops(session, files, runs, outcomes)

  stops.forEach((stop, i) => {
    if (stop.kind === 'request' || (current >= 0 && i < current)) stop.state = 'done'
    else if (i === current) stop.state = currentState(session, stop)
    else stop.state = 'pending'
  })

  const blocked = stops[current]
  if (blocked?.state === 'blocked') {
    if (blocked.kind === 'implement' && blocked.file !== null) blocked.links.push({ label: 'tasks', path: blocked.file })
    blocked.file = 'session.json'
    blocked.note = stringOrNull(session.blocked?.reason)
  }
  return stops
}

function distinct(values) {
  return [...new Set(values.filter((value) => value !== null))]
}

function sumOrNull(values) {
  const present = values.filter((value) => value !== null)
  return present.length > 0 ? present.reduce((sum, value) => sum + value, 0) : null
}

// Returns the span from the earliest `started` to the latest `ended` of `runs` when every run has both, else the sum of `durationMs`.
function elapsedMs(runs) {
  const starts = runs.map((run) => Date.parse(run.started ?? ''))
  const ends = runs.map((run) => Date.parse(run.ended ?? ''))
  if (runs.length > 0 && [...starts, ...ends].every(Number.isFinite)) return Math.max(...ends) - Math.min(...starts)
  return sumOrNull(runs.map((run) => run.durationMs))
}

// Returns the distinct agents and models of `runs`, and each sum over the runs that record it.
function runTotals(runs) {
  return {
    agents: distinct(runs.map((run) => run.agent)),
    models: distinct(runs.map((run) => run.model)),
    tokens: sumOrNull(runs.map((run) => run.tokens)),
    durationMs: sumOrNull(runs.map((run) => run.durationMs)),
    toolUses: sumOrNull(runs.map((run) => run.toolUses)),
  }
}

// Returns true when `stop` opens `path` as its main file, a link or a reviewer.
function stopShows(stop, path) {
  if (stop === undefined || path === null) return false

  return (
    stop.file === path ||
    stop.links.some((link) => link.path === path) ||
    (stop.reviewers ?? []).some((reviewer) => reviewer.path === path)
  )
}

// Returns the index of the last non-pending stop that shows `path`, else of the first stop that shows it, else -1.
function stopIndexForFile(stops, path) {
  const matches = stops.flatMap((stop, i) => (stopShows(stop, path) ? [i] : []))
  const reached = matches.filter((i) => stops[i].state !== 'pending')
  return reached.at(-1) ?? matches[0] ?? -1
}

// Returns the names of the stop model cases that fail.
function metroSelfCheck() {
  const buildSession = (fields) => ({ flow: 'build', mode: 'default', round: 0, lastRound: false, blocked: null, ...fields })
  const kinds = (stops) => stops.map((stop) => stop.kind).join(' ')
  const line = (stops) => stops.map((stop) => `${stop.kind}${stop.round}:${stop.state}`).join(' ')

  const cases = {
    'no-runs': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['request.md', 'round-1/triage.md'], parseRuns(''))
      return parseRuns('').length === 0 && stops.every((stop) => stop.runs.length === 0)
    },

    'truncated-line': () => {
      const runs = parseRuns('{"stop":"spec","round":0,"tokens":5}\n{"stop":"pl')
      return runs.length === 1 && runs[0].tokens === 5
    },

    'bad-types': () => parseRuns('{"stop":"spec","round":0,"tokens":"many"}')[0].tokens === null,

    'run-duration': () => {
      const duration = (fields) => parseRuns(JSON.stringify({ stop: 'implement', round: 1, ...fields }))[0].durationMs
      const started = '2026-10-22T10:00:00Z'
      const ended = '2026-10-22T10:01:30Z'
      return (
        duration({ started, ended, durationMs: null }) === 90000 &&
        duration({ started, ended, durationMs: 1000 }) === 1000 &&
        duration({ started: ended, ended: started }) === null &&
        duration({ started: 'soon', ended }) === null
      )
    },

    'verify-before-bump': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['round-1/triage.md'], [])
      const current = stops.find((stop) => stop.state === 'current')
      return current?.kind === 'review' && current.round === 2
    },

    blocked: () => {
      const session = buildSession({ stage: 'blocked', round: 1, blocked: { stage: 'implement', reason: 'x' } })
      const stops = buildStops(session, ['round-1/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'blocked')
      return (
        stops[i]?.kind === 'implement' &&
        stops[i].note === 'x' &&
        stops[i].file === 'session.json' &&
        stops.slice(i + 1).every((stop) => stop.state === 'pending')
      )
    },

    waiting: () => {
      const stops = buildStops(buildSession({ stage: 'triage', round: 1, mode: 'interactive' }), ['round-1/report.md'], [])
      return stops.find((stop) => stop.kind === 'triage')?.state === 'waiting'
    },

    'last-round': () => {
      const session = buildSession({ stage: 'implement', round: 2, lastRound: true })
      const stops = buildStops(session, ['round-1/triage.md', 'round-2/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'current')
      return stops[i]?.kind === 'implement' && stops[i - 1]?.kind === 'triage' && stops[i + 1]?.kind === 'done'
    },

    'review-flow': () => {
      const stops = buildStops({ flow: 'review', stage: 'submit', round: 1 }, ['round-1/report.md'], [])
      return kinds(stops) === 'request review report comment done'
    },

    'no-findings-round': () => {
      const session = { flow: 'review', stage: 'blocked', round: 1, blocked: { stage: 'verify' } }
      const runs = parseRuns('{"stop":"comment","round":1,"outcome":"done"}')
      const stops = buildStops(session, ['request.md', 'round-1/report.md'], runs)
      const expected = 'request0:done review1:done report1:done comment1:done review2:blocked report2:pending comment2:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-finalize': () => {
      const outcomes = { 1: 'next round', 2: triageOutcome('# Triage: round 2\n\n- F1: dismiss → D1\n\noutcome: finalize\n') }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      const expected =
        'request0:done spec0:done plan0:done implement1:done review1:done triage1:done implement2:done review2:done triage2:done ' +
        'review3:current triage3:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-last-round': () => {
      const outcomes = { 1: 'next round', 2: 'last round' }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      return line(stops).endsWith('triage2:done implement3:done review3:current triage3:pending done0:pending')
    },

    'feedback-after-finalize': () => {
      const session = buildSession({ stage: 'triage', round: 2, feedbackImport: { round: 2, phase: 'normalize' } })
      const files = ['round-1/triage.md', 'round-2/reviews/github-feedback.md']
      const stops = buildStops(session, files, [], { 1: 'finalize' })
      const expected =
        'request0:done spec0:done plan0:done implement1:done review1:done triage1:done review2:done triage2:current done0:pending'
      return line(stops) === expected
    },

    'vibe-flow': () => {
      const stops = buildStops({ flow: 'vibe', stage: 'implement', round: 0 }, [], [])
      return kinds(stops) === 'request implement done'
    },

    'walk-flow': () => {
      const walk = parseWalk('{"steps":[{"n":1,"title":"A"},{"n":2,"title":"B"}]}')
      const session = { flow: 'walk', stage: 'walk', counts: { stepsPlanned: 2, stepsDone: 1 } }
      const stops = buildStops(session, ['overview.md', 'steps/01.md'], [], {}, walk)
      return stops.map((stop) => stop.state).join(' ') === 'done done writing'
    },

    'reviewer-run': () => {
      const path = 'round-1/reviews/a.md'
      const runs = parseRuns(`{"stop":"review","round":1,"file":"${path}"}\n{"stop":"review","round":1,"file":null}`)
      const review = buildStops(buildSession({ stage: 'triage', round: 1 }), [path], runs).find((stop) => stop.kind === 'review')
      return review.reviewers[0]?.run?.file === path && review.runs.length === 1 && review.runs[0].file === null
    },

    'review-time': () => {
      const files = ['round-1/reviews/a.md', 'round-1/reviews/b.md']
      const a = '{"stop":"review","round":1,"file":"round-1/reviews/a.md","started":"2026-10-22T10:00:00Z","ended":"2026-10-22T10:05:00Z"}'
      const b = '{"stop":"review","round":1,"file":"round-1/reviews/b.md","started":"2026-10-22T10:01:00Z","ended":"2026-10-22T10:09:00Z","durationMs":480000}'
      const report = '{"stop":"report","round":1,"started":"2026-10-22T10:09:00Z","ended":"2026-10-22T10:09:45Z","durationMs":45000}'
      const untimed = '{"stop":"review","round":1,"durationMs":1000}'

      const time = (lines) => {
        const stops = buildStops(buildSession({ stage: 'triage', round: 1 }), files, parseRuns(lines.join('\n')))
        return stops.find((stop) => stop.kind === 'review').durationMs
      }
      return time([a, b, report]) === 585000 && time([b, report, untimed]) === 526000
    },

    'run-totals': () => {
      const totals = runTotals(parseRuns('{"stop":"spec","round":0,"model":"m","tokens":2}\n{"stop":"spec","round":0,"model":"m"}'))
      return totals.models.join() === 'm' && totals.agents.length === 0 && totals.tokens === 2 && totals.toolUses === null
    },
  }

  return Object.keys(cases).filter((name) => {
    try {
      return !cases[name]()
    } catch {
      return true
    }
  })
}

// Returns `count` in short form, such as 35.6k.
function formatCount(count) {
  return COUNT_FORMAT.format(count).replace('K', 'k')
}

// Returns `ms` as hours, minutes and seconds, such as 4m 12s.
function formatDuration(ms) {
  const seconds = Math.round(ms / 1000)
  if (seconds < 60) return `${seconds}s`

  const minutes = Math.floor(seconds / 60)
  if (minutes < 60) return `${minutes}m ${seconds % 60}s`
  return `${Math.floor(minutes / 60)}h ${minutes % 60}m`
}

// Returns the earliest valid `started` time of `runs`, or null.
function firstStarted(runs) {
  const times = runs.map((run) => Date.parse(run.started ?? '')).filter(Number.isFinite)
  return times.length > 0 ? new Date(Math.min(...times)) : null
}

// Returns the session strip: the facts of `session` and its `runs` as pills, then the archive button.
function sessionStripHtml(session, runs) {
  const stage = session.stage === 'blocked' ? `blocked at ${phaseStage(session) ?? 'unknown'}` : session.stage ?? 'unknown'
  const facts =
    sessionFlow(session) === 'walk'
      ? [sessionClass(session), stage, `${walkProgress(session)} steps`]
      : [sessionFlow(session), sessionMode(session), stage]
  if (sessionRound(session) > 0) facts.push(`round ${sessionRound(session)}`)
  if (session.lastRound === true) facts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    facts.push(`${counts.deferred - counts.issued} deferred without issue`)
  }

  const started = firstStarted(runs)
  if (started !== null) facts.push(`started ${started.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`)

  const tokens = runTotals(runs.filter((run) => run.agent !== null && run.agent !== 'main')).tokens
  if (tokens !== null) facts.push(`${formatCount(tokens)} agent tokens`)

  return `
    <div class="facts" data-dir="${escape(session.dir)}">
      ${facts.map((fact) => `<span class="pill">${escape(fact)}</span>`).join('')}
      <span class="actions">${actionButtons(STRIP_ACTIONS)}</span>
    </div>`
}

// Returns the node of `stop`: a capsule for Review, a double ring for Done, else a circle.
function nodeHtml(stop) {
  const shape = stop.kind === 'review' ? ' interchange' : stop.kind === 'done' ? ' terminus' : ''
  const icon = Object.hasOwn(NODE_ICONS, stop.state)
    ? `<svg viewBox="0 0 16 16" aria-hidden="true">${NODE_ICONS[stop.state]}</svg>`
    : ''
  return `<span class="node${shape}">${icon}</span>`
}

function segHtml(position, reached) {
  return `<span class="seg ${position} ${reached ? 'travelled' : 'todo'}"></span>`
}

function metaHtml(facts) {
  return `<div class="meta">${facts.map((fact) => `<span>${fact}</span>`).join('')}</div>`
}

// Returns the models, tokens and tool uses of `totals` that have data, as HTML.
function usageFacts({ models, tokens, toolUses }) {
  const facts = []
  if (models.length > 0) facts.push(`<b>${escape(models.join(', '))}</b>`)
  if (tokens !== null) facts.push(`${formatCount(tokens)} tokens`)
  if (toolUses !== null) facts.push(`${toolUses} tool uses`)
  return facts
}

// Returns one button per reviewer: its agent, then the model, tokens and duration of its run.
function reviewersHtml(reviewers, open) {
  const rows = reviewers.map(({ name, path, run }) => {
    const facts = []
    if (run?.model) facts.push(escape(run.model))
    if (Number.isInteger(run?.tokens)) facts.push(`${formatCount(run.tokens)} tokens`)
    if (Number.isInteger(run?.durationMs)) facts.push(formatDuration(run.durationMs))

    const selected = path === open ? ' selected' : ''
    const line = facts.length > 0 ? `<span class="facts">${facts.join(' · ')}</span>` : ''
    return `
      <button type="button" class="reviewer${selected}" data-path="${escape(path)}" title="${escape(path)}">
        <span class="dot"></span>
        <span class="agent">${escape(run?.agent ?? name)}</span>
        ${line}
      </button>`
  })
  return `<div class="reviewers">${rows.join('')}</div>`
}

// Returns the card of `stop`: its title, its badge and the facts the session has data for.
function stopCardHtml(stop, open, selected) {
  const totals = runTotals(stop.runs)
  const lines = []

  if (stop.summary !== null) lines.push(`<div class="note">${escape(stop.summary)}</div>`)

  if (totals.agents.length > 0) lines.push(`<div class="meta mono">${escape(totals.agents.join(', '))}</div>`)

  const usage = usageFacts(totals)
  if (usage.length > 0) lines.push(metaHtml(usage))

  if (stop.progress !== null) {
    const { done, total } = stop.progress
    lines.push(metaHtml([`tasks <b>${done}/${total}</b>`]))
    lines.push(`<div class="bar"><span style="width: ${Math.round((100 * done) / total)}%"></span></div>`)
  }

  if (stop.triage !== null) {
    const counts = Object.entries(TRIAGE_LABELS)
      .filter(([key]) => stop.triage[key] !== null)
      .map(([key, label]) => `<b>${stop.triage[key]}</b> ${label}`)
    lines.push(metaHtml(counts))
  }

  if ((stop.reviewers ?? []).length > 0) lines.push(reviewersHtml(stop.reviewers, open))
  if (stop.note !== null) lines.push(`<div class="note">${escape(stop.note)}</div>`)

  if (stop.links.length > 0) {
    const links = stop.links.map(
      ({ label, path }) => `<button type="button" class="file" data-path="${escape(path)}">${escape(label)}</button>`,
    )
    lines.push(`<div class="meta">${links.join('')}</div>`)
  }

  const durationMs = stop.kind === 'request' ? null : stop.durationMs ?? totals.durationMs
  const when = durationMs !== null ? `<span class="when">${formatDuration(durationMs)}</span>` : ''
  const path = stop.file !== null ? ` data-path="${escape(stop.file)}"` : ''
  return `
    <div class="card${selected ? ' selected' : ''}"${path}>
      <div class="card-head">
        <span class="title">${escape(stop.label)}</span>
        ${when}
      </div>
      ${lines.join('')}
      <div class="card-foot"><span class="badge">${BADGES[stop.state]}</span></div>
    </div>`
}

// Returns the metro line: a round label before each round's first stop, then one row per stop.
function metroHtml(stops, open, selected) {
  const reached = (stop) => stop !== undefined && stop.state !== 'pending'
  const rows = []
  let labelled = 0

  stops.forEach((stop, i) => {
    if (stop.round > 0 && stop.round !== labelled) {
      labelled = stop.round
      rows.push(`
        <div class="stop round">
          <div class="rail">${segHtml('full', reached(stop))}</div>
          <div class="label">Round ${stop.round}</div>
        </div>`)
    }

    const up = i > 0 ? segHtml('up', reached(stop)) : ''
    const down = i < stops.length - 1 ? segHtml('down', reached(stops[i + 1])) : ''
    rows.push(`
      <div class="stop ${stop.state}" data-index="${i}">
        <div class="rail">${up}${down}${nodeHtml(stop)}</div>
        ${stopCardHtml(stop, open, i === selected)}
      </div>`)
  })
  return rows.join('')
}

// Returns the viewer head: the open path, then the label and agents of `stop`.
function viewerHeadHtml(stop, open) {
  if (open === null) return ''

  const path = `<span class="path">${escape(open)}</span>`
  if (stop === undefined) return path

  const reviewer = (stop.reviewers ?? []).find((r) => r.path === open)
  const agents = reviewer ? (reviewer.run?.agent ? [reviewer.run.agent] : []) : runTotals(stop.runs).agents
  return `${path}<span class="by">${escape([stop.label, ...agents].join(' · '))}</span>`
}

// Shows `path` in the pane, or a blank pane when it is null or missing. Leaves the pane alone while the editor is open.
async function showFile(session, files, path, seq) {
  if (editing !== null) return

  const key = path === null ? null : session.dir + path

  let file = null
  if (path !== null && files.includes(path)) file = await fetchFile(encodePath(key)).catch(() => null)
  const text = file?.text ?? null

  if (seq !== renderSeq || editing !== null) return
  if (lastView.key === key && lastView.text === text) return

  const sameFile = lastView.key === key
  lastView = { key, path, text, version: file?.version ?? null }
  $('view').innerHTML = text === null ? '' : fileHtml(path, text)
  drawDiffs($('view'))
  if (!sameFile) $('view').scrollTop = 0
}

// Shows the modal with `message`, and its text field when `input`, above a hidden GitHub view, and resolves with the value of the button that closed it.
function openModal(message, cancellable, input = false) {
  const modal = $('modal')
  $('modal-text').textContent = message
  $('modal-cancel').hidden = !cancellable
  $('modal-input').hidden = !input
  modal.returnValue = ''

  const closed = new Promise((resolve) => {
    modal.addEventListener('close', () => resolve(modal.returnValue), { once: true })
  })
  hideGithubView()
  modal.showModal()
  if (input) $('modal-input').focus()
  return closed
}

async function ask(message) {
  return (await openModal(message, true)) === 'ok'
}

async function tell(message) {
  await openModal(message, false)
}

// Shows the modal with `message` above an empty text field, and resolves with the trimmed text on OK, or null.
async function askText(message) {
  $('modal-input').value = ''

  const answer = await openModal(message, true, true)
  return answer === 'ok' ? $('modal-input').value.trim() : null
}

// Returns the sections of the shortcuts dialog: a heading, then each key with what it does.
function shortcutsHtml() {
  return SHORTCUTS.map(({ title, rows }) => {
    const items = rows.map(({ keys, text }) => {
      const kbds = keys.map((key) => `<kbd>${escape(key)}</kbd>`).join(' ')
      return `<dt>${kbds}</dt><dd>${escape(text)}</dd>`
    })
    return `<h3>${escape(title)}</h3><dl>${items.join('')}</dl>`
  }).join('')
}

// Opens the shortcuts dialog above a hidden GitHub view, or closes it when it is open.
function toggleShortcuts() {
  const dialog = $('shortcuts')
  if (dialog.open) return dialog.close()

  $('shortcuts-list').innerHTML = shortcutsHtml()
  hideGithubView()
  dialog.showModal()
}

// Closes the modal with OK on `Enter` in its text field.
function onModalInputKey(event) {
  if (event.key !== 'Enter') return

  event.preventDefault()
  $('modal').close('ok')
}

// Returns the pop-up rows in config order as `{ path, kind, label, branch, hash, terminals, state }`: each main checkout as a `branch` row, then its linked worktrees as `worktree` rows.
// `terminals` is true for a `worktree` row with terminal tabs, and `state` is the state of its worktree, or null. A checkout with an error has no rows.
function jumpRows() {
  const repos = (reposState?.repos ?? []).filter((repo) => repo.error === null)
  const terminals = (path) => (worktreeTerms.get(path)?.tabs.length ?? 0) > 0

  return repos.flatMap((repo) => [
    {
      path: repo.path,
      kind: 'branch',
      label: shortPath(repo.path),
      branch: repo.branch ?? '',
      hash: prsHash(repo.path),
      terminals: false,
      state: null,
    },
    ...repo.worktrees.map((worktree) => ({
      path: worktree.path,
      kind: 'worktree',
      label: shortPath(worktree.path),
      branch: worktree.branch ?? worktree.head ?? '',
      hash: worktreeHash(worktree.path),
      terminals: terminals(worktree.path),
      state: worktreeState(worktree.path),
    })),
  ])
}

// Returns the pop-up rows that the tab `tab` shows.
function tabRows(tab) {
  const rows = jumpRows()

  if (tab === 'branches') return rows.filter((row) => row.kind === 'branch')
  if (tab === 'worktrees') return rows.filter((row) => row.kind === 'worktree')
  if (tab === 'terminals') return rows.filter((row) => row.kind === 'worktree' && row.terminals)
  return rows
}

// Returns the rows of the active pop-up tab that hold every word of the filter.
function shownJumpRows() {
  const words = filterWords(jump.filter)
  return tabRows(jump.tab).filter((row) => holdsWords(`${row.label} ${row.path} ${row.branch}`, words))
}

// Returns the pop-up line of `row`, tinted when `selected`: its short path, then `▣` in the color of its state when it has terminal tabs.
function jumpRowHtml(row, selected) {
  const term = row.terminals ? `<span class="jump-term term-${row.state}" title="${TERM_STATES[row.state]}">▣</span>` : ''
  return `
    <div class="jump-row${selected ? ' selected' : ''}" data-path="${escape(row.path)}">
      <span class="jump-path">${escape(row.label)}</span>${term}
    </div>`
}

// Opens the pop-up on `tab` with an empty filter and its first row selected, above a hidden GitHub view.
function openJump(tab) {
  jump = { tab, filter: '', selected: null }
  jumpTabsHtml = ''
  $('jump-input').value = ''

  hideGithubView()
  $('jump').showModal()
  $('jump-input').focus()
  renderJump()
}

function closeJump() {
  jump = null
  $('jump').close()
}

// Makes `tab` the active pop-up tab and redraws the pop-up.
function switchJumpTab(tab) {
  jump.tab = tab
  renderJump()
}

// Makes the pop-up tab `step` places after the active tab active, and wraps at both ends.
function stepJumpTab(step) {
  const tabs = JUMP_TABS.map((entry) => entry.tab)
  const index = tabs.indexOf(jump.tab)
  switchJumpTab(tabs[(index + step + tabs.length) % tabs.length])
}

// Makes the clicked tab label the active pop-up tab and focuses the filter field.
function onJumpTabsClick(event) {
  const button = event.target.closest('button[data-tab]')
  if (!button) return

  switchJumpTab(button.dataset.tab)
  $('jump-input').focus()
}

// Draws the tab strip when it changed, then the shown rows of the open pop-up, or `No match.`. Selects the first row when the selected row is not shown.
// The Terminals tab shows a red `⚠` while a tab needs attention.
function renderJump() {
  const tabs = JUMP_TABS.map(({ tab, label }) => {
    const alert = tab === 'terminals' ? terminalsAlertHtml() : ''
    return `<button type="button" class="jump-tab" data-tab="${tab}" aria-selected="${tab === jump.tab}">${label}${alert}</button>`
  }).join('')
  if (jumpTabsHtml !== tabs) {
    $('jump-tabs').innerHTML = tabs
    jumpTabsHtml = tabs
  }

  const rows = shownJumpRows()
  if (!rows.some((row) => row.path === jump.selected)) jump.selected = rows[0]?.path ?? null

  $('jump-list').innerHTML = rows.length > 0
    ? rows.map((row) => jumpRowHtml(row, row.path === jump.selected)).join('')
    : '<p class="empty">No match.</p>'
  $('jump-list').querySelector('.jump-row.selected')?.scrollIntoView({ block: 'nearest' })
}

// Moves the pop-up selection by `step` rows and stops at the first and last rows.
function moveJumpSelection(step) {
  const paths = shownJumpRows().map((row) => row.path)
  if (paths.length === 0) return

  const current = paths.indexOf(jump.selected)
  jump.selected = paths[Math.min(paths.length - 1, Math.max(0, current + step))]
  renderJump()
}

// Closes the pop-up and opens the page of `row` in its own app window for `newWindow` or a standalone window, else in this window.
function openJumpRow(row, newWindow) {
  closeJump()

  if (window.__TAURI__ !== undefined && (newWindow || standaloneRoot !== null)) return openWindow(row.hash)
  location.hash = row.hash
}

// Shows the pop-up rows that match the typed filter and selects the first one.
function onJumpInput(event) {
  jump.filter = event.currentTarget.value
  jump.selected = shownJumpRows()[0]?.path ?? null
  renderJump()
}

// Returns an editor over `text` in `container`.
function createEditor(container, text) {
  const textarea = document.createElement('textarea')
  textarea.className = 'editor'
  textarea.spellcheck = false
  textarea.value = text
  container.replaceChildren(textarea)

  return {
    value: () => textarea.value,
    focus: () => textarea.focus(),
    destroy: () => textarea.remove(),
  }
}

// Opens the shown `.md` file of the current route in the editor, or focuses the editor when it is open.
function startEditing() {
  if (editing !== null) return editing.editor.focus()

  const { key, path, text, version } = lastView
  if (text === null || !path.endsWith('.md')) return
  if (!routeShows(parseRoute(location.hash), lastView)) return

  const editor = createEditor($('view'), text)
  editing = { key, path, version, original: editor.value(), editor, saving: Promise.resolve(true) }
  editor.focus()
}

// Shows `message` after the viewer head, or the plain head when `message` is empty.
function showEditMessage(message) {
  const note = message === '' ? '' : `<span class="warn">${escape(message)}</span>`
  $('viewer-head').innerHTML = sessionView.head + note
}

// Writes the text of `edit` over its file when it changed, and returns the problem, or null when the file holds the text.
async function putFile(edit) {
  const text = edit.editor.value()
  if (text === edit.original) return null

  try {
    const headers = { 'If-Match': `"${edit.version}"` }
    const res = await fetch(encodePath(edit.key), { method: 'PUT', headers, body: text })
    if (res.status === 409) {
      return 'File changed on disk. Copy your text, click outside the editor, leave the file and discard, then reopen it and press w.'
    }
    if (!res.ok) return `Could not save: ${res.status} ${res.statusText}`

    edit.version = etagVersion(res)
    edit.original = text
    return null
  } catch (err) {
    return `Could not save: ${err.message}`
  }
}

// Saves the editor text after any save in flight, shows the problem in the viewer head, and resolves true when the file holds the text.
function saveFile() {
  const edit = editing
  edit.saving = edit.saving.then(async () => {
    const problem = await putFile(edit)
    if (editing === edit) showEditMessage(problem ?? '')
    return problem === null
  })
  return edit.saving
}

// Saves a changed text, then shows the file in view mode. A failed save keeps edit mode.
async function stopEditing() {
  const edit = editing
  if (edit === null) return

  const saved = await saveFile()
  if (!saved || editing !== edit) return

  closeEditor()
  render()
}

// Ends edit mode without saving. The next render shows the file again.
function closeEditor() {
  if (editing === null) return

  editing.editor.destroy()
  editing = null
  lastView = { key: null, path: null, text: null, version: null }
  showEditMessage('')
}

// Returns true when the editor holds text that differs from the saved file.
function hasUnsavedChanges() {
  return editing !== null && editing.editor.value() !== editing.original
}

// Ends edit mode and calls `leave` when the editor holds no unsaved changes or the user discards them, else calls `stay`.
function confirmDiscard(leave, stay = () => {}) {
  if (!hasUnsavedChanges()) {
    closeEditor()
    leave()
    return
  }

  ask('Discard your changes?').then((discard) => {
    if (!discard) return stay()

    closeEditor()
    leave()
  })
}

// Returns true when `route` shows `file`, a `{ key, path }`: its session with its path or with no path.
function routeShows(route, file) {
  const session = route.kind === 'session' ? state.sessions.find((s) => sessionHref(s) === sessionHref(route)) : undefined
  return session !== undefined && file.key === session.dir + (route.path ?? file.path)
}

// Archives `session` once the user confirms, then shows its worktree page, or the sessions page when it has no worktree or that page shows.
// A standalone window shows its root instead, or closes when `session` is its root.
async function archiveSession(session) {
  if (!(await ask(`Archive ${sessionName(session)}? The dashboard will no longer list it.`))) return

  try {
    const res = await fetch(`api/archive/${sessionPath(session)}`, { method: 'POST' })
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not archive ${sessionName(session)}: ${err.message}`)
    return
  }

  if (standaloneRoot !== null && isRoot(parseRoute(sessionHref(session)))) return closeWindow()

  const path = sessionWorktree(session)
  if (standaloneRoot !== null) location.hash = rootHash
  else if (parseRoute(location.hash).kind !== 'sessions') location.hash = path === null ? '#/sessions' : worktreeHash(path)

  poll()
}

function openTool(session, tool) {
  return postOpen(`api/open/${tool}/${sessionPath(session)}`, sessionName(session), tool)
}

function openWorktreeTool(path, tool) {
  return postOpen(`api/open/${tool}?path=${encodeURIComponent(path)}`, path, tool)
}

// Posts `url` to open `name` in `tool`, and tells the user when it fails.
async function postOpen(url, name, tool) {
  try {
    const res = await fetch(url, { method: 'POST' })
    if (!res.ok) throw new Error((await res.text()).trim() || `${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not open ${name} in ${TOOL_LABELS[tool]}: ${err.message}`)
  }
}

function terminalFontSize() {
  return Math.round(fontSize * 0.8)
}

// Returns an xterm in the board's font and colours, opened in `container`, and its fit addon.
function createXterm(container) {
  const xterm = new Terminal({ fontFamily: MONO_FONT, fontSize: terminalFontSize(), theme: TERMINAL_THEME })
  const fit = new FitAddon.FitAddon()
  xterm.loadAddon(fit)
  xterm.open(container)
  return { xterm, fit }
}

// Returns a socket to `url` that writes its bytes to `xterm`, sends the size of `xterm` when it opens, and passes each text frame to `onText`.
function openXtermSocket(xterm, url, onText = () => {}) {
  const socket = new WebSocket(url)
  socket.binaryType = 'arraybuffer'

  socket.onopen = () => {
    if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ cols: xterm.cols, rows: xterm.rows }))
  }
  socket.onmessage = (event) => {
    if (typeof event.data === 'string') onText(event.data)
    else xterm.write(new Uint8Array(event.data))
  }
  return socket
}

// Sends the keys and the size changes of `xterm` to the socket `socketOf` returns, while that socket is open.
function sendXterm(xterm, socketOf) {
  const send = (data) => {
    const socket = socketOf()
    if (socket?.readyState === WebSocket.OPEN) socket.send(data)
  }

  xterm.onData((data) => send(new TextEncoder().encode(data)))
  xterm.onBinary((data) => send(Uint8Array.from(data, (c) => c.charCodeAt(0))))
  xterm.onResize(({ cols, rows }) => send(JSON.stringify({ cols, rows })))
}

// Returns true when `event` is Shift+Enter with no other modifier.
function isShiftEnter(event) {
  return event.key === 'Enter' && event.shiftKey && !event.altKey && !event.ctrlKey && !event.metaKey
}

// Returns the name `tab` shows: the command its shell runs, unless a user named the tab.
function tabTitle(tab) {
  return tab.program === 'shell' && !tab.renamed && tab.command ? tab.command : tab.name
}

function activeWorktreeTerminal(path) {
  const terms = worktreeTerms.get(path)
  return terms?.tabs.find((tab) => tab.id === terms.active)
}

// Returns the terminal tabs of the worktree at `path`, created empty when missing.
function worktreeTermsOf(path) {
  if (!worktreeTerms.has(path)) worktreeTerms.set(path, { tabs: [], active: null, shells: 0 })
  return worktreeTerms.get(path)
}

// Adds a tab named `name` that shows `program` to the worktree at `path`, kept in `#term-store`, and returns it. `serverId` is the id of its terminal on the server, or null until the server gives one.
function addWorktreeTab(path, { name, program, serverId }) {
  const el = document.createElement('div')
  el.className = 'term'
  $('term-store').append(el)

  const { xterm: term, fit } = createXterm(el)
  const observer = new ResizeObserver(() => fit.fit())
  observer.observe(el)

  lastTabId += 1
  const tab = { id: lastTabId, serverId, name, renamed: false, command: null, program, state: 'busy', term, fit, socket: null, el, observer, failed: null, away: false }
  sendXterm(term, () => tab.socket)

  term.attachCustomKeyEventHandler((event) => {
    if (!isShiftEnter(event)) return zoomKey(event) === null && tabKey(event) === null && barKey(event) === null
    if (event.type === 'keydown' && tab.socket?.readyState === WebSocket.OPEN) tab.socket.send(new TextEncoder().encode(SHIFT_ENTER))
    return false
  })

  worktreeTermsOf(path).tabs.push(tab)
  return tab
}

// Opens a tab running `program` in the worktree at `path`, and selects it.
function openWorktreeTerminal(path, program) {
  const terms = worktreeTermsOf(path)
  if (program === 'shell') terms.shells += 1

  const name = program === 'shell' ? `shell ${terms.shells}` : program
  const tab = addWorktreeTab(path, { name, program, serverId: null })
  selectWorktreeTerminal(path, tab.id)

  const query = `path=${encodeURIComponent(path)}&program=${program}&name=${encodeURIComponent(name)}&cols=${tab.term.cols}&rows=${tab.term.rows}`
  connectWorktreeTab(path, tab, `ws://${location.host}/api/terminal?${query}`)
}

// Connects `tab` of `path` to its running terminal on the server, which first replays the output it kept.
function attachWorktreeTerminal(path, tab) {
  tab.term.reset()

  const query = `id=${tab.serverId}&cols=${tab.term.cols}&rows=${tab.term.rows}`
  connectWorktreeTab(path, tab, `ws://${location.host}/api/terminal?${query}`)
}

// Connects `tab` of `path` to `url`. A text frame gives the tab its server id.
// A normal close ends the tab. A take-over leaves the terminal to the other window. Any other close keeps the tab with the reason.
function connectWorktreeTab(path, tab, url) {
  const socket = openXtermSocket(tab.term, url, (text) => {
    const id = jsonOrNull(text)?.id
    if (Number.isInteger(id)) tab.serverId = id
  })
  tab.socket = socket

  socket.onclose = (event) => {
    if (tab.socket !== socket) return
    tab.socket = null

    if (event.code === 1000) return closeWorktreeTerminal(path, tab.id, false)

    if (event.code === TAKEN_CODE) {
      tab.away = true
      tab.term.write(`\r\n\x1b[2mAttached in another window. Select this tab to take it back.\x1b[0m\r\n`)
      return render()
    }

    tab.failed = event.reason || 'the connection closed'
    tab.term.write(`\r\n\x1b[31m${tab.failed}\x1b[0m\r\n`)
    render()
  }
}

// Returns the value of the JSON `text`, or null when it is not JSON.
function jsonOrNull(text) {
  try {
    return JSON.parse(text)
  } catch {
    return null
  }
}

// Posts `action` with `body` for the server terminal of `tab`. Tells the user when a `kill` or a `name` fails, unless the terminal no longer runs.
async function postTerminal(tab, action, body) {
  try {
    const res = await fetch(`api/terminals/${tab.serverId}/${action}`, { method: 'POST', body })
    if (!res.ok && res.status !== 404) throw new Error((await res.text()).trim() || `${res.status} ${res.statusText}`)
  } catch (err) {
    if (action !== 'seen') await tell(`Could not ${action === 'kill' ? 'close' : 'rename'} ${tab.name}: ${err.message}`)
  }
}

// Returns the state of the server row `entry`: `attention`, `busy` or `idle`, and `busy` for any other value.
function terminalState(entry) {
  return ['attention', 'busy', 'idle'].includes(entry.state) ? entry.state : 'busy'
}

// Returns the state of the worktree at `path`: `attention` when a tab needs attention, else `busy` when a tab is busy, else `idle`. Returns null when `path` has no tabs.
function worktreeState(path) {
  const tabs = worktreeTerms.get(path)?.tabs ?? []
  if (tabs.length === 0) return null

  if (tabs.some((tab) => tab.state === 'attention')) return 'attention'
  if (tabs.some((tab) => tab.state === 'busy')) return 'busy'
  return 'idle'
}

// Returns true when a tab of any worktree needs attention.
function anyAttention() {
  return terminalRows().some(({ tab }) => tab.state === 'attention')
}

// Returns `html` in a span of the color and label of the terminal state `state`, or `html` alone when `state` is null.
function termMarkHtml(state, html) {
  if (state === null) return html
  return `<span class="term-${state}" title="${TERM_STATES[state]}">${html}</span>`
}

// Returns the red `⚠` that follows the label of a Terminals tab while a tab needs attention, else ''.
function terminalsAlertHtml() {
  return anyAttention() ? ` ${termMarkHtml('attention', '⚠')}` : ''
}

// Matches the worktree tabs to the running terminals of the server, `list`.
// Drops each tab whose terminal ended, takes the names and states the server holds, and adds a tab for each terminal no tab shows.
// A worktree with a tab that waits for its server id gets no new tab.
function syncTerminals(list) {
  const running = new Map(list.map((entry) => [entry.id, entry]))

  for (const [path, terms] of worktreeTerms) {
    for (const tab of [...terms.tabs]) {
      if (tab.serverId === null) continue

      const entry = running.get(tab.serverId)
      if (entry === undefined) {
        closeWorktreeTerminal(path, tab.id, false)
        continue
      }

      tab.command = entry.command ?? null
      tab.state = terminalState(entry)
      if (renaming?.id !== tab.id) {
        tab.name = entry.name
        tab.renamed = entry.renamed === true
      }
    }
  }

  const known = new Set([...worktreeTerms.values()].flatMap(({ tabs }) => tabs.map((tab) => tab.serverId)))
  for (const entry of list) {
    if (known.has(entry.id) || waitsForServerId(entry.path)) continue

    const tab = addWorktreeTab(entry.path, { name: entry.name, program: entry.program, serverId: entry.id })
    tab.renamed = entry.renamed === true
    tab.command = entry.command ?? null
    tab.state = terminalState(entry)
    const terms = worktreeTerms.get(entry.path)
    const shell = /^shell (\d+)$/.exec(entry.name)
    if (shell !== null) terms.shells = Math.max(terms.shells, Number(shell[1]))
    if (terms.active === null) terms.active = tab.id
  }
}

// Returns true when a tab of the worktree at `path` waits for its server id.
function waitsForServerId(path) {
  return worktreeTerms.get(path)?.tabs.some((tab) => tab.serverId === null && tab.socket !== null) ?? false
}

// Makes tab `id` the active terminal of `path`, then shows and focuses it. A tab attached in another window takes its terminal back.
function selectWorktreeTerminal(path, id) {
  const terms = worktreeTerms.get(path)
  const tab = terms?.tabs.find((t) => t.id === id)
  if (tab === undefined) return

  terms.active = id
  tab.away = false
  render()
  tab.term.focus()
}

// Returns true when the window shows the live output of `tab` of the worktree at `path`: the Terminal item of its worktree page shows, `tab` is the active tab, `tab` is neither away nor failed, and the window has the focus and is visible.
function isShownTab(path, tab) {
  if (tab.away || tab.failed !== null) return false

  const route = parseRoute(location.hash)
  if (route.kind !== 'worktree' || route.path !== path || worktreeView.item !== null) return false
  if (worktreeTerms.get(path)?.active !== tab.id) return false

  return document.hasFocus() && document.visibilityState === 'visible'
}

// Makes each shown tab in attention idle and posts `seen` for it. Returns true when it changed a tab.
function markSeen() {
  let changed = false
  for (const [path, terms] of worktreeTerms) {
    for (const tab of terms.tabs) {
      if (tab.state !== 'attention' || !isShownTab(path, tab)) continue

      tab.state = 'idle'
      postTerminal(tab, 'seen')
      changed = true
    }
  }
  return changed
}

// Marks the shown tab seen when the window gets the focus.
function onWindowFocus() {
  if (markSeen()) render()
}

// Selects the active tab of `path` when it runs `program` and has not failed, else the first such tab, else opens a new one.
function showWorktreeProgram(path, program) {
  const runs = (tab) => tab?.program === program && tab.failed === null
  const active = activeWorktreeTerminal(path)
  const tab = runs(active) ? active : worktreeTerms.get(path)?.tabs.find(runs)
  if (tab === undefined) return openWorktreeTerminal(path, program)

  selectWorktreeTerminal(path, tab.id)
}

// Goes to the worktree page of `path` and shows a tab running `program` there.
function openWorktree(path, program) {
  const route = parseRoute(location.hash)
  if (route.kind !== 'worktree' || route.path !== path) location.hash = worktreeHash(path)

  render()
  showWorktreeProgram(path, program)
}

// Closes tab `id` of `path`: ends its program when `kill` is true, disposes its terminal, and selects the next tab when it was the active one.
function closeWorktreeTerminal(path, id, kill = true) {
  const terms = worktreeTerms.get(path)
  const index = terms?.tabs.findIndex((tab) => tab.id === id) ?? -1
  if (index < 0) return

  const [tab] = terms.tabs.splice(index, 1)
  if (kill && tab.serverId !== null) postTerminal(tab, 'kill')
  if (tab.socket !== null) {
    tab.socket.onclose = null
    tab.socket.close()
  }
  tab.observer.disconnect()
  tab.term.dispose()
  tab.el.remove()

  if (terms.active === id) terms.active = terms.tabs[Math.min(index, terms.tabs.length - 1)]?.id ?? null
  render()
}

// Moves the terminal shown on the worktree page to `#term-store`.
function parkWorktreeTerminal() {
  const view = $('term-view')
  if (view !== null) $('term-store').append(...view.children)
}

// Shows the active terminal of `path` in the pane of the worktree page, and fits it.
// Connects it to its server terminal when it has none, unless it failed or another window holds it.
function showWorktreeTerminal(path) {
  const view = $('term-view')
  const tab = activeWorktreeTerminal(path)
  if (tab === undefined || tab.el.parentElement !== view) {
    parkWorktreeTerminal()
    if (tab === undefined) return

    view.append(tab.el)
    tab.fit.fit()
  }

  if (tab.socket === null && tab.serverId !== null && tab.failed === null && !tab.away) attachWorktreeTerminal(path, tab)
}

// Shows the active terminal alone on the shown Terminal item when `on` is true, and the whole page when false. Returns false when no Terminal item shows or it has no active tab.
function zoomWorktreeTerminal(on) {
  if (worktreeView.el !== $('page').firstElementChild || worktreeView.item !== null) return false

  const tab = activeWorktreeTerminal(worktreeView.path)
  if (tab === undefined) return false

  worktreeView.el.classList.toggle('zoomed', on)
  tab.fit.fit()
  tab.term.focus()
  return true
}

// Runs the tab `action` of `tabKey` on the shown Terminal item. Returns false when no Terminal item shows, a tab name is being edited, or the action has no tab to act on.
function worktreeTabAction(action) {
  if (worktreeView.el !== $('page').firstElementChild || worktreeView.item !== null || renaming !== null) return false

  const path = worktreeView.path
  if (action === 'new') {
    openWorktreeTerminal(path, 'shell')
    return true
  }
  if (action === 'rename') return renameWorktreeTerminal(path)
  return stepWorktreeTerminal(path, action === 'next' ? 1 : -1)
}

// Selects the tab `step` places after the active tab of `path`, wrapping around the ends. Returns false when `path` has no tab.
function stepWorktreeTerminal(path, step) {
  const terms = worktreeTerms.get(path)
  const count = terms?.tabs.length ?? 0
  if (count === 0) return false

  const index = terms.tabs.findIndex((tab) => tab.id === terms.active)
  selectWorktreeTerminal(path, terms.tabs[(index + step + count) % count].id)
  return true
}

// Goes to the bar item `step` places after the selected item of the shown worktree page, wrapping around the ends. Returns false when no worktree page shows.
function stepBarItem(step) {
  if (worktreeView.el === null || worktreeView.el !== $('page').firstElementChild) return false

  const github = worktreeView.item === GITHUB_ITEM
  const selected = state.sessions.find((session) => session.dir === worktreeView.item) ?? null
  const items = barItems(worktreeView.path, selected)
  const index = items.findIndex((item) => isCurrentItem(item, selected, github))
  if (items.length > 1) location.hash = items[(index + step + items.length) % items.length].hash
  return true
}

// Shows the name of the active tab of `path` in a text field, with the text selected. Returns false when `path` has no active tab.
function renameWorktreeTerminal(path) {
  const tab = activeWorktreeTerminal(path)
  if (tab === undefined) return false

  renaming = { path, id: tab.id }
  render()
  const input = $('term-rename')
  input.focus()
  input.select()
  return true
}

// Ends the edit of the tab name, renames the tab to the trimmed text when `save` is true and the text is new and not blank, and focuses its terminal.
function endRename(save) {
  if (renaming === null) return

  const tab = worktreeTerms.get(renaming.path)?.tabs.find((t) => t.id === renaming.id)
  const name = $('term-rename')?.value.trim() ?? ''
  renaming = null
  if (save && tab !== undefined && name !== '' && name !== tabTitle(tab)) {
    tab.name = name
    tab.renamed = true
    if (tab.serverId !== null) postTerminal(tab, 'name', name)
  }

  render()
  tab?.term.focus()
}

// Runs the card action `action` on `session`.
function runAction(session, action) {
  if (action === 'worktree') goToWorktree(session)
  else if (action === 'archive') archiveSession(session)
  else if (action === 'lazygit') openSessionWorktree(session, 'lazygit')
  else openTool(session, action)
}

// Goes to the worktree page of `session`. Does nothing when no checkout lists the worktree of `session`.
function goToWorktree(session) {
  const path = listedWorktree(session.worktree)
  if (path === null) return

  location.hash = worktreeHash(path)
}

// Goes to the worktree page of `session` and shows a tab running `program` there. Tells the user when no checkout lists the worktree of `session`.
function openSessionWorktree(session, program) {
  const path = listedWorktree(session.worktree)
  if (path === null) return tell('Terminals open only in a linked worktree.')

  confirmDiscard(() => openWorktree(path, program))
}

// Runs the action bound to `key` on `session` and returns true when `key` has one.
function sessionAction(session, key) {
  if (!Object.hasOwn(ACTION_KEYS, key)) return false

  runAction(session, ACTION_KEYS[key])
  return true
}

// Runs the worktree action bound to `key` on the worktree at `path` and returns true when `key` has one.
function worktreeAction(path, key) {
  if (!Object.hasOwn(WORKTREE_KEYS, key)) return false

  const action = WORKTREE_KEYS[key]
  if (action === 'lazygit' || action === 'shell') openWorktree(path, action)
  else openWorktreeTool(path, action)
  return true
}

// Posts the checkout of `pr` of the main checkout at `path` and returns the worktree path of the reply.
async function postCheckout(path, pr) {
  const res = await fetch(`api/prs/checkout?path=${encodeURIComponent(path)}&number=${pr.number}`, { method: 'POST' })
  const text = await res.text()
  if (!res.ok) throw new Error(text.trim() || `${res.status} ${res.statusText}`)

  const folder = stringOrNull(JSON.parse(text)?.path)
  if (folder === null) throw new Error('the reply has no worktree path')
  return folder
}

// Posts a new worktree `name` of the main checkout at `path` and returns the worktree path of the reply.
async function postWorktree(path, name) {
  const res = await fetch(`api/worktrees?path=${encodeURIComponent(path)}&name=${encodeURIComponent(name)}`, { method: 'POST' })
  const text = await res.text()
  if (!res.ok) throw new Error(text.trim() || `${res.status} ${res.statusText}`)

  const folder = stringOrNull(JSON.parse(text)?.path)
  if (folder === null) throw new Error('the reply has no worktree path')
  return folder
}

// Asks for a name, creates a worktree of the main checkout at `path` on a new branch, reloads the repos and opens its worktree page.
// Does nothing while a creation runs. Stays where the user went when the page changed meanwhile. Tells the user the error.
async function createWorktree(path) {
  const repo = findRepo(path)
  if (repo === undefined || repo.error !== null || creatingWorktree) return

  creatingWorktree = true
  const name = await askText(`Name of the new worktree of ${repo.org}/${repo.repo}`)
  if (!name) {
    creatingWorktree = false
    return
  }

  const hash = location.hash
  let folder = null
  let problem = null
  try {
    folder = await postWorktree(path, name)
    await loadRepos()
  } catch (err) {
    problem = err.message
  }

  creatingWorktree = false
  if (problem !== null) return tell(`Could not create the worktree ${name}: ${problem}`)
  if (location.hash === hash) location.hash = worktreeHash(folder)
}

// Posts the removal of the linked worktree at `path`.
async function postRemoveWorktree(path) {
  const res = await fetch(`api/worktrees/remove?path=${encodeURIComponent(path)}`, { method: 'POST' })
  if (!res.ok) throw new Error((await res.text()).trim() || `${res.status} ${res.statusText}`)
}

// Closes the terminal tabs of the worktree at `path` and forgets the worktree's tab state.
function dropWorktreeTerminals(path) {
  for (const tab of [...(worktreeTerms.get(path)?.tabs ?? [])]) closeWorktreeTerminal(path, tab.id, false)
  worktreeTerms.delete(path)
}

// Returns the confirm question for the removal of the linked worktree `worktree`.
function removeWorktreeQuestion(worktree) {
  const question = `Remove the worktree ${shortPath(worktree.path)}? Its terminals close.`
  if (!worktree.branch) return question
  return `${question} Git deletes the branch ${worktree.branch} when it is merged.`
}

// Removes the linked worktree at `path` once the user confirms, reloads the repos and selects the worktree's main row.
// With `leave`, then goes to the repos page, or closes a standalone window, unless the page changed meanwhile.
// Does nothing while a removal runs. Tells the user the error.
async function removeWorktree(path, leave) {
  const found = findWorktree(path)
  if (found === null || removingWorktree) return

  removingWorktree = true
  if (!(await ask(removeWorktreeQuestion(found.worktree)))) {
    removingWorktree = false
    return
  }

  const hash = location.hash
  let problem = null
  try {
    await postRemoveWorktree(path)
  } catch (err) {
    problem = err.message
  }

  removingWorktree = false
  if (problem !== null) return tell(`Could not remove the worktree ${shortPath(path)}: ${problem}`)

  await loadRepos()
  dropWorktreeTerminals(path)
  selectedWorktree = found.repo.path

  if (!leave || location.hash !== hash) return render()
  if (standaloneRoot !== null) return closeWindow()
  confirmDiscard(() => { location.hash = '#/' })
}

// Resolves to the path of the worktree that holds `pr` of the main checkout at `path`, after a checkout and a repos reload when none holds it. Resolves to null after it tells the user the error.
async function prCheckout(path, pr) {
  const repo = findRepo(path)
  const worktree = repo === undefined ? undefined : prWorktree(repo, pr)
  if (worktree !== undefined) return worktree.path

  const key = prBusyKey(path, pr)
  prBusy.add(key)
  render()

  let folder = null
  let problem = null
  try {
    folder = await postCheckout(path, pr)
    await loadRepos()
  } catch (err) {
    problem = err.message
  }

  prBusy.delete(key)
  render()
  if (problem !== null) await tell(`Could not check out PR #${pr.number}: ${problem}`)
  return folder
}

// Fetches `pr` of the main checkout at `path` again and replaces its row, or drops the row when the PR is no longer open.
// Does nothing while its refresh runs. Tells the user the error.
async function refreshPr(path, pr) {
  const key = prBusyKey(path, pr)
  if (prRefreshing.has(key)) return

  prRefreshing.add(key)
  render()

  let reply
  try {
    reply = JSON.parse(await fetchText(`api/prs/view?path=${encodeURIComponent(path)}&number=${pr.number}`))
  } catch (err) {
    reply = { error: err.message, pr: null }
  }
  prRefreshing.delete(key)

  const error = stringOrNull(reply?.error)
  const fresh = reply?.pr !== null && typeof reply?.pr === 'object' ? reply.pr : null

  if (error === null && prsState?.path === path) {
    prsState.prs = fresh === null
      ? prsState.prs.filter((shown) => shown.number !== pr.number)
      : prsState.prs.map((shown) => (shown.number === pr.number ? fresh : shown))
  }

  render()
  if (error !== null) await tell(`Could not refresh PR #${pr.number}: ${error}`)
}

// Runs the PR action `action` on `pr` of the main checkout at `path`, after its checkout for every action but `github` and `refresh`. Does nothing while its checkout runs. The page actions run only while this PRs page shows.
async function runPrAction(path, pr, action) {
  if (action === 'refresh') return refreshPr(path, pr)
  if (prBusy.has(prBusyKey(path, pr))) return

  if (action === 'github') {
    return postOpen(`api/prs/open?path=${encodeURIComponent(path)}&number=${pr.number}`, `PR #${pr.number}`, 'github')
  }

  const folder = await prCheckout(path, pr)
  if (folder === null) return

  if (action === 'zed' || action === 'intellij') return openWorktreeTool(folder, action)
  if (action === 'window') return openWindow(worktreeHash(folder))

  const route = parseRoute(location.hash)
  if (route.kind !== 'prs' || route.path !== path) return

  selectedPr = pr.number
  if (action === 'worktree') location.hash = worktreeHash(folder)
  else if (action === 'claude') openWorktree(folder, 'claude')
}

// Scrolls the metro pane to show the card of stop `index`.
function revealStop(index) {
  const card = $('metro').querySelector(`.stop[data-index="${index}"] > .card`)
  if (!card) return

  card.scrollIntoView({ block: 'nearest' })
}

// Shows `path` of `session`, and renders again when the route already names it.
function openPath(session, path) {
  if (parseRoute(location.hash)?.path === path) render()
  else location.hash = fileHref(session, path)
}

// Selects the stop of the clicked card, reviewer or link, and opens its file.
function onMetroClick(event) {
  const target = event.target.closest('[data-path]')
  const stop = event.target.closest('.stop[data-index]')
  if (!target || !stop) return

  const session = state.sessions.find((s) => s.dir === sessionView.dir)
  if (!session) return

  const path = target.dataset.path
  const select = () => {
    sessionView.selected = Number(stop.dataset.index)
    openPath(session, path)
  }

  if (editing?.key === session.dir + path) select()
  else confirmDiscard(select)
}

// Selects the nearest stop with a file in direction `step`, opens the file and returns true when one exists.
function moveStop(session, step) {
  if (sessionView.dir !== session.dir) return false

  const { stops, selected } = sessionView
  let next = selected < 0 && step < 0 ? stops.length - 1 : selected + step
  while (next >= 0 && next < stops.length && stops[next].file === null) next += step
  if (next < 0 || next >= stops.length) return false

  sessionView.selected = next
  revealStop(next)
  openPath(session, stops[next].file)
  return true
}

// Clamps the left column to the page, reserving the splitter and viewer widths. Mobile keeps its stacked layout.
function resizeSessionPage(page, width = leftWidth) {
  const splitterWidth = $('splitter').getBoundingClientRect().width
  if (splitterWidth === 0) return

  const pageWidth = page.getBoundingClientRect().width
  const max = Math.max(0, Math.floor(pageWidth - splitterWidth - RIGHT_MIN))
  const min = Math.min(LEFT_MIN, max)
  leftWidth = Math.round(Math.min(max, Math.max(min, width ?? pageWidth * 0.3)))
  page.style.setProperty('--left', `${leftWidth}px`)
}

// Clamps the left column of the shown session item to the new window width.
function onSessionResize() {
  const page = $('page').firstElementChild
  if (page !== null && page === worktreeView.el && worktreeView.item !== null && worktreeView.item !== GITHUB_ITEM) resizeSessionPage(page)
}

// Resizes the left column while the splitter is dragged.
function onSplitterDown(event) {
  const splitter = event.currentTarget
  const page = splitter.parentElement
  const resize = (move) => {
    resizeSessionPage(page, move.clientX - page.getBoundingClientRect().left)
  }

  event.preventDefault()
  splitter.setPointerCapture(event.pointerId)
  splitter.classList.add('dragging')
  splitter.addEventListener('pointermove', resize)
  splitter.addEventListener(
    'lostpointercapture',
    () => {
      splitter.classList.remove('dragging')
      splitter.removeEventListener('pointermove', resize)
    },
    { once: true },
  )
}

// Shows `session` on its item of the worktree page: its strip, its metro, and `file` or its default file in the viewer.
async function renderSessionContent(session, file) {
  const seq = renderSeq

  const files = await listFiles(session)
  const runs = await loadRuns(session.dir, files)
  const outcomes = await loadOutcomes(session.dir, files)
  const walk = sessionFlow(session) === 'walk' ? await loadWalk(session.dir, files) : null
  if (seq !== renderSeq) return

  const strip = sessionStripHtml(session, runs)
  if (sessionView.card !== strip) {
    $('session-card').innerHTML = strip
    sessionView.card = strip
  }

  const stops = buildStops(session, files, runs, outcomes, walk)
  const open = editing !== null ? editing.path : file ?? defaultFile(session, files, sessionRound(session))
  if (!stopShows(stops[sessionView.selected], open)) sessionView.selected = stopIndexForFile(stops, open)
  sessionView.stops = stops

  const metro = metroHtml(stops, open, sessionView.selected)
  if (sessionView.metro !== metro) {
    const first = sessionView.metro === ''
    const top = $('metro-pane').scrollTop
    $('metro').innerHTML = metro
    $('metro-pane').scrollTop = top
    sessionView.metro = metro
    if (first) revealStop(sessionView.selected)
  }

  const head = viewerHeadHtml(stops[sessionView.selected], open)
  if (sessionView.head !== head) {
    $('viewer-head').innerHTML = head
    sessionView.head = head
  }

  await showFile(session, files, open, seq)
}

function renderNotFound() {
  $('page').innerHTML = '<div class="column"><p class="empty">session not found</p></div>'
}

// Draws the tab strip and marks the tab of `kind` as the current page. The Terminals tab shows a red `⚠` while a tab needs attention.
function renderTabs(kind) {
  const html = TABS.map((tab) => {
    const current = tab.kind === kind ? ' aria-current="page"' : ''
    const alert = tab.kind === 'terminals' ? terminalsAlertHtml() : ''
    return `<a class="tab" href="${tab.href}"${current}>${tab.label}${alert}</a>`
  }).join('')
  if (tabsHtml === html) return

  $('tabs').innerHTML = html
  tabsHtml = html
}

// Shows the page of the route and syncs the window title. While the editor is open, shows only the edited file.
// A route off the Terminal item parks the shown worktree terminal. A route off the Terminal item of the edited tab name drops the edit.
// A route off a GitHub item hides the GitHub view.
// A route into a worktree page records its origin. A route off the PRs page drops its PRs, selection and filter.
// A route off the worktree pages drops their PRs. Redraws the open pop-up. Marks the shown tab in attention seen, then renders again.
function render() {
  if (jump !== null) renderJump()

  const route = parseRoute(location.hash)
  if (editing !== null && !routeShows(route, editing)) return
  if (route.kind !== 'worktree') parkWorktreeTerminal()
  if (route.kind !== 'github' || !hasGithubItem(route.path)) hideGithubView()
  if (renaming !== null && (route.kind !== 'worktree' || route.path !== renaming.path)) renaming = null
  recordPageOrigin(route)
  if (routePage(route) === null) worktreePrs = null

  if (route.kind !== 'prs') {
    prsState = null
    selectedPr = null
    prFilter = ''
  }

  renderSeq += 1
  shownHash = location.hash
  renderTabs(route.kind)
  renderPage(route)
  syncTitle()
  if (markSeen()) render()
}

// Shows the page of `route`.
function renderPage(route) {
  if (route.kind === 'repos') return renderRepos()
  if (route.kind === 'sessions') return renderList()
  if (route.kind === 'terminals') return renderTerminals()
  if (route.kind === 'worktree') return renderWorktreePage(route.path, null, null)
  if (route.kind === 'github') return renderWorktreePage(route.path, null, null, true)
  if (route.kind === 'prs') return renderPrsPage(route.path)

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (!session) return renderNotFound()

  renderWorktreePage(sessionWorktree(session), session, route.path)
}

// Sets `pageOrigin` to the shown page when `route` enters a worktree page from another page, and records the session `route` shows.
function recordPageOrigin(route) {
  const page = routePage(route)
  if (page === null) return

  const shown = parseRoute(shownHash)
  if (pageOrigin === null || routePage(shown) !== page) {
    pageOrigin = { hash: null, selectedPr: null, prFilter: '', dir: null }
    if (shown.kind === 'sessions') pageOrigin.hash = '#/sessions'
    if (shown.kind === 'prs') Object.assign(pageOrigin, { hash: shownHash, selectedPr, prFilter })
  }

  if (route.kind === 'session') pageOrigin.dir = state.sessions.find((s) => sessionHref(s) === sessionHref(route)).dir
}
