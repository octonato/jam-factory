<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jam Board</title>
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="highlight-github.min.css">
<link rel="stylesheet" href="diff2html.min.css">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --ink-2: #55554f;
    --muted: #8a8a82;
    --line: #e2e2dc;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --accent: #2f6fdb;
    --done: var(--good);
    --pending: #c4c4bc;
    --rail: 4px;
    --node: 18px;
    --node-top: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211;
      --surface: #1a1a19;
      --ink: #ededea;
      --ink-2: #b5b5ae;
      --muted: #85857e;
      --line: #2e2e2b;
      --accent: #6c9cf0;
      --pending: #4a4a45;
    }
  }

  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #ededea;
    --ink-2: #b5b5ae;
    --muted: #85857e;
    --line: #2e2e2b;
    --accent: #6c9cf0;
    --pending: #4a4a45;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #page {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }

  a { color: var(--accent); }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  header[hidden] { display: none; }
  header h1 { margin: 0; font-size: 1.286rem; }

  .tabs { display: flex; gap: 4px; }

  .tab {
    padding: 0 6px;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tab:hover { color: var(--accent); }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  #status { color: var(--muted); font-size: 0.857rem; }
  #problems { color: var(--critical); padding: 0 16px; }

  .font-size {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-left: auto;
    color: var(--ink-2);
    font-size: 0.857rem;
  }

  #font-value { min-width: 3em; text-align: center; }

  .font-size button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .font-size button:hover:enabled { border-color: var(--accent); }
  .font-size button:disabled { color: var(--muted); cursor: default; }

  .column {
    max-width: 80%;
    margin: 16px auto;
  }

  .rows { display: grid; gap: 8px; }
  .rows.nested { margin-top: 8px; margin-left: 24px; }
  .rows.nested .empty { margin: 0; }
  .empty { color: var(--muted); }
  .config-error { color: var(--critical); }

  .config-example {
    padding: 10px 12px;
    font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .org-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }

  .org-filter button {
    padding: 2px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .org-filter button:hover { border-color: var(--accent); }
  .org-filter button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

  .repo-filter {
    display: block;
    width: 100%;
    margin-bottom: 16px;
    padding: 6px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    appearance: none;
  }

  .org-group + .org-group { margin-top: 24px; }

  .org-group .org {
    margin: 0 0 8px;
    color: var(--ink-2);
    font-size: 0.857rem;
    font-weight: 600;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone, var(--accent));
    border-radius: 6px;
  }

  .row.waiting { --tone: var(--warning); }
  .row.blocked { --tone: var(--critical); }
  .row.done { --tone: var(--good); }
  .row.main.error { --tone: var(--muted); color: var(--muted); }

  .row:has(> a.body:hover),
  .row.pr:hover {
    border-color: var(--accent);
    border-left-color: var(--tone, var(--accent));
  }

  .row.card.selected,
  .row.main.selected,
  .row.worktree.selected,
  .row.pr.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 3px;
  }

  .row .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    color: inherit;
    text-decoration: none;
  }

  .row.main .body,
  .row.worktree .body,
  .row.pr .body {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .row.pr { grid-template-columns: minmax(0, 1fr); cursor: pointer; }
  .row.pr .body { gap: 4px 16px; padding-bottom: 4px; }
  .row.pr .body > :nth-child(even) { justify-self: end; }
  .row.pr.busy .actions { opacity: 0.4; }

  .row.pr .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 0 6px 14px;
  }

  .pr-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .pr-chip {
    padding: 1px 8px;
    color: var(--chip);
    font-size: 0.8rem;
    background: color-mix(in srgb, var(--chip) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--chip) 45%, transparent);
    border-radius: 999px;
  }

  .pr-chip.to-review { --chip: var(--warning); }
  .pr-chip.reviewed { --chip: var(--good); }
  .pr-chip.draft { --chip: var(--muted); }

  .row .ci::before,
  .row .review::before { content: '● '; }

  .row .ci.passing, .row .review.approved { color: var(--good); }
  .row .ci.failing, .row .review.changes-requested { color: var(--critical); }
  .row .ci.pending, .row .review.review-required { color: var(--warning); }
  .row .ci.none, .row .review.none { color: var(--muted); }
  .row .review { cursor: help; }

  .row .actions {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 8px;
  }

  .icon {
    display: flex;
    padding: 4px;
    color: var(--ink-2);
    font: inherit;
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  .icon svg {
    width: 1.1em;
    height: 1.1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon:hover { color: var(--accent); }
  .icon[data-action="archive"]:hover { color: var(--critical); }

  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .id { font-weight: 600; }
  .row .path { color: var(--muted); }
  .row .label { color: var(--ink-2); font-size: 0.857rem; }
  .row .reason { font-size: 0.857rem; }
  .row .warn { color: var(--warning); }
  .row .marker { color: var(--accent); }
  .row .added { color: var(--good); }
  .row .deleted { color: var(--critical); }

  #pr-card { margin-bottom: 16px; }

  .session-bar .row.pr { cursor: default; }

  .session-bar .row.pr:hover {
    border-color: var(--line);
    border-left-color: var(--tone, var(--accent));
  }

  .steps { display: flex; align-items: center; }

  .steps .line {
    width: 8px;
    height: 2px;
    background: var(--muted);
  }

  .steps .dot {
    --dot: var(--ink-2);
    width: 10px;
    height: 10px;
    border: 2px solid var(--dot);
    border-radius: 50%;
  }

  .steps .dot.past { background: var(--dot); }

  .steps .dot.current {
    --dot: var(--accent);
    background: var(--dot);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot);
  }

  .steps .dot.future { --dot: var(--muted); }
  .steps .dot.waiting { --dot: var(--warning); }
  .steps .dot.blocked { --dot: var(--critical); border-radius: 2px; }
  .steps .dot.done { --dot: var(--good); }

  #page:has(> .session-page) { overflow: hidden; }

  .session-page {
    display: grid;
    grid-template-columns: minmax(0, var(--left, 30%)) 6px minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    height: 100%;
  }

  .session-page.terminal-item {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  .session-page.github-item {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  #metro-pane {
    overflow: auto;
    padding: 16px 16px 48px;
  }

  #splitter {
    cursor: col-resize;
    touch-action: none;
    background: var(--line);
    border-inline: 2px solid var(--bg);
  }

  #splitter:hover, #splitter.dragging { background: var(--accent); }

  .viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--surface);
  }

  .session-page.zoomed { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }

  .session-page.zoomed .session-bar,
  .session-page.zoomed .worktree-bar {
    display: none;
  }

  #modal {
    max-width: 480px;
    padding: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #modal::backdrop { background: rgb(0 0 0 / 40%); }

  #modal p { margin: 0 0 16px; }

  #modal input {
    display: block;
    width: 100%;
    min-width: 320px;
    margin-bottom: 16px;
    padding: 6px 10px;
    color: var(--ink);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #modal input[hidden] { display: none; }

  #modal input:focus { border-color: var(--accent); outline: none; }

  #modal .buttons { display: flex; justify-content: flex-end; gap: 8px; }

  #modal button {
    padding: 4px 12px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  #modal button:hover { border-color: var(--accent); }

  #shortcuts {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
    padding: 16px 20px;
    overflow-y: auto;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #shortcuts::backdrop { background: rgb(0 0 0 / 40%); }

  #shortcuts h2 { margin: 0 0 4px; font-size: 1.143rem; }

  #shortcuts h3 {
    margin: 16px 0 6px;
    color: var(--ink-2);
    font-size: 0.857rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #shortcuts dl {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    gap: 4px 16px;
    margin: 0;
  }

  #shortcuts dt { white-space: nowrap; }
  #shortcuts dd { margin: 0; color: var(--ink-2); }

  #shortcuts kbd {
    padding: 0 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.857rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  #jump {
    width: min(640px, calc(100vw - 32px));
    margin-top: 15vh;
    padding: 16px 20px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #jump::backdrop { background: rgb(0 0 0 / 40%); }

  #jump-tabs {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }

  .jump-tab {
    padding: 2px 0;
    color: var(--ink-2);
    font: inherit;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }

  .jump-tab:hover { color: var(--accent); }
  .jump-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  #jump-input {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    padding: 6px 10px;
    color: var(--ink);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #jump-input:focus { border-color: var(--accent); outline: none; }

  #jump-list {
    display: block;
    max-height: 60vh;
    margin: 0 -5px;
    padding: 5px;
    overflow-y: auto;
  }

  #jump-list .empty { margin: 0; }

  .jump-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 4px;
  }

  .jump-row.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .jump-path { color: var(--ink); }
  .jump-term { color: var(--ink-2); }

  #view {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 24px;
  }

  #view pre {
    margin: 0 0 12px;
    padding: 10px 12px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #view code { font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  #view .editor {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    color: var(--ink);
    font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
  }

  .term-tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  .term-tab {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .term-tab:has(> [aria-pressed="true"]),
  .term-tab:has(> .term-rename) {
    border-color: var(--accent);
  }

  .term-tabs button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .term-tabs button:hover { color: var(--accent); }
  .term-tabs .term-name[aria-pressed="true"] { color: var(--ink); }
  .term-tabs .term-close { padding-left: 0; }
  .term-tabs .term-add { border: 1px solid var(--line); border-radius: 6px; }
  .term-tab.failed .term-name { color: var(--critical); }
  .term-attention { color: var(--critical); }
  .term-idle { color: var(--accent); }
  .term-busy { color: var(--ink-2); }
  .term-dot { margin-right: 4px; font-size: 0.7em; }

  .term-tabs .term-rename {
    width: 12ch;
    padding: 2px 8px;
    color: var(--ink);
    font: inherit;
    font-size: 0.857rem;
    background: var(--bg);
    border: 0;
    border-radius: 6px;
    outline: none;
  }

  .term-view { flex: 1; min-height: 0; overflow: hidden; background: #142b37; }
  .term-view:empty { background: none; }
  .term-view .term { height: 100%; }
  .term-view .xterm { height: 100%; padding: 4px 8px; }

  .github-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  .github-tools button {
    padding: 2px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .github-tools button:hover { color: var(--accent); border-color: var(--accent); }

  .github-view {
    flex: 1;
    min-height: 0;
    padding: 12px 16px;
    color: var(--muted);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .session-bar {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }

  .worktree-bar {
    display: flex;
    flex-wrap: wrap;
    grid-column: 1 / -1;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  .bar-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    color: var(--ink-2);
    font-size: 0.857rem;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .bar-item.waiting { --tone: var(--warning); }
  .bar-item.blocked { --tone: var(--critical); }
  .bar-item.done { --tone: var(--good); }
  .bar-item:is(.waiting, .blocked, .done) { border-left: 3px solid var(--tone); }
  .bar-item .id { font-weight: 600; }
  .bar-item svg { width: 1em; height: 1em; }
  .bar-item:hover { color: var(--accent); }

  .bar-item[aria-current="page"] {
    color: var(--ink);
    border-color: var(--accent);
    border-left-color: var(--tone, var(--accent));
  }

  .session-strip {
    grid-column: 1 / -1;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }

  .session-strip .facts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .session-strip .actions { display: flex; margin: 0 -4px 0 auto; }

  .session-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .session-card .name { min-width: 0; }
  .session-card .id { font-size: 1.1rem; font-weight: 600; }
  .session-card .path { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }

  .session-card .facts {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    gap: 6px;
  }

  .session-card .actions {
    display: flex;
    gap: 2px;
    margin: 0 -4px 0 auto;
  }

  .pill {
    padding: 1px 8px;
    color: var(--ink-2);
    font-size: 0.8rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .metro { display: flex; flex-direction: column; }

  .stop {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
  }

  .rail { position: relative; }

  .seg {
    position: absolute;
    left: calc(50% - var(--rail) / 2);
    width: var(--rail);
  }

  .seg.up { top: 0; height: calc(var(--node-top) + var(--node) / 2); }
  .seg.down { top: calc(var(--node-top) + var(--node) / 2); bottom: 0; }
  .seg.full { top: 0; bottom: 0; }

  .seg.travelled { background: var(--tone, var(--done)); }

  .seg.todo {
    background: repeating-linear-gradient(to bottom, var(--pending) 0 8px, transparent 8px 13px);
  }

  .stop.done { --tone: var(--done); }
  .stop.current { --tone: var(--accent); }
  .stop.waiting { --tone: var(--warning); }
  .stop.blocked { --tone: var(--critical); }
  .stop.pending { --tone: var(--pending); }
  .stop.writing { --tone: var(--accent); }

  .seg.down.travelled, .seg.full.travelled { --tone: var(--done); }

  .node {
    position: absolute;
    z-index: 1;
    top: var(--node-top);
    left: calc(50% - var(--node) / 2);
    display: grid;
    place-items: center;
    width: var(--node);
    height: var(--node);
    color: var(--surface);
    background: var(--surface);
    border: 4px solid var(--tone);
    border-radius: 50%;
  }

  .node svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .done > .rail .node { background: var(--tone); border-width: 0; }
  .blocked > .rail .node { background: var(--tone); border-width: 0; border-radius: 4px; }
  .waiting > .rail .node { background: var(--tone); border-width: 0; }

  .current > .rail .node { animation: pulse 1.6s ease-out infinite; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }

  .node.interchange {

    border-style: dashed;

    align-items: baseline;
    gap: 8px;

    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 1px solid currentColor;
    border-radius: 999px;

    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    color: var(--ink-2);

  .bar {
    height: 4px;
    overflow: hidden;
    background: var(--bg);
    border-radius: 2px;
  }

  .bar > span { display: block; height: 100%; background: var(--tone); }

  .note { color: var(--ink-2); font-size: 0.85rem; }

  .file {

    gap: 2px 8px;
    padding: 4px 6px;

    font: inherit;
    font-size: 0.85rem;
    text-align: left;

  .markdown li > ul, .markdown li > ol { margin: 2px 0 0; }

  }

  .markdown table { border-collapse: collapse; }

  .markdown th:not(.diff *),
  .markdown td:not(.diff *) {
    padding: 6px 10px;
    text-align: left;
    border: 1px solid var(--line);
  }

  .markdown th { background: var(--bg); }

  .markdown :not(pre) > code {
    padding: 1px 4px;
    background: var(--bg);
    border-radius: 4px;
  }

  .markdown blockquote {
    margin-left: 0;
    padding: 0 12px;
    color: var(--ink-2);
    border-left: 3px solid var(--line);
  }

  .markdown hr { border: 0; border-top: 1px solid var(--line); }
  .markdown img { max-width: 100%; }

  .diff, .code { margin: 0 0 12px; }

  .diff { position: relative; }

  #view .d2h-file-header.d2h-sticky-header { top: -16px; }

  #view .d2h-diff-table { font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .diff-bar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 4px;
  }

  .diff-bar button {
    padding: 2px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.8rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .diff-bar button:hover { border-color: var(--accent); }
  .diff-bar button[aria-pressed="true"] { color: var(--surface); background: var(--accent); border-color: var(--accent); }

  .code-path {
    margin-bottom: 4px;
    color: var(--muted);
    font: 0.8rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  #view .code pre { margin: 0; padding: 0; overflow: hidden; }
  #view .code pre code.hljs { padding: 10px 12px; }

  @media (max-width: 800px) {
    .session-page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 55fr) minmax(0, 45fr); }
    #splitter { display: none; }
    .viewer { border-top: 1px solid var(--line); }
  }

  @media (max-width: 640px) {
    .column { max-width: none; margin: 16px; }
    .row .body { grid-template-columns: auto minmax(0, 1fr); }
    .row .name { grid-column: 1 / -1; }
  }

</head>

function escape(text) {
  return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.text()
}

// Returns the text of `url` and its version.
async function fetchFile(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return { text: await res.text(), version: etagVersion(res) }
}

// Returns the `ETag` of `res` without its quotes, or null when it has none.
function etagVersion(res) {
  return res.headers.get('ETag')?.replace(/^"(.*)"$/, '$1') ?? null
}

// Returns the file paths of `session`, or none when the list cannot be fetched.
async function listFiles(session) {
  try {
    const { files } = JSON.parse(await fetchText(`api/files/${sessionPath(session)}`))
    return Array.isArray(files) ? files : []
  } catch {
    return []
  }
}

function stringOrNull(value) {
  return typeof value === 'string' ? value : null
}

function integerOrNull(value) {
  return Number.isInteger(value) ? value : null
}

// Returns the milliseconds from `started` to `ended` when both are valid times and `ended` comes after `started`, else null.
function spanMs(started, ended) {
  const start = Date.parse(started ?? '')
  const end = Date.parse(ended ?? '')
  return Number.isFinite(start) && Number.isFinite(end) && end > start ? end - start : null
}

// Returns the runs of a `runs.jsonl` text and skips each line without a string `stop` and an integer `round`.
function parseRuns(text) {
  const runs = []
  for (const line of String(text).split('\n')) {
    let value
    try {
      value = JSON.parse(line)
    } catch {
      continue
    }
    if (value === null || typeof value !== 'object') continue
    if (typeof value.stop !== 'string' || !Number.isInteger(value.round)) continue

    const started = stringOrNull(value.started)
    const ended = stringOrNull(value.ended)
    runs.push({
      stop: value.stop,
      round: value.round,
      agent: stringOrNull(value.agent),
      task: stringOrNull(value.task),
      model: stringOrNull(value.model),
      started,
      ended,
      durationMs: integerOrNull(value.durationMs) ?? spanMs(started, ended),
      tokens: integerOrNull(value.tokens),
      toolUses: integerOrNull(value.toolUses),
      file: stringOrNull(value.file),
      outcome: stringOrNull(value.outcome),
    })
  }
  return runs
}

// Returns the runs of the session in `dir`, or none when its `runs.jsonl` is absent or cannot be fetched.
async function loadRuns(dir, files) {
  if (!files.includes('runs.jsonl')) return []

  try {
    return parseRuns(await fetchText(encodePath(`${dir}runs.jsonl`)))
  } catch {
    return []
  }
}

// Returns the value of the last `outcome:` line of a `triage.md` text, or null.
function triageOutcome(text) {
  const match = [...String(text).matchAll(/^outcome:\s*(.+?)\s*$/gm)].at(-1)
  return match ? match[1] : null
}

// Returns the triage outcome of each round in `files` whose `triage.md` can be fetched, keyed by round.
async function loadOutcomes(dir, files) {
  const outcomes = {}
  const reads = files.map(async (path) => {
    const round = path.match(/^round-(\d+)\/triage\.md$/)?.[1]
    if (round === undefined) return

    const text = await fetchText(encodePath(dir + path)).catch(() => null)
    if (text !== null) outcomes[round] = triageOutcome(text)
  })
  await Promise.all(reads)
  return outcomes
}

// Returns the summary of a `walk.json` text and its steps with an integer `n` and a string `title`, or null when it has no `steps` array.
function parseWalk(text) {
  let value
  try {
    value = JSON.parse(text)
  } catch {
    return null
  }
  if (value === null || typeof value !== 'object' || !Array.isArray(value.steps)) return null

  const steps = value.steps
    .filter((step) => Number.isInteger(step?.n) && typeof step.title === 'string')
    .map(({ n, title, summary }) => ({ n, title, summary: stringOrNull(summary) }))
  return { summary: stringOrNull(value.summary), steps }
}

// Returns the walk of the session in `dir`, or null when its `walk.json` is absent or cannot be read.
async function loadWalk(dir, files) {
  if (!files.includes('walk.json')) return null

  try {
    return parseWalk(await fetchText(encodePath(`${dir}walk.json`)))
  } catch {
    return null
  }
}

// Returns the path of the finished file of walk step `n`, such as `steps/03.md`.
function stepPath(n) {
  return `steps/${String(n).padStart(2, '0')}.md`
}

// Returns the sessions of the `api/sessions` reply, and a problem line for each entry with an error.
async function loadSessions() {
  const { sessions: entries } = JSON.parse(await fetchText('api/sessions'))
  const sessions = []
  const problems = []

  for (const { org, repo, branch, session: id, category, data, error } of entries) {
    if (error !== undefined) {
      problems.push(`${org}/${repo}/${branch}/${id}: ${error}`)
      continue
    }

    sessions.push({ ...data, org, repo, branch, id, category, dir: `api/file/${org}/${repo}/${branch}/${id}/` })
  }
  return { sessions, problems }
}

// Shows the cached PRs of the main checkout at `path` in `prsState`, then the fresh list, unless the shown page changed meanwhile.
// A failed fresh fetch keeps a shown cached list beside its error.
async function loadPrs(path) {
  const state = { path, prs: [], error: null, loading: true, refreshing: true }
  prsState = state
  loadCachedPrs(state)

  let reply
  try {
    const { error, prs } = JSON.parse(await fetchText(`api/prs?path=${encodeURIComponent(path)}`))
    reply = { prs: Array.isArray(prs) ? prs : [], error: stringOrNull(error) }
  } catch (err) {
    reply = { prs: [], error: err.message }
  }
  if (prsState !== state) return

  if (reply.error === null || state.loading) state.prs = reply.prs
  state.error = reply.error
  state.loading = false
  state.refreshing = false
  render()
}

// Shows the cached PRs of the main checkout of `state` while its fresh list loads. Does nothing without a cached list.

  } catch {
    return

  if (prsState !== state || !state.loading || !Array.isArray(prs)) return

  state.prs = prs
  state.loading = false
  render()
}

// Shows the cached PRs of the main checkout at `path` in `worktreePrs`, then the fresh list, unless the shown page changed meanwhile.
// A failed fetch keeps the shown list.

// Stores the PR list of `url` in `state` and renders, unless the fetch fails, the shown page changed or the fresh list landed first.
async function showWorktreePrs(state, url, fresh) {

  } catch {

  if (worktreePrs !== state || state.fresh || stringOrNull(reply?.error) !== null ||!Array.isArray(reply?.prs)) return

  state.prs = reply.prs
  state.fresh = fresh

function decode(segment) {
  try {
    return decodeURIComponent(segment)
  } catch {
    return segment
  }
}

// Returns the running worktree terminals from `api/terminals`, or null when the fetch fails.
async function loadTerminals() {
  try {
    const { terminals } = JSON.parse(await fetchText('api/terminals'))
    return Array.isArray(terminals) ? terminals : null
  } catch {
    return null
  }
}

// Returns the page of `hash`: the repos, the sessions, the terminals, a worktree with its path, the GitHub item of a worktree with its path, the PRs of a main checkout with its path, or a session with its file path.
function parseRoute(hash) {
  const segments = hash.replace(/^#\/?/, '').split('/').filter((s) => s !== '').map(decode)
  if (segments.length === 0) return { kind: 'repos' }
  if (segments.length === 1 && segments[0] === 'sessions') return { kind: 'sessions' }
  if (segments.length === 1 && segments[0] === 'terminals') return { kind: 'terminals' }
  if (segments.length === 2 && segments[0] === 'worktree') return { kind: 'worktree', path: segments[1] }
  if (segments.length === 2 && segments[0] === 'github') return { kind: 'github', path: segments[1] }
  if (segments.length === 2 && segments[0] === 'prs') return { kind: 'prs', path: segments[1] }

  const [org, repo = '', branch = '', id = '', ...rest] = segments
  return { kind: 'session', org, repo, branch, id, path: rest.length > 0 ? rest.join('/') : null }
}

function worktreeHash(path) {
  return `#/worktree/${encodeURIComponent(path)}`
}

function prsHash(path) {
  return `#/prs/${encodeURIComponent(path)}`
}

function githubHash(path) {
  return `#/github/${encodeURIComponent(path)}`
}

// Returns `{org}/{repo}/{branch}/{id}` of `session`, each segment percent-encoded.
function sessionPath(session) {
  return [session.org, session.repo, session.branch, session.id].map(encodeURIComponent).join('/')
}

function sessionName(session) {
  return `${session.org}/${session.repo}/${session.branch}/${session.id}`
}

function branchName(session) {
  return `${session.org}/${session.repo}/${session.branch}`
}

function sessionHref(session) {
  return `#/${sessionPath(session)}`
}

function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/')
}

function fileHref(session, path) {
  return `${sessionHref(session)}/${encodePath(path)}`
}

function shortPath(worktree) {
  return String(worktree || '').split('/').filter((s) => s !== '').slice(-3).join('/')
}

// Returns true when paths `a` and `b` are equal once one trailing `/` is dropped from each.
function sameWorktree(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string') return false
  return a.replace(/\/$/, '') === b.replace(/\/$/, '')
}

// Returns the sessions whose worktree is `path`.
function sessionsOf(path) {
  return state.sessions.filter((session) => sameWorktree(session.worktree, path))
}

function sessionFlow(session) {
  return session.flow || 'build'
}

// Returns the session id and the short worktree path of `session`.
function sessionDetail(session) {
  return [session.id, shortPath(session.worktree)].filter((part) => part !== '').join(' · ')
}

// Returns the category of the session's folder, else the class of its flow, else the flow name.
function sessionClass(session) {
  if (session.category) return session.category

  const flow = sessionFlow(session)
  return Object.hasOwn(SESSION_CLASSES, flow) ? SESSION_CLASSES[flow] : flow
}

// Returns the phases and stage map of the session's flow, or null for an unknown flow.
function flowOf(session) {
  const flow = sessionFlow(session)
  return Object.hasOwn(FLOWS, flow) ? FLOWS[flow] : null
}

// Returns the stage that sets the phase: `blocked.stage` for a blocked session.
function phaseStage(session) {
  return session.stage === 'blocked' ? session.blocked?.stage : session.stage
}

function currentPhase(session) {
  const flow = flowOf(session)
  const stage = phaseStage(session)
  return flow !== null && Object.hasOwn(flow.stagePhase, stage) ? flow.stagePhase[stage] : null
}

// Returns the problem with the session's flow or stage, or null when both are known.
function sessionProblem(session) {
  if (flowOf(session) === null) return `unknown flow "${sessionFlow(session)}"`
  if (!currentPhase(session)) return `unknown stage "${phaseStage(session)}"`
  return null
}

function sessionMode(session) {
  return session.mode || 'default'
}

function tint(session) {
  if (session.stage === 'triage' && sessionMode(session) === 'interactive') return 'waiting'
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done') return 'done'
  return ''
}

function indicator(session) {
  const phases = flowOf(session)?.phases ?? []
  const current = phases.indexOf(currentPhase(session))
  return phases.map((phase, i) => {
    const step = i < current ? 'past' : i === current ? 'current' : 'future'
    const color = i === current || session.stage === 'done' ? tint(session) : ''
    const line = i > 0 ? '<span class="line"></span>' : ''
    return `${line}<span class="dot ${step} ${color}" title="${phase}"></span>`
  }).join('')
}

// Returns the written and planned steps of a walk session, such as `3/7`.
function walkProgress(session) {
  const done = integerOrNull(session.counts?.stepsDone) ?? 0
  const planned = integerOrNull(session.counts?.stepsPlanned) ?? 0
  return `${done}/${planned}`
}

// Returns the label of a walk row: its class, then its progress while it runs, else its stage.
function walkStepLabel(session) {
  const stage = session.stage === 'walk' ? `writing ${walkProgress(session)}` : session.stage || 'unknown'
  return `${escape(sessionClass(session))} · ${escape(stage)}`
}

function stepLabel(session) {
  if (sessionFlow(session) === 'walk') return walkStepLabel(session)

  const phase = currentPhase(session) || phaseStage(session) || 'unknown'
  const parts = [escape(sessionMode(session))]
  if (sessionFlow(session) !== 'build') parts.push(escape(sessionFlow(session)))
  parts.push(escape(session.stage === 'blocked' ? `blocked at ${phase}` : phase))
  if (session.round > 0) parts.push(`round ${escape(session.round)}`)
  if (session.lastRound === true) parts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    parts.push(`<span class="warn">${escape(counts.deferred - counts.issued)} deferred without issue</span>`)
  }
  return parts.join(' · ')
}

function rowContent(session) {
  return `
    <span class="name"><span class="id">${escape(branchName(session))}</span> <span class="path">${escape(sessionDetail(session))}</span></span>
    <span class="steps">${indicator(session)}</span>
    <span class="label"><span class="pill">${escape(sessionClass(session))}</span> ${stepLabel(session)}</span>`
}

function cardActions(session) {
  return actionButtons(CARD_ACTIONS)
}

// Returns one icon button per entry of `actions`, each with the extra attributes `attributes`.
function actionButtons(actions, attributes = '') {
  return actions.map(({ action, title, icon }) => `
    <button type="button" class="icon" data-action="${action}" title="${title}"${attributes}>
      <svg viewBox="0 0 16 16" aria-hidden="true">${icon}</svg>
    </button>`).join('')
}

// Returns the distinct orgs of `sessions`, sorted.
function sessionOrgs(sessions) {
  return [...new Set(sessions.map((session) => session.org))].sort((a, b) => a.localeCompare(b))
}

// Returns the org the list shows, or null for every org when the filter names none or an org without sessions.
function shownOrg() {
  return sessionOrgs(state.sessions).includes(orgFilter) ? orgFilter : null
}

function shownSessions() {
  const org = shownOrg()
  return state.sessions.filter((session) => org === null || session.org === org)
}

// Returns the org filter: an `All` button, then one button per org.
function orgFilterHtml(orgs, shown) {
  const button = (org, label) => `
    <button type="button" data-org="${escape(org ?? '')}" aria-pressed="${org === shown}">${escape(label)}</button>`
  return `<nav class="org-filter">${[button(null, 'All'), ...orgs.map((org) => button(org, org))].join('')}</nav>`
}

function rowHtml(session) {
  return `
    <div class="row card ${tint(session)}" data-dir="${escape(session.dir)}">
      <a class="body" href="${escape(sessionHref(session))}">${rowContent(session)}</a>
      <span class="actions">${cardActions(session)}</span>
    </div>`
}

// Renders the shown sessions under one heading per org, with the org filter above them.
function renderList() {
  const sessions = shownSessions().sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')))
  const groups = sessionOrgs(sessions).map((org) => `
    <section class="org-group">
      <h2 class="org">${escape(org)}</h2>
      <div class="rows">${sessions.filter((session) => session.org === org).map(rowHtml).join('')}</div>
    </section>`).join('')

  const orgs = sessionOrgs(state.sessions)
  const filter = orgs.length > 0 ? orgFilterHtml(orgs, shownOrg()) : ''
  const html = `<div class="column">${filter}${groups || '<p class="empty">No sessions yet.</p>'}</div>`
  if (listView.el === $('page').firstElementChild && listView.html === html) return showSelection()

  $('page').innerHTML = html
  listView = { html, el: $('page').firstElementChild }
  listView.el.addEventListener('click', onCardAction)
  listView.el.addEventListener('click', onOrgFilter)
  listView.el.addEventListener('click', onRowClick)
  showSelection()
}

// Shows the org of the clicked filter button and stores the choice.
function onOrgFilter(event) {
  const button = event.target.closest('button[data-org]')
  if (!button) return

  orgFilter = button.dataset.org || null
  writeOrgFilter(orgFilter)
  renderList()
}

// Clears the selection when its session is gone or hidden and outlines the selected row.
function showSelection() {
  if (!shownSessions().some((session) => session.dir === selectedDir)) selectedDir = null

  for (const row of $('page').querySelectorAll('.row.card')) {
    row.classList.toggle('selected', row.dataset.dir === selectedDir)
  }
}

// Moves the selection by `step` rows in display order and stops at the first and last rows.
function moveSelection(step) {
  const rows = [...$('page').querySelectorAll('.row.card')]
  if (rows.length === 0) return

  const last = rows.length - 1
  const first = step > 0 ? 0 : last
  const current = rows.findIndex((row) => row.dataset.dir === selectedDir)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedDir = rows[next].dataset.dir
  showSelection()
  rows[next].scrollIntoView({ block: 'nearest' })
}

function onCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const dir = button.closest('[data-dir]')?.dataset.dir
  const session = state.sessions.find((s) => s.dir === dir)
  if (!session) return

  runAction(session, button.dataset.action)
}

// Returns the row of `worktree`, outlined when `selected`: a link to its page with its branch or short sha, its short path, its session count and its open terminal count in the color of its state.
function worktreeRowHtml(worktree, selected) {
  const count = sessionsOf(worktree.path).length
  const terms = worktreeTerms.get(worktree.path)?.tabs.length ?? 0
  const termCount = terms > 0 ? ` · ${termMarkHtml(worktreeState(worktree.path), `▣ ${terms}`)}` : ''
  return `
    <div class="row worktree${selected ? ' selected' : ''}">
      <a class="body" href="${escape(worktreeHash(worktree.path))}">
        <span class="name"><span class="id">${escape(worktree.branch ?? worktree.head ?? '')}</span> <span class="path">${escape(shortPath(worktree.path))}</span></span>
        <span class="label">${count} ${count === 1 ? 'session' : 'sessions'}${termCount}</span>
      </a>
    </div>`
}

// Returns the main row of `repo`, outlined when `selected`: a link to its PRs page with its name and branch.
function mainRowHtml(repo, selected) {
  return `
    <div class="row main${selected ? ' selected' : ''}">
      <a class="body" href="${escape(prsHash(repo.path))}">
        <span class="name"><span class="id">${escape(`${repo.org}/${repo.repo}`)}</span> <span class="path">${escape(repo.branch ?? '')}</span></span>
        <span class="label">PRs ›</span>
      </a>
    </div>`
}

// Returns the greyed main row of `repo`, which has an error: its name, its short path and the error.
function mainErrorRowHtml(repo) {
  return `
    <div class="row main error">
      <div class="body">
        <span class="name"><span class="id">${escape(`${repo.org}/${repo.repo}`)}</span> <span class="path">${escape(shortPath(repo.path))}</span></span>
        <span class="reason">${escape(repo.error)}</span>
      </div>
    </div>`
}

// Returns the checkout `repo` as its main row, then the indented rows of `worktrees` or `No worktrees.`. A checkout with an error has a greyed main row and no worktree rows.
function repoGroupHtml(repo, worktrees) {
  if (repo.error !== null) return `<section class="org-group">${mainErrorRowHtml(repo)}</section>`

  const rows = worktrees.length > 0
    ? worktrees.map((worktree) => worktreeRowHtml(worktree, worktree.path === selectedWorktree)).join('')
    : '<p class="empty">No worktrees.</p>'
  return `
    <section class="org-group">
      ${mainRowHtml(repo, repo.path === selectedWorktree)}
      <div class="rows nested">${rows}</div>
    </section>`
}

// Returns the lowercased words of `query`.
function filterWords(query) {
  return query.toLowerCase().split(/\s+/).filter((word) => word !== '')
}

// Returns true when `text`, lowercased, holds every one of `words`.
function holdsWords(text, words) {
  const lower = text.toLowerCase()
  return words.every((word) => lower.includes(word))
}

// Returns the checkouts the filter shows, in config order, each with its shown worktrees.
function shownRepos() {
  const words = filterWords(repoFilter)
  return (reposState?.repos ?? []).flatMap((repo) => {
    const worktrees = repo.worktrees.filter((worktree) =>
      holdsWords(`${shortPath(worktree.path)} ${worktree.branch ?? worktree.head ?? ''}`, words))
    const shown = worktrees.length > 0 || holdsWords(`${repo.org}/${repo.repo}`, words)
    return shown ? [{ repo, worktrees }] : []
  })
}

// Returns the selectable rows of the repos page in display order as `{ repo, worktree, path }`, where a main row has a null `worktree`. A checkout with an error has no rows.
function shownRows() {
  return shownRepos().flatMap(({ repo, worktrees }) => {
    if (repo.error !== null) return []

    const main = { repo, worktree: null, path: repo.path }
    return [main, ...worktrees.map((worktree) => ({ repo, worktree, path: worktree.path }))]
  })
}

// Returns the shown row whose path is `selectedWorktree`, or undefined.
function selectedRow() {
  return shownRows().find((row) => row.path === selectedWorktree)
}

// Returns the row Enter in the repos filter opens with no selection: the first shown worktree row, else the first shown main row.
function firstFilterRow() {
  const rows = shownRows()
  return rows.find((row) => row.worktree !== null) ?? rows[0]
}

// Returns the page a repos page row opens: the PRs page for a main row, the worktree page for a worktree row.
function rowHash(row) {
  return row.worktree === null ? prsHash(row.path) : worktreeHash(row.path)
}

// Returns the checkouts of the repos page: the config error, the help for an empty config, or one group per shown checkout.
function reposHtml() {
  if (reposState === null) return '<p class="empty">loading…</p>'
  if (reposState.error !== null) return `<p class="config-error">${escape(reposState.error)}</p>`
  if (reposState.repos.length === 0) return REPOS_HELP

  const repos = shownRepos()
  if (repos.length === 0) return '<p class="empty">No worktree matches.</p>'
  return repos.map(({ repo, worktrees }) => repoGroupHtml(repo, worktrees)).join('')
}

// Renders the repos page: the filter field above the shown checkouts. A page already shown keeps its field. A row no longer shown loses the selection.
function renderRepos() {
  if (reposView.el === null || reposView.el !== $('page').firstElementChild) {
    $('page').innerHTML = `
      <div class="column">
        <input type="search" class="repo-filter" id="repo-filter" placeholder="Filter by repo or branch" autocomplete="off" spellcheck="false">
        <div id="repo-list"></div>
      </div>`
    $('repo-filter').value = repoFilter
    $('repo-filter').addEventListener('input', onRepoFilter)
    $('repo-list').addEventListener('click', onRowClick)
    reposView = { el: $('page').firstElementChild, list: '' }
  }

  if (selectedRow() === undefined) selectedWorktree = null

  const list = reposHtml()
  if (reposView.list === list) return

  $('repo-list').innerHTML = list
  reposView.list = list
}

// Shows the checkouts that match the typed filter.
function onRepoFilter(event) {
  repoFilter = event.currentTarget.value
  renderRepos()
}

// Opens a clicked main, worktree or session row, or a bar item, in a new app window on Cmd+click. Does nothing in a browser.
function onRowClick(event) {
  if (!event.metaKey || window.__TAURI__ === undefined) return

  const link = event.target.closest('.row.main > a.body, .row.worktree > a.body, .row.card > a.body, a.bar-item')
  if (!link) return

  event.preventDefault()
  openWindow(link.getAttribute('href'))
}

// Asks the app to open the page at `hash` in a new window.
function openWindow(hash) {
  window.__TAURI__.core
    .invoke('open_window', { hash })
    .catch((err) => tell(`Could not open a window: ${err}`))
}

// Asks the app to open or focus the main Jam Board window.
function openMainWindow() {
  window.__TAURI__?.core
    .invoke('open_main_window')
    .catch((err) => tell(`Could not open Jam Board: ${err}`))
}

// Returns true when the main app window shows the worktree page of `hash`.
function canDetach(hash) {
  return standaloneRoot === null && parseRoute(hash).kind === 'worktree' && window.__TAURI__ !== undefined
}

// Opens the shown worktree in its own window, then returns this window to Repos if it still shows that page.
async function detachWorktree() {
  const hash = location.hash
  if (!canDetach(hash)) return

  try {
    await window.__TAURI__.core.invoke('open_window', { hash })
    if (location.hash === hash) location.hash = '#/'
  } catch (err) {
    tell(`Could not open a window: ${err}`)
  }
}

// Moves the selection by `step` rows of the repos page in display order and stops at the first and last rows.
function moveWorktreeSelection(step) {
  const paths = shownRows().map((row) => row.path)
  if (paths.length === 0) return

  const last = paths.length - 1
  const first = step > 0 ? 0 : last
  const current = paths.indexOf(selectedWorktree)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedWorktree = paths[next]
  renderRepos()
  $('repo-list').querySelector('.row.selected')?.scrollIntoView({ block: 'nearest' })
}

// Returns the tabs of every worktree in page order, each as `{ path, tab }`.
function terminalRows() {
  return [...worktreeTerms].flatMap(([path, terms]) => terms.tabs.map((tab) => ({ path, tab })))
}

// Returns true when `selectedTerm` is tab `tab` of `path`.
function isSelectedTerm(path, tab) {
  return selectedTerm?.path === path && selectedTerm.id === tab.id
}

// Returns what the terminals page says about `tab` before its state: its failure, its program in another window, or its program.
function terminalBaseLabel(tab) {
  if (tab.failed !== null) return tab.failed
  if (tab.away) return `${tab.program} · in another window`
  return tab.program
}

// Returns the HTML of the terminals page label of `tab`: its base label, then its state in the color of its state unless busy.
function terminalLabel(tab) {
  const label = terminalBaseLabel(tab)
  if (tab.state === 'busy') return escape(label)
  return termMarkHtml(tab.state, escape(`${label} · ${TERM_STATES[tab.state]}`))
}

// Returns the terminals page list: one group per worktree with tabs, under its branch and short path in the color of its state, with one link per tab to its worktree page.
function terminalsHtml() {
  const groups = [...worktreeTerms].filter(([, terms]) => terms.tabs.length > 0)
  if (groups.length === 0) return '<p class="empty">No terminals run.</p>'

  return groups.map(([path, terms]) => {
    const worktree = findWorktree(path)?.worktree
    const title = worktree === undefined ? path : `${worktree.branch ?? worktree.head ?? ''} ${shortPath(path)}`

    const rows = terms.tabs.map((tab) => `
      <div class="row worktree${isSelectedTerm(path, tab) ? ' selected' : ''}">
        <a class="body" href="${escape(worktreeHash(path))}" data-path="${escape(path)}" data-tab="${tab.id}">
          <span class="name"><span class="id">${escape(tabTitle(tab))}</span></span>
          <span class="label">${terminalLabel(tab)}</span>
        </a>
      </div>`).join('')

    return `
      <section class="org-group">
        <h2 class="org">${termMarkHtml(worktreeState(path), escape(title))}</h2>
        <div class="rows">${rows}</div>
      </section>`
  }).join('')
}

// Renders the terminals page. A row no longer shown loses the selection.
function renderTerminals() {
  if (!terminalRows().some(({ path, tab }) => isSelectedTerm(path, tab))) selectedTerm = null

  const list = `<div class="column">${terminalsHtml()}</div>`
  if (terminalsView.el === $('page').firstElementChild && terminalsView.list === list) return

  $('page').innerHTML = list
  terminalsView = { el: $('page').firstElementChild, list }
  terminalsView.el.addEventListener('click', onTerminalRowClick)
}

// Makes the clicked tab the active tab of its worktree before its link opens the worktree page.
function onTerminalRowClick(event) {
  const link = event.target.closest('a[data-tab]')
  if (link) pickTerminalTab(link.dataset.path, Number(link.dataset.tab))
}

// Makes tab `id` the active tab of `path`. A tab attached in another window takes its terminal back when shown.
function pickTerminalTab(path, id) {
  const terms = worktreeTerms.get(path)
  const tab = terms?.tabs.find((t) => t.id === id)
  if (tab === undefined) return

  terms.active = id
  tab.away = false
}

// Moves the selection of the terminals page by `step` rows and stops at the first and last rows.
function moveTermSelection(step) {
  const rows = terminalRows()
  if (rows.length === 0) return

  const last = rows.length - 1
  const first = step > 0 ? 0 : last
  const current = rows.findIndex(({ path, tab }) => isSelectedTerm(path, tab))
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedTerm = { path: rows[next].path, id: rows[next].tab.id }
  renderTerminals()
  terminalsView.el.querySelector('.row.selected')?.scrollIntoView({ block: 'nearest' })
}

// Runs the terminals page shortcut for `key` and returns true when it acted.
function terminalsKey(key) {
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    moveTermSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  if (key !== 'Enter' || selectedTerm === null) return false

  pickTerminalTab(selectedTerm.path, selectedTerm.id)
  location.hash = worktreeHash(selectedTerm.path)
  return true
}

// Returns the configured checkout and worktree at `path`, or null when no checkout lists it.
function findWorktree(path) {
  for (const repo of reposState?.repos ?? []) {
    const worktree = repo.worktrees.find((w) => w.path === path)
    if (worktree) return { repo, worktree }
  }
  return null
}

// Returns the path of the linked worktree that `sameWorktree` matches with `path`, or null when no checkout lists one.
function listedWorktree(path) {
  for (const repo of reposState?.repos ?? []) {
    const worktree = repo.worktrees.find((w) => sameWorktree(w.path, path))
    if (worktree) return worktree.path
  }
  return null
}

// Returns the path of the worktree page of `session`: the listed worktree of `session`, else its own worktree, or null when its worktree is missing or empty.
function sessionWorktree(session) {
  if (typeof session.worktree !== 'string' || session.worktree === '') return null
  return listedWorktree(session.worktree) ?? session.worktree
}

// Returns the key of the worktree page that `route` shows: its worktree path, or the href of a session with no worktree. Returns null when it shows none.
function routePage(route) {
  if (route.kind === 'worktree' || route.kind === 'github') return route.path
  if (route.kind !== 'session') return null

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  return session === undefined ? null : sessionWorktree(session) ?? sessionHref(session)
}

// Returns the worktree card: the row of the open PR on its branch, or the checkout's name, the worktree's short path and branch, and its actions.
function worktreeCardHtml(repo, worktree) {
  const pr = worktreePr(repo, worktree)
  if (pr !== undefined) return worktreePrHtml(repo, worktree, pr)

  return `
    <div class="session-card">
      <div class="name">
        <div class="id">${escape(`${repo.org}/${repo.repo}`)}</div>
        <div class="path">${escape(shortPath(worktree.path))}</div>
      </div>
      <div class="facts"><span class="pill">${escape(worktree.branch ?? worktree.head ?? '')}</span></div>
      <div class="actions">${actionButtons(worktreeActions())}</div>
    </div>`
}

// Returns the worktree card icons, with the new-window icon when the shown page can open in its own window.
function worktreeActions() {
  return canDetach(location.hash) ? [...WORKTREE_ACTIONS, DETACH_ACTION] : WORKTREE_ACTIONS
}

// Returns the open PR of `repo` on the branch of `worktree`, or undefined.
function worktreePr(repo, worktree) {
  if (worktreePrs?.path !== repo.path) return undefined
  return worktreePrs.prs?.find((pr) => pr.branch === worktree.branch)
}

// Returns the row of `pr` as the PRs page shows it, with the reviewed and draft chips and the worktree actions.
function worktreePrHtml(repo, worktree, pr) {
  const chips = []
  if (pr.reviewers.length > 0) chips.push('<span class="pr-chip reviewed">reviewed</span>')
  if (pr.draft) chips.push('<span class="pr-chip draft">draft</span>')

  return `
    <div class="row pr">${prBodyHtml(pr, prMarker(repo, pr, worktree))}
      <div class="foot">
        <div class="pr-chips">${chips.join('')}</div>
        <div class="actions">${actionButtons(worktreeActions())}</div>
      </div>
    </div>`
}

// Returns why the repos list lacks a worktree: still loading, the list's error, or not configured.
function missingWorktreeHtml() {
  if (reposState === null) return '<span class="empty">loading…</span>'
  if (reposState.error !== null) return `<span class="config-error">${escape(reposState.error)}</span>`
  return '<span class="empty">not a configured worktree</span>'
}

// Returns the card of the worktree at `path` when the repos list lacks it: its path and the reason.
function missingWorktreeCardHtml(path) {
  return `
    <div class="session-card">
      <div class="name"><div class="path">${escape(path)}</div></div>
      <div class="facts">${missingWorktreeHtml()}</div>
    </div>`
}

// Returns the card of the main checkout of `repo`: the checkout's name, its short path and a `main checkout` pill.
function mainCheckoutCardHtml(repo) {
  return `
    <div class="session-card">
      <div class="name">
        <div class="id">${escape(`${repo.org}/${repo.repo}`)}</div>
        <div class="path">${escape(shortPath(repo.path))}</div>
      </div>
      <div class="facts"><span class="pill">main checkout</span></div>
    </div>`
}

// Returns the card of the worktree page of `path`: the worktree card of `found`, the main checkout card, or the missing worktree card.
function pageCardHtml(path, found) {
  if (found !== null) return worktreeCardHtml(found.repo, found.worktree)

  const repo = findRepo(path)
  if (repo !== undefined) return mainCheckoutCardHtml(repo)
  return missingWorktreeCardHtml(path ?? '')
}

// Returns true when the bar of the worktree at `path` has the GitHub item: in the app, on a configured main or linked checkout.
function hasGithubItem(path) {
  return window.__TAURI__ !== undefined && (findWorktree(path) !== null || findRepo(path) !== undefined)
}

// Returns the items of the bar of the worktree at `path`: the GitHub item when `path` has one, the Terminal item, then one item per session of `path`, then `selected` when `path` lacks it.
// Returns only the item of `selected` when `path` is null.
function barItems(path, selected) {
  if (path === null) return [{ hash: sessionHref(selected), session: selected }]

  const sessions = sessionsOf(path)
  if (selected !== null && !sessions.some((session) => session.dir === selected.dir)) sessions.push(selected)

  const terminal = { hash: worktreeHash(path), session: null }
  const github = hasGithubItem(path) ? [{ hash: githubHash(path), session: null, github: true }] : []
  return [...github, terminal, ...sessions.map((session) => ({ hash: sessionHref(session), session }))]
}

// Returns true when `item` is the current bar item: the GitHub item when `github` is true, else the item of `selected`.
function isCurrentItem(item, selected, github) {
  if (item.github) return github
  return !github && item.session?.dir === selected?.dir
}

// Returns the bar of the worktree at `path`: one link per item, with the GitHub item as the current page when `github` is true, else the item of `selected`.
// The `▣` of the Terminal item takes the color of the worktree state.
function worktreeBarHtml(path, selected, github) {
  return barItems(path, selected).map((item) => {
    const { hash, session } = item
    const current = isCurrentItem(item, selected, github) ? ' aria-current="page"' : ''
    if (item.github) return `<a class="bar-item" href="${escape(hash)}"${current}><svg viewBox="0 0 16 16" aria-hidden="true">${ACTION_ICONS.github}</svg> GitHub</a>`
    if (session === null) return `<a class="bar-item" href="${escape(hash)}"${current}>${termMarkHtml(worktreeState(path), '▣')} Terminal</a>`

    const tone = tint(session)
    return `
      <a class="bar-item${tone === '' ? '' : ` ${tone}`}" href="${escape(hash)}"${current}>
        <span class="id">${escape(session.id)}</span>
        <span class="pill">${escape(sessionFlow(session))}</span>
        ${escape(session.stage ?? 'unknown')}
      </a>`
  }).join('')
}

// Returns the tab strip of `terms`: one tab per terminal with its close button, then the `+` button. Tab `renamingId` shows its name in a text field.
// A tab in attention or idle shows a dot of its state before its name.
function termTabsHtml(terms, renamingId) {
  const dotHtml = (tab) => tab.state === 'busy' ? '' : `<span class="term-dot term-${tab.state}" title="${TERM_STATES[tab.state]}">●</span>`
  const nameHtml = (tab) => tab.id === renamingId
    ? `<input class="term-rename" id="term-rename" value="${escape(tabTitle(tab))}" aria-label="Tab name" spellcheck="false">`
    : `<button type="button" class="term-name" data-term="select" data-tab="${tab.id}" aria-pressed="${tab.id === terms.active}">${dotHtml(tab)}${escape(tabTitle(tab))}</button>`

  const tabs = (terms?.tabs ?? []).map((tab) => `
    <span class="term-tab${tab.failed !== null ? ' failed' : ''}">
      ${nameHtml(tab)}
      <button type="button" class="term-close" data-term="close" data-tab="${tab.id}" title="Close ${escape(tabTitle(tab))}">×</button>
    </span>`)
  return `${tabs.join('')}<button type="button" class="term-add" data-term="add" title="Open a shell (t)">+</button>`
}

// Writes `html` into the element `id` when it differs from the part `key` of the worktree page.
function updateWorktreePart(key, id, html) {
  if (worktreeView[key] === html) return

  $(id).innerHTML = html
  worktreeView[key] = html
}

// Renders the worktree page of `path` with `session` and its `file` selected, or the GitHub item when `github` is true, or the Terminal item when `session` is null, or only the reason for an unlisted `path` with no tabs and no sessions.
// A null `path` renders the page of `session` alone.
function renderWorktreePage(path, session, file, github = false) {
  const found = findWorktree(path)
  const terms = worktreeTerms.get(path)
  const hasTabs = (terms?.tabs.length ?? 0) > 0
  if (found === null && !hasTabs && sessionsOf(path).length === 0 && session === null) {
    parkWorktreeTerminal()
    $('page').innerHTML = `<div class="column"><p>${missingWorktreeHtml()}</p></div>`
    return
  }

  if (found !== null && worktreePrs?.path !== found.repo.path) loadWorktreePrs(found.repo.path)

  const item = github ? GITHUB_ITEM : session?.dir ?? null
  if (worktreeView.el !== $('page').firstElementChild || worktreeView.path !== path || worktreeView.item !== item) {
    buildWorktreePage(path, item)
  }

  updateWorktreePart('card', 'worktree-card', pageCardHtml(path, found))
  updateWorktreePart('bar', 'worktree-bar', worktreeBarHtml(path, session, github))

  if (session !== null) return renderSessionContent(session, file)
  if (github) return renderGithubTab(path)

  if (renaming !== null && !terms?.tabs.some((tab) => tab.id === renaming.id)) renaming = null
  const tabs = found === null && !hasTabs ? missingWorktreeHtml() : termTabsHtml(terms, renaming?.id)
  if (renaming === null || $('term-rename') === null) updateWorktreePart('tabs', 'term-tabs', tabs)
  showWorktreeTerminal(path)
  if (activeWorktreeTerminal(path) === undefined) worktreeView.el.classList.remove('zoomed')
}

// Replaces `#page` with the worktree page of `path`, which shows the session whose dir is `item`, the GitHub item when `item` is `GITHUB_ITEM`, or the terminal tabs when `item` is null.
function buildWorktreePage(path, item) {
  parkWorktreeTerminal()
  $('page').innerHTML = worktreePageHtml(item)

  const page = $('page').firstElementChild
  $('worktree-card').addEventListener('click', onWorktreeCardAction)
  $('worktree-bar').addEventListener('click', onRowClick)
  worktreeView = { path, el: page, item, card: '', bar: '', tabs: '' }

  if (item === GITHUB_ITEM) {
    $('github-tools').addEventListener('click', onGithubToolsClick)
    return
  }

  if (item === null) {
    $('term-tabs').addEventListener('click', onTermTabsClick)
    $('term-tabs').addEventListener('keydown', onRenameKey)
    $('term-tabs').addEventListener('focusout', onRenameBlur)
    return
  }

  resizeSessionPage(page)
  $('session-card').addEventListener('click', onCardAction)
  $('metro').addEventListener('click', onMetroClick)
  $('splitter').addEventListener('pointerdown', onSplitterDown)
  $('view').addEventListener('click', onDiffToggle)
  sessionView = { dir: item, card: '', metro: '', head: '', stops: [], selected: -1 }
  lastView = { key: null, path: null, text: null, version: null }
}

// Returns the markup of the worktree page that shows `item`: the card and the bar, then the terminal tabs when `item` is null, the GitHub toolbar and view when `item` is `GITHUB_ITEM`, else the session strip, the metro, the splitter and the viewer.
function worktreePageHtml(item) {
  const head = `
        <div class="session-bar" id="worktree-card"></div>
        <nav class="worktree-bar" id="worktree-bar"></nav>`

  if (item === null) {
    return `
      <div class="session-page terminal-item">${head}
        <section class="viewer">
          <div class="term-tabs" id="term-tabs"></div>
          <div class="term-view" id="term-view"></div>
        </section>
      </div>`
  }

  if (item === GITHUB_ITEM) {
    return `
      <div class="session-page github-item">${head}
        <section class="viewer">
          <div class="github-tools" id="github-tools">
            <button type="button" data-github="back">Back</button>
            <button type="button" data-github="reload" title="Reload (⌘R)">Reload</button>
            <button type="button" data-github="refetch" title="Load the open PR, or the repo page">PR/Repo</button>
            <button type="button" data-github="browser">Open in browser</button>
          </div>
          <div class="github-view" id="github-view"></div>
        </section>
      </div>`
  }

  return `
      <div class="session-page">${head}
        <div class="session-strip" id="session-card"></div>
        <section id="metro-pane">
          <div class="metro" id="metro"></div>
        </section>
        <div id="splitter"></div>
        <section class="viewer">
          <div class="viewer-head" id="viewer-head"></div>
          <div id="view"></div>
        </section>
      </div>`
}

// Fetches the GitHub URL of the worktree at `path` when the page has none for it, writes the fetch state in the placeholder, and shows the GitHub view once the URL is known.
function renderGithubTab(path) {
  if (!hasGithubItem(path)) return
  if (githubTab.path !== path) fetchGithubUrl(path, false)

  const text = githubTab.loading ? 'loading…' : githubTab.error ?? ''
  if ($('github-view').textContent !== text) $('github-view').textContent = text

  if (githubTab.url === null) hideGithubView()
  else showGithubView()
}

// Fetches the GitHub URL of the worktree at `path` into `githubTab`, loads it in the GitHub view when `load`, then renders.
// A refetch of the same path keeps its URL while it runs. A later fetch drops the reply.
async function fetchGithubUrl(path, load) {
  const seq = githubTab.seq + 1
  const shown = githubTab.path === path ? githubTab.url : null
  githubTab = { path, url: shown, error: null, loading: true, seq }

  let reply
  try {
    const { url, error } = JSON.parse(await fetchText(`api/github?path=${encodeURIComponent(path)}`))
    reply = { url: stringOrNull(url), error: stringOrNull(error) }
  } catch (err) {
    reply = { url: null, error: err.message }
  }
  if (githubTab.seq !== seq) return

  Object.assign(githubTab, reply, { loading: false })
  if (load && reply.url !== null) loadGithubView()
  render()
}

// Returns true while the jump pop-up, the modal or the shortcuts help shows.
function githubOverlayOpen() {
  return GITHUB_OVERLAYS.some((id) => $(id).open)
}

// Returns true when the route and the page show the GitHub item of the worktree at `githubTab.path`.
function githubItemShows() {
  const route = parseRoute(location.hash)
  if (route.kind !== 'github' || route.path !== githubTab.path) return false

  return worktreeView.el === $('page').firstElementChild && worktreeView.item === GITHUB_ITEM && worktreeView.path === route.path
}

// Runs `step` once the GitHub view commands queued before it settle, and returns its promise.
function queueGithub(step) {
  const run = githubQueue.then(step)
  githubQueue = run.catch(() => {})
  return run
}

// Shows the GitHub view over its placeholder, or moves it there when the placeholder moved.
// Does nothing unless the page shows the GitHub item of `githubTab` with its URL and no pop-up shows.
function showGithubView() {
  if (githubTab.url === null || !githubItemShows() || githubOverlayOpen()) return

  const rect = $('github-view').getBoundingClientRect()
  const bounds = { x: rect.left, y: rect.top, width: rect.width, height: rect.height }
  if (githubView.shown && JSON.stringify(bounds) === JSON.stringify(githubView.bounds)) return

  const { path, url, seq } = githubTab
  githubView.shown = true
  githubView.bounds = bounds
  queueGithub(async () => {
    await window.__TAURI__.core.invoke('github_view_show', { path, url, ...bounds })
    githubView.created = true
  }).catch((err) => failGithubView(seq, err))
}

// Hides the GitHub view when the page asked it to show.
function hideGithubView() {
  if (!githubView.shown) return

  githubView.shown = false
  queueGithub(() => window.__TAURI__.core.invoke('github_view_hide')).catch((err) => tell(String(err)))
}

// Loads the URL of `githubTab` in the GitHub view when the view exists by the time the commands queued before it settle.
function loadGithubView() {
  const { path, url, seq } = githubTab
  queueGithub(async () => {
    if (githubView.created) await window.__TAURI__.core.invoke('github_view_load', { path, url })
  }).catch((err) => failGithubView(seq, err))
}

// Writes `err` in the placeholder of the GitHub item and hides the view, unless a later fetch started.
function failGithubView(seq, err) {
  if (githubTab.seq !== seq) return

  githubTab.url = null
  githubTab.error = String(err)
  render()
}

// Runs the GitHub view action of the clicked toolbar button, or fetches the URL of the GitHub item again for PR/Repo.
// Back and Reload do nothing while the view hides, and Open in browser does nothing while the GitHub item has no URL.
function onGithubToolsClick(event) {
  const button = event.target.closest('button[data-github]')
  if (!button || !hasGithubItem(worktreeView.path)) return

  const action = button.dataset.github
  if (action === 'refetch') {
    fetchGithubUrl(worktreeView.path, true)
    render()
    return
  }

  const ready = action === 'browser' ? githubTab.url !== null : githubView.shown
  if (!ready) return

  queueGithub(() => window.__TAURI__.core.invoke('github_view_action', { action })).catch((err) => tell(String(err)))
}

// Opens the worktree in the tool of the clicked card button, in its own window, or lazygit in a new tab, or the Terminal item with a lazygit tab when a session item shows.
function onWorktreeCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const path = worktreeView.path
  if (button.dataset.action === 'detach') detachWorktree()
  else if (button.dataset.action !== 'lazygit') openWorktreeTool(path, button.dataset.action)
  else if (worktreeView.item === null) openWorktreeTerminal(path, 'lazygit')
  else confirmDiscard(() => openWorktree(path, 'lazygit'))
}

// Opens a shell, or selects or closes a tab, for the clicked button of the tab strip.
function onTermTabsClick(event) {
  const button = event.target.closest('button[data-term]')
  if (!button) return

  const path = worktreeView.path
  const id = Number(button.dataset.tab)
  if (button.dataset.term === 'add') openWorktreeTerminal(path, 'shell')
  else if (button.dataset.term === 'select') selectWorktreeTerminal(path, id)
  else if (button.dataset.term === 'close') closeWorktreeTerminal(path, id)
}

// Saves the edited tab name on `Enter` and drops it on `Escape`. Keeps every key in the text field from the board shortcuts.
function onRenameKey(event) {
  if (event.target.id !== 'term-rename') return

  event.stopPropagation()
  if (event.key === 'Enter' || event.key === 'Escape') {
    event.preventDefault()
    endRename(event.key === 'Enter')
  }
}

// Saves the edited tab name when the text field loses the focus.
function onRenameBlur(event) {
  if (event.target.id === 'term-rename') endRename(true)
}

// Returns the configured checkout whose main checkout is at `path`, or undefined.
function findRepo(path) {
  return reposState?.repos.find((repo) => repo.path === path)
}

// Returns the linked worktree of `repo` on the branch of `pr`, or undefined.
function prWorktree(repo, pr) {
  return repo.worktrees.find((worktree) => worktree.branch === pr.branch)
}

// Returns the group of `pr` in the PR list: 0 checked out in `repo`, 1 open without reviews, 2 open with reviews, 3 draft.
function prGroup(repo, pr) {
  if (repo !== undefined && prWorktree(repo, pr) !== undefined) return 0
  if (pr.draft) return 3
  return pr.reviewers.length === 0 ? 1 : 2
}

// Returns the PRs of the shown PRs page whose `#{number} {title} {author} {branch}` holds every filter word, sorted by `prGroup`.
function shownPrs() {
  const words = filterWords(prFilter)
  const repo = findRepo(prsState?.path)

  return (prsState?.prs ?? [])
    .filter((pr) => holdsWords(`#${pr.number} ${pr.title} ${pr.author} ${pr.branch}`, words))
    .sort((a, b) => prGroup(repo, a) - prGroup(repo, b))
}

// Returns the icons of a PR row, with the checkout title on the worktree icon when the PR is not `checkedOut`.
function prActions(checkedOut) {
  return PR_ACTIONS.map((entry) => (entry.action === 'worktree' && !checkedOut ? { ...entry, title: PR_CHECKOUT_TITLE } : entry))
}

// Returns the key of `pr` of the main checkout at `path` in `prBusy`.
function prBusyKey(path, pr) {
  return `${path}#${pr.number}`
}

// Returns the hover text of the review state of `pr`: each reviewer with the state of their latest review.
function reviewersTitle(pr) {
  if (pr.reviewers.length === 0) return 'No reviews yet'
  return `Reviewed by ${pr.reviewers.map((reviewer) => `${reviewer.login} (${reviewer.state})`).join(', ')}`
}

// Returns the chips of `pr`: reviewed or to review, then draft.
function prChips(pr) {
  const chips = []
  if (pr.reviewers.length > 0) chips.push('<span class="pr-chip reviewed">reviewed</span>')
  else if (pr.reviewRequested) chips.push('<span class="pr-chip to-review">to review</span>')
  if (pr.draft) chips.push('<span class="pr-chip draft">draft</span>')
  return chips.join('')
}

// Returns the state of the checkout or refresh of `pr` in `repo` while one runs, else its worktree marker, else nothing.
function prMarker(repo, pr, worktree) {
  const key = prBusyKey(repo.path, pr)
  if (prBusy.has(key)) return '<span class="marker">checking out…</span>'
  if (prRefreshing.has(key)) return '<span class="marker">refreshing…</span>'
  if (worktree !== undefined) return `<span class="marker">● ${escape(shortPath(worktree.path))}</span>`
  return ''
}

// Returns the body of the row of `pr`: number, title, author and line counts; `marker`, CI and review states.
function prBodyHtml(pr, marker) {
  const lines = `<span class="added">+${escape(pr.additions)}</span> <span class="deleted">−${escape(pr.deletions)}</span>`
  const ci = `<span class="ci ${escape(pr.ci)}">${escape(CI_LABELS[pr.ci] ?? pr.ci)}</span>`
  const review = `<span class="review ${escape(pr.review)}" title="${escape(reviewersTitle(pr))}">${escape(REVIEW_LABELS[pr.review] ?? pr.review)}</span>`

  return `
      <div class="body">
        <span class="name"><span class="id">#${escape(pr.number)}</span> ${escape(pr.title)}</span>
        <span class="label">${escape(pr.author)} · ${lines}</span>
        <span class="label">${marker}</span>
        <span class="label">${ci} · ${review}</span>
      </div>`
}

// Returns the row of `pr` in `repo`, outlined when `selected`: its body with the checkout or refresh state or worktree marker; chips and icons.
function prRowHtml(repo, pr, selected) {
  const worktree = prWorktree(repo, pr)
  const key = prBusyKey(repo.path, pr)
  const busy = prBusy.has(key) || prRefreshing.has(key)
  const number = escape(pr.number)

  return `
    <div class="row pr${selected ? ' selected' : ''}${busy ? ' busy' : ''}" data-number="${number}">${prBodyHtml(pr, prMarker(repo, pr, worktree))}
      <div class="foot">
        <div class="pr-chips">${prChips(pr)}</div>
        <div class="actions">${actionButtons(prActions(worktree !== undefined), ` data-number="${number}"`)}</div>
      </div>
    </div>`
}

// Returns the card of the PRs page of `repo`: its name, its short path, the count of the shown list, whether a fresh list loads, and its actions.
function prCardHtml(repo) {
  const shown = prsState !== null && !prsState.loading && (prsState.error === null || prsState.prs.length > 0)
  const count = shown ? prsState.prs.length : 0

  const facts = []
  if (shown) facts.push(`<span class="pill">${count} ${count === 1 ? 'PR' : 'PRs'}</span>`)
  if (shown && prsState.refreshing) facts.push('<span class="pill">refreshing…</span>')

  return `
    <div class="session-card">
      <div class="name">
        <div class="id">${escape(`${repo.org}/${repo.repo}`)}</div>
        <div class="path">${escape(shortPath(repo.path))}</div>
      </div>
      <div class="facts">${facts.join('')}</div>
      <div class="actions">${actionButtons(PRS_CARD_ACTIONS)}</div>
    </div>`
}

// Creates a worktree for the clicked card button of the PRs page.
function onPrCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (button?.dataset.action === 'new-worktree') createWorktree(prsView.path)
}

// Returns the PR list of the PRs page of `repo`: loading, the error, no PRs, no match, or one row per shown PR. A cached list shows below the error of its refresh.
function prListHtml(repo) {
  if (prsState === null || prsState.loading) return '<p class="empty">loading…</p>'

  const error = prsState.error === null ? '' : `<p class="config-error">${escape(prsState.error)}</p>`
  if (prsState.prs.length === 0) return error || '<p class="empty">No open PRs.</p>'

  const prs = shownPrs()
  if (prs.length === 0) return `${error}<p class="empty">No PR matches.</p>`
  return `${error}<div class="rows">${prs.map((pr) => prRowHtml(repo, pr, pr.number === selectedPr)).join('')}</div>`
}

// Returns why the repos list lacks the main checkout of a PRs page: still loading, the list's error, or not configured.
function missingRepoHtml() {
  if (reposState === null) return '<span class="empty">loading…</span>'
  if (reposState.error !== null) return `<span class="config-error">${escape(reposState.error)}</span>`
  return '<span class="empty">not a configured repo</span>'
}

// Writes `html` into the element `id` when it differs from the part `key` of the PRs page.
function updatePrsPart(key, id, html) {
  if (prsView[key] === html) return

  $(id).innerHTML = html
  prsView[key] = html
}

// Renders the PRs page of the main checkout at `path`: its card, the filter field and the shown PRs. A page already shown keeps its field. A page without PRs for `path` fetches them. A PR no longer shown loses the selection once a list shows.
function renderPrsPage(path) {
  const repo = findRepo(path)
  if (repo === undefined) {
    $('page').innerHTML = `<div class="column"><p>${missingRepoHtml()}</p></div>`
    return
  }

  if (prsView.el === null || prsView.el !== $('page').firstElementChild || prsView.path !== path) {
    $('page').innerHTML = `
      <div class="column">
        <div id="pr-card"></div>
        <input type="search" class="repo-filter" id="pr-filter" placeholder="Filter by number, title, author or branch" autocomplete="off" spellcheck="false">
        <div id="pr-list"></div>
      </div>`
    $('pr-filter').value = prFilter
    $('pr-filter').addEventListener('input', onPrFilter)
    $('pr-list').addEventListener('click', onPrListClick)
    $('pr-card').addEventListener('click', onPrCardAction)
    prsView = { path, el: $('page').firstElementChild, card: '', list: '' }
  }

  if (prsState?.path !== path) loadPrs(path)
  if (!prsState.loading && !shownPrs().some((pr) => pr.number === selectedPr)) selectedPr = null
