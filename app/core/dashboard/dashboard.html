<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jam Board</title>
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="highlight-github.min.css">
<link rel="stylesheet" href="diff2html.min.css">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --ink-2: #55554f;
    --muted: #8a8a82;
    --line: #e2e2dc;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --accent: #2f6fdb;
    --done: var(--good);
    --pending: #c4c4bc;
    --rail: 4px;
    --node: 18px;
    --node-top: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211;
      --surface: #1a1a19;
      --ink: #ededea;
      --ink-2: #b5b5ae;
      --muted: #85857e;
      --line: #2e2e2b;
      --accent: #6c9cf0;
      --pending: #4a4a45;
    }
  }

  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #ededea;
    --ink-2: #b5b5ae;
    --muted: #85857e;
    --line: #2e2e2b;
    --accent: #6c9cf0;
    --pending: #4a4a45;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #page {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }

  a { color: var(--accent); }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  header h1 { margin: 0; font-size: 1.286rem; }

  .tabs { display: flex; gap: 4px; }

  .tab {
    padding: 0 6px;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tab:hover { color: var(--accent); }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  #status { color: var(--muted); font-size: 0.857rem; }
  #problems { color: var(--critical); padding: 0 16px; }

  .font-size {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-left: auto;
    color: var(--ink-2);
    font-size: 0.857rem;
  }

  #font-value { min-width: 3em; text-align: center; }

  .font-size button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .font-size button:hover:enabled { border-color: var(--accent); }
  .font-size button:disabled { color: var(--muted); cursor: default; }

  .column {
    max-width: 80%;
    margin: 16px auto;
  }

  .rows { display: grid; gap: 8px; }
  .rows.nested { margin-top: 8px; margin-left: 24px; }
  .rows.nested .empty { margin: 0; }
  .empty { color: var(--muted); }
  .config-error { color: var(--critical); }

  .config-example {
    padding: 10px 12px;
    font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .org-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }

  .org-filter button {
    padding: 2px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .org-filter button:hover { border-color: var(--accent); }
  .org-filter button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

  .repo-filter {
    display: block;
    width: 100%;
    margin-bottom: 16px;
    padding: 6px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    appearance: none;
  }

  .org-group + .org-group { margin-top: 24px; }

  .org-group .org {
    margin: 0 0 8px;
    color: var(--ink-2);
    font-size: 0.857rem;
    font-weight: 600;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone, var(--accent));
    border-radius: 6px;
  }

  .row.waiting { --tone: var(--warning); }
  .row.blocked { --tone: var(--critical); }
  .row.done { --tone: var(--good); }
  .row.main.error { --tone: var(--muted); color: var(--muted); }

  .row:has(> a.body:hover),
  .row.pr:hover {
    border-color: var(--accent);
    border-left-color: var(--tone, var(--accent));
  }

  .row.card.selected,
  .row.main.selected,
  .row.worktree.selected,
  .row.pr.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 3px;
  }

  .row .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    color: inherit;
    text-decoration: none;
  }

  .row.main .body,
  .row.worktree .body,
  .row.session .body,
  .row.pr .body {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .row.pr { grid-template-columns: minmax(0, 1fr); cursor: pointer; }
  .row.pr .body { gap: 4px 16px; padding-bottom: 4px; }
  .row.pr .body > :nth-child(even) { justify-self: end; }
  .row.pr.busy .actions { opacity: 0.4; }

  .row.pr .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 0 6px 14px;
  }

  .pr-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .pr-chip {
    padding: 1px 8px;
    color: var(--chip);
    font-size: 0.8rem;
    background: color-mix(in srgb, var(--chip) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--chip) 45%, transparent);
    border-radius: 999px;
  }

  .pr-chip.to-review { --chip: var(--warning); }
  .pr-chip.reviewed { --chip: var(--good); }
  .pr-chip.draft { --chip: var(--muted); }

  .row .ci::before,
  .row .review::before { content: '● '; }

  .row .ci.passing, .row .review.approved { color: var(--good); }
  .row .ci.failing, .row .review.changes-requested { color: var(--critical); }
  .row .ci.pending, .row .review.review-required { color: var(--warning); }
  .row .ci.none, .row .review.none { color: var(--muted); }
  .row .review { cursor: help; }

  .row .actions {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 8px;
  }

  .icon {
    display: flex;
    padding: 4px;
    color: var(--ink-2);
    font: inherit;
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  .icon svg {
    width: 1.1em;
    height: 1.1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon:hover { color: var(--accent); }
  .icon[data-action="archive"]:hover { color: var(--critical); }

  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .id { font-weight: 600; }
  .row .path { color: var(--muted); }
  .row .label { color: var(--ink-2); font-size: 0.857rem; }
  .row .reason { font-size: 0.857rem; }
  .row .warn { color: var(--warning); }
  .row .marker { color: var(--accent); }
  .row .added { color: var(--good); }
  .row .deleted { color: var(--critical); }

  #pr-card { margin-bottom: 16px; }

  .steps { display: flex; align-items: center; }

  .steps .line {
    width: 8px;
    height: 2px;
    background: var(--muted);
  }

  .steps .dot {
    --dot: var(--ink-2);
    width: 10px;
    height: 10px;
    border: 2px solid var(--dot);
    border-radius: 50%;
  }

  .steps .dot.past { background: var(--dot); }

  .steps .dot.current {
    --dot: var(--accent);
    background: var(--dot);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot);
  }

  .steps .dot.future { --dot: var(--muted); }
  .steps .dot.waiting { --dot: var(--warning); }
  .steps .dot.blocked { --dot: var(--critical); border-radius: 2px; }
  .steps .dot.done { --dot: var(--good); }

  #page:has(> .session-page) { overflow: hidden; }

  .session-page {
    display: grid;
    grid-template-columns: minmax(0, var(--left, 30%)) 6px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100%;
  }

  #metro-pane,
  #worktree-sessions {
    overflow: auto;
    padding: 16px 16px 48px;
  }

  #splitter {
    cursor: col-resize;
    touch-action: none;
    background: var(--line);
    border-inline: 2px solid var(--bg);
  }

  #splitter:hover, #splitter.dragging { background: var(--accent); }

  .viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--surface);
  }

  .session-page.zoomed { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }

  .session-page.zoomed .session-bar,
  .session-page.zoomed #metro-pane,
  .session-page.zoomed #splitter,
  .session-page.zoomed #worktree-sessions,
  .session-page.zoomed .term-tabs:not(:has(.term-rename)),
  .session-page.zoomed .viewer-head {
    display: none;
  }

  #modal {
    max-width: 480px;
    padding: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #modal::backdrop { background: rgb(0 0 0 / 40%); }

  #modal p { margin: 0 0 16px; }

  #modal .buttons { display: flex; justify-content: flex-end; gap: 8px; }

  #modal button {
    padding: 4px 12px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  #modal button:hover { border-color: var(--accent); }

  #view {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 24px;
  }

  #view pre {
    margin: 0 0 12px;
    padding: 10px 12px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #view code { font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  #view .editor {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    color: var(--ink);
    font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
  }

  #view.terminal { padding: 0; overflow: hidden; background: #142b37; }
  #view.terminal .xterm { height: 100%; padding: 4px 8px; }

  .term-tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  .term-tab {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .term-tab:has(> [aria-pressed="true"]),
  .term-tab:has(> .term-rename) {
    border-color: var(--accent);
  }

  .term-tabs button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .term-tabs button:hover { color: var(--accent); }
  .term-tabs .term-name[aria-pressed="true"] { color: var(--ink); }
  .term-tabs .term-close { padding-left: 0; }
  .term-tabs .term-add { border: 1px solid var(--line); border-radius: 6px; }
  .term-tab.failed .term-name { color: var(--critical); }

  .term-tabs .term-rename {
    width: 12ch;
    padding: 2px 8px;
    color: var(--ink);
    font: inherit;
    font-size: 0.857rem;
    background: var(--bg);
    border: 0;
    border-radius: 6px;
    outline: none;
  }

  .term-view { flex: 1; min-height: 0; overflow: hidden; background: #142b37; }
  .term-view:empty { background: none; }
  .term-view .term { height: 100%; }
  .term-view .xterm { height: 100%; padding: 4px 8px; }

  .session-bar {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }

  .session-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .session-card .name { min-width: 0; }
  .session-card .id { font-size: 1.1rem; font-weight: 600; }
  .session-card .path { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }

  .session-card .facts {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    gap: 6px;
  }

  .session-card .actions {
    display: flex;
    gap: 2px;
    margin: 0 -4px 0 auto;
  }

  .pill {
    padding: 1px 8px;
    color: var(--ink-2);
    font-size: 0.8rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .metro { display: flex; flex-direction: column; }

  .stop {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
  }

  .rail { position: relative; }

  .seg {
    position: absolute;
    left: calc(50% - var(--rail) / 2);
    width: var(--rail);
  }

  .seg.up { top: 0; height: calc(var(--node-top) + var(--node) / 2); }
  .seg.down { top: calc(var(--node-top) + var(--node) / 2); bottom: 0; }
  .seg.full { top: 0; bottom: 0; }

  .seg.travelled { background: var(--tone, var(--done)); }

  .seg.todo {
    background: repeating-linear-gradient(to bottom, var(--pending) 0 8px, transparent 8px 13px);
  }

  .stop.done { --tone: var(--done); }
  .stop.current { --tone: var(--accent); }
  .stop.waiting { --tone: var(--warning); }
  .stop.blocked { --tone: var(--critical); }
  .stop.pending { --tone: var(--pending); }
  .stop.writing { --tone: var(--accent); }

  .seg.down.travelled, .seg.full.travelled { --tone: var(--done); }

  .node {
    position: absolute;
    z-index: 1;
    top: var(--node-top);
    left: calc(50% - var(--node) / 2);
    display: grid;
    place-items: center;
    width: var(--node);
    height: var(--node);
    color: var(--surface);
    background: var(--surface);
    border: 4px solid var(--tone);
    border-radius: 50%;
  }

  .node svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .done > .rail .node { background: var(--tone); border-width: 0; }
  .blocked > .rail .node { background: var(--tone); border-width: 0; border-radius: 4px; }
  .waiting > .rail .node { background: var(--tone); border-width: 0; }

  .current > .rail .node { animation: pulse 1.6s ease-out infinite; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }

  .node.interchange {
    height: calc(var(--node) + 14px);
    border-radius: 9px;
  }

  .node.terminus {
    --node: 22px;
    top: calc(var(--node-top) - 2px);
    left: calc(50% - 11px);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--tone);
  }

  .stop .card {
    display: grid;
    gap: 6px;
    width: 100%;
    margin: 6px 0 14px;
    padding: 10px 14px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone);
    border-radius: 8px;
    cursor: pointer;
  }

  .stop .card:hover { border-color: var(--accent); border-left-color: var(--tone); }
  .stop .card:not([data-path]) { cursor: default; }

  .stop .card.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 2px;
  }

  .stop.pending .card {
    color: var(--muted);
    background: transparent;
    border-style: dashed;
    border-left-style: solid;
  }

  .card-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .card-head .title { min-width: 0; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .card-head .when { margin-left: auto; white-space: nowrap; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

  .card-foot { display: flex; justify-content: flex-end; }

  .badge {
    padding: 0 7px;
    color: var(--tone);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 1px solid currentColor;
    border-radius: 999px;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    color: var(--ink-2);
    font-size: 0.85rem;
  }

  .meta b { color: var(--ink); font-weight: 500; }
  .pending .meta b { color: var(--muted); }

  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }

  .bar {
    height: 4px;
    overflow: hidden;
    background: var(--bg);
    border-radius: 2px;
  }

  .bar > span { display: block; height: 100%; background: var(--tone); }

  .note { color: var(--ink-2); font-size: 0.85rem; }
  .blocked .note, .waiting .note { color: var(--tone); }

  .file {
    padding: 0;
    color: var(--accent);
    font: inherit;
    font-size: 0.8rem;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .file:hover { text-decoration: underline; }

  .reviewers {
    display: grid;
    gap: 2px;
    margin-top: 2px;
    padding-left: 4px;
    border-left: 2px solid var(--line);
  }

  .reviewer {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr);
    align-items: center;
    gap: 2px 8px;
    padding: 4px 6px;
    color: inherit;
    font: inherit;
    font-size: 0.85rem;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
  }

  .reviewer:hover { border-color: var(--accent); }
  .reviewer.selected { outline: 2px solid var(--ink-2); }

  .reviewer .dot {
    width: 10px;
    height: 10px;
    background: var(--done);
    border-radius: 50%;
  }

  .reviewer .agent { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reviewer .facts { grid-column: 2; color: var(--ink-2); font-size: 0.8rem; }

  .stop.round .label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stop.round .label::after {
    content: '';
    flex: 1;
    border-top: 1px dashed var(--line);
  }

  .viewer-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
  }

  .viewer-head:empty { display: none; }
  .viewer-head .path { font-weight: 600; overflow-wrap: anywhere; }
  .viewer-head .by { color: var(--muted); font-size: 0.85rem; }
  .viewer-head .warn { color: var(--critical); font-size: 0.85rem; }

  .markdown { line-height: 1.55; overflow-wrap: break-word; }
  .markdown > :first-child { margin-top: 0; }

  .markdown h1,
  .markdown h2,
  .markdown h3,
  .markdown h4,
  .markdown h5,
  .markdown h6 {
    margin: 24px 0 8px;
    line-height: 1.25;
  }

  .markdown h1 { font-size: 1.571rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .markdown h2 { font-size: 1.286rem; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .markdown h3 { font-size: 1.071rem; }
  .markdown h4, .markdown h5, .markdown h6 { font-size: 1rem; }

  .markdown p,
  .markdown ul,
  .markdown ol,
  .markdown table:not(.diff *),
  .markdown blockquote {
    margin: 0 0 12px;
  }

  .markdown ul, .markdown ol { padding-left: 24px; }
  .markdown li + li { margin-top: 2px; }
  .markdown li > ul, .markdown li > ol { margin: 2px 0 0; }

  .markdown li:has(> input[type="checkbox"]),
  .markdown li:has(> p:first-child > input[type="checkbox"]:first-child) {
    list-style: none;
  }

  .markdown input[type="checkbox"]:not(.diff *) { margin: 0 6px 0 -20px; vertical-align: middle; }

const $ = (id) => document.getElementById(id)

// The PRs of the shown PRs page: `{ path, prs, error, loading }`, or null.

function escape(text) {
  return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.text()
}

// Returns the text of `url` and its version.
async function fetchFile(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return { text: await res.text(), version: etagVersion(res) }
}

// Returns the `ETag` of `res` without its quotes, or null when it has none.
function etagVersion(res) {
  return res.headers.get('ETag')?.replace(/^"(.*)"$/, '$1') ?? null
}

// Returns the file paths of `session`, or none when the list cannot be fetched.
async function listFiles(session) {
  try {
    const { files } = JSON.parse(await fetchText(`api/files/${sessionPath(session)}`))
    return Array.isArray(files) ? files : []
  } catch {
    return []
  }
}

function stringOrNull(value) {
  return typeof value === 'string' ? value : null
}

function integerOrNull(value) {
  return Number.isInteger(value) ? value : null
}

// Returns the milliseconds from `started` to `ended` when both are valid times and `ended` comes after `started`, else null.
function spanMs(started, ended) {
  const start = Date.parse(started ?? '')
  const end = Date.parse(ended ?? '')
  return Number.isFinite(start) && Number.isFinite(end) && end > start ? end - start : null
}

// Returns the runs of a `runs.jsonl` text and skips each line without a string `stop` and an integer `round`.
function parseRuns(text) {
  const runs = []
  for (const line of String(text).split('\n')) {
    let value
    try {
      value = JSON.parse(line)
    } catch {
      continue
    }
    if (value === null || typeof value !== 'object') continue
    if (typeof value.stop !== 'string' || !Number.isInteger(value.round)) continue

    const started = stringOrNull(value.started)
    const ended = stringOrNull(value.ended)
    runs.push({
      stop: value.stop,
      round: value.round,
      agent: stringOrNull(value.agent),
      task: stringOrNull(value.task),
      model: stringOrNull(value.model),
      started,
      ended,
      durationMs: integerOrNull(value.durationMs) ?? spanMs(started, ended),
      tokens: integerOrNull(value.tokens),
      toolUses: integerOrNull(value.toolUses),
      file: stringOrNull(value.file),
      outcome: stringOrNull(value.outcome),
    })
  }
  return runs
}

// Returns the runs of the session in `dir`, or none when its `runs.jsonl` is absent or cannot be fetched.
async function loadRuns(dir, files) {
  if (!files.includes('runs.jsonl')) return []

  try {
    return parseRuns(await fetchText(encodePath(`${dir}runs.jsonl`)))
  } catch {
    return []
  }
}

// Returns the value of the last `outcome:` line of a `triage.md` text, or null.
function triageOutcome(text) {
  const match = [...String(text).matchAll(/^outcome:\s*(.+?)\s*$/gm)].at(-1)
  return match ? match[1] : null
}

// Returns the triage outcome of each round in `files` whose `triage.md` can be fetched, keyed by round.
async function loadOutcomes(dir, files) {
  const outcomes = {}
  const reads = files.map(async (path) => {
    const round = path.match(/^round-(\d+)\/triage\.md$/)?.[1]
    if (round === undefined) return

    const text = await fetchText(encodePath(dir + path)).catch(() => null)
    if (text !== null) outcomes[round] = triageOutcome(text)
  })
  await Promise.all(reads)
  return outcomes
}

// Returns the summary of a `walk.json` text and its steps with an integer `n` and a string `title`, or null when it has no `steps` array.
function parseWalk(text) {
  let value
  try {
    value = JSON.parse(text)
  } catch {
    return null
  }
  if (value === null || typeof value !== 'object' || !Array.isArray(value.steps)) return null

  const steps = value.steps
    .filter((step) => Number.isInteger(step?.n) && typeof step.title === 'string')
    .map(({ n, title, summary }) => ({ n, title, summary: stringOrNull(summary) }))
  return { summary: stringOrNull(value.summary), steps }
}

// Returns the walk of the session in `dir`, or null when its `walk.json` is absent or cannot be read.
async function loadWalk(dir, files) {
  if (!files.includes('walk.json')) return null

  try {
    return parseWalk(await fetchText(encodePath(`${dir}walk.json`)))
  } catch {
    return null
  }
}

// Returns the path of the finished file of walk step `n`, such as `steps/03.md`.
function stepPath(n) {
  return `steps/${String(n).padStart(2, '0')}.md`
}

// Returns the sessions of the `api/sessions` reply, and a problem line for each entry with an error.
async function loadSessions() {
  const { sessions: entries } = JSON.parse(await fetchText('api/sessions'))
  const sessions = []
  const problems = []

  for (const { org, repo, branch, session: id, category, data, error } of entries) {
    if (error !== undefined) {
      problems.push(`${org}/${repo}/${branch}/${id}: ${error}`)
      continue
    }

    sessions.push({ ...data, org, repo, branch, id, category, dir: `api/file/${org}/${repo}/${branch}/${id}/` })
  }
  return { sessions, problems }
}

// Stores the `api/repos` reply in `reposState`, or the failure as its error.
async function loadRepos() {
  try {
    const { error, repos } = JSON.parse(await fetchText('api/repos'))
    reposState = { error: stringOrNull(error), repos: Array.isArray(repos) ? repos : [] }
  } catch (err) {
    reposState = { error: err.message, repos: [] }
  }
}

// Fetches the PRs of the main checkout at `path` into `prsState`, unless the shown page changed meanwhile, then renders.
async function loadPrs(path) {
  const loading = { path, prs: [], error: null, loading: true }
  prsState = loading

  let reply
  try {
    const { error, prs } = JSON.parse(await fetchText(`api/prs?path=${encodeURIComponent(path)}`))
    reply = { path, prs: Array.isArray(prs) ? prs : [], error: stringOrNull(error), loading: false }
  } catch (err) {
    reply = { path, prs: [], error: err.message, loading: false }
  }
  if (prsState !== loading) return

  prsState = reply
  render()
}

function decode(segment) {
  try {
    return decodeURIComponent(segment)
  } catch {
    return segment
  }
}

// Returns the page of `hash`: the repos, the sessions, a worktree with its path, the PRs of a main checkout with its path, or a session with its file path.
function parseRoute(hash) {
  const segments = hash.replace(/^#\/?/, '').split('/').filter((s) => s !== '').map(decode)
  if (segments.length === 0) return { kind: 'repos' }
  if (segments.length === 1 && segments[0] === 'sessions') return { kind: 'sessions' }
  if (segments.length === 2 && segments[0] === 'worktree') return { kind: 'worktree', path: segments[1] }
  if (segments.length === 2 && segments[0] === 'prs') return { kind: 'prs', path: segments[1] }

  const [org, repo = '', branch = '', id = '', ...rest] = segments
  return { kind: 'session', org, repo, branch, id, path: rest.length > 0 ? rest.join('/') : null }
}

function worktreeHash(path) {
  return `#/worktree/${encodeURIComponent(path)}`
}

function prsHash(path) {
  return `#/prs/${encodeURIComponent(path)}`
}

// Returns `{org}/{repo}/{branch}/{id}` of `session`, each segment percent-encoded.
function sessionPath(session) {
  return [session.org, session.repo, session.branch, session.id].map(encodeURIComponent).join('/')
}

function sessionName(session) {
  return `${session.org}/${session.repo}/${session.branch}/${session.id}`
}

function branchName(session) {
  return `${session.org}/${session.repo}/${session.branch}`
}

function sessionHref(session) {
  return `#/${sessionPath(session)}`
}

function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/')
}

function fileHref(session, path) {
  return `${sessionHref(session)}/${encodePath(path)}`
}

function shortPath(worktree) {
  return String(worktree || '').split('/').filter((s) => s !== '').slice(-3).join('/')
}

// Returns true when paths `a` and `b` are equal once one trailing `/` is dropped from each.
function sameWorktree(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string') return false
  return a.replace(/\/$/, '') === b.replace(/\/$/, '')
}

// Returns the sessions whose worktree is `path`.
function sessionsOf(path) {
  return state.sessions.filter((session) => sameWorktree(session.worktree, path))
}

function sessionFlow(session) {
  return session.flow || 'build'
}

// Returns the session id and the short worktree path of `session`.
function sessionDetail(session) {
  return [session.id, shortPath(session.worktree)].filter((part) => part !== '').join(' · ')
}

// Returns the category of the session's folder, else the class of its flow, else the flow name.
function sessionClass(session) {
  if (session.category) return session.category

  const flow = sessionFlow(session)
  return Object.hasOwn(SESSION_CLASSES, flow) ? SESSION_CLASSES[flow] : flow
}

// Returns the phases and stage map of the session's flow, or null for an unknown flow.
function flowOf(session) {
  const flow = sessionFlow(session)
  return Object.hasOwn(FLOWS, flow) ? FLOWS[flow] : null
}

// Returns the stage that sets the phase: `blocked.stage` for a blocked session.
function phaseStage(session) {
  return session.stage === 'blocked' ? session.blocked?.stage : session.stage
}

function currentPhase(session) {
  const flow = flowOf(session)
  const stage = phaseStage(session)
  return flow !== null && Object.hasOwn(flow.stagePhase, stage) ? flow.stagePhase[stage] : null
}

// Returns the problem with the session's flow or stage, or null when both are known.
function sessionProblem(session) {
  if (flowOf(session) === null) return `unknown flow "${sessionFlow(session)}"`
  if (!currentPhase(session)) return `unknown stage "${phaseStage(session)}"`
  return null
}

function sessionMode(session) {
  return session.mode || 'default'
}

function tint(session) {
  if (session.stage === 'triage' && sessionMode(session) === 'interactive') return 'waiting'
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done') return 'done'
  return ''
}

function indicator(session) {
  const phases = flowOf(session)?.phases ?? []
  const current = phases.indexOf(currentPhase(session))
  return phases.map((phase, i) => {
    const step = i < current ? 'past' : i === current ? 'current' : 'future'
    const color = i === current || session.stage === 'done' ? tint(session) : ''
    const line = i > 0 ? '<span class="line"></span>' : ''
    return `${line}<span class="dot ${step} ${color}" title="${phase}"></span>`
  }).join('')
}

// Returns the written and planned steps of a walk session, such as `3/7`.
function walkProgress(session) {
  const done = integerOrNull(session.counts?.stepsDone) ?? 0
  const planned = integerOrNull(session.counts?.stepsPlanned) ?? 0
  return `${done}/${planned}`
}

// Returns the label of a walk row: its class, then its progress while it runs, else its stage.
function walkStepLabel(session) {
  const stage = session.stage === 'walk' ? `writing ${walkProgress(session)}` : session.stage || 'unknown'
  return `${escape(sessionClass(session))} · ${escape(stage)}`
}

function stepLabel(session) {
  if (sessionFlow(session) === 'walk') return walkStepLabel(session)

  const phase = currentPhase(session) || phaseStage(session) || 'unknown'
  const parts = [escape(sessionMode(session))]
  if (sessionFlow(session) !== 'build') parts.push(escape(sessionFlow(session)))
  parts.push(escape(session.stage === 'blocked' ? `blocked at ${phase}` : phase))
  if (session.round > 0) parts.push(`round ${escape(session.round)}`)
  if (session.lastRound === true) parts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    parts.push(`<span class="warn">${escape(counts.deferred - counts.issued)} deferred without issue</span>`)
  }
  return parts.join(' · ')
}

function rowContent(session) {
  return `
    <span class="name"><span class="id">${escape(branchName(session))}</span> <span class="path">${escape(sessionDetail(session))}</span></span>
    <span class="steps">${indicator(session)}</span>
    <span class="label"><span class="pill">${escape(sessionClass(session))}</span> ${stepLabel(session)}</span>`
}

function cardActions(session) {
  return actionButtons(CARD_ACTIONS)
}

// Returns one icon button per entry of `actions`, each with the extra attributes `attributes`.
function actionButtons(actions, attributes = '') {
  return actions.map(({ action, title, icon }) => `
    <button type="button" class="icon" data-action="${action}" title="${title}"${attributes}>
      <svg viewBox="0 0 16 16" aria-hidden="true">${icon}</svg>
    </button>`).join('')
}

// Returns the distinct orgs of `sessions`, sorted.
function sessionOrgs(sessions) {
  return [...new Set(sessions.map((session) => session.org))].sort((a, b) => a.localeCompare(b))
}

// Returns the org the list shows, or null for every org when the filter names none or an org without sessions.
function shownOrg() {
  return sessionOrgs(state.sessions).includes(orgFilter) ? orgFilter : null
}

function shownSessions() {
  const org = shownOrg()
  return state.sessions.filter((session) => org === null || session.org === org)
}

// Returns the org filter: an `All` button, then one button per org.
function orgFilterHtml(orgs, shown) {
  const button = (org, label) => `
    <button type="button" data-org="${escape(org ?? '')}" aria-pressed="${org === shown}">${escape(label)}</button>`
  return `<nav class="org-filter">${[button(null, 'All'), ...orgs.map((org) => button(org, org))].join('')}</nav>`
}

function rowHtml(session) {
  return `
    <div class="row card ${tint(session)}" data-dir="${escape(session.dir)}">
      <a class="body" href="${escape(sessionHref(session))}">${rowContent(session)}</a>
      <span class="actions">${cardActions(session)}</span>
    </div>`
}

// Renders the shown sessions under one heading per org, with the org filter above them.
function renderList() {
  const sessions = shownSessions().sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')))
  const groups = sessionOrgs(sessions).map((org) => `
    <section class="org-group">
      <h2 class="org">${escape(org)}</h2>
      <div class="rows">${sessions.filter((session) => session.org === org).map(rowHtml).join('')}</div>
    </section>`).join('')

  const orgs = sessionOrgs(state.sessions)
  const filter = orgs.length > 0 ? orgFilterHtml(orgs, shownOrg()) : ''
  const html = `<div class="column">${filter}${groups || '<p class="empty">No sessions yet.</p>'}</div>`
  if (listView.el === $('page').firstElementChild && listView.html === html) return showSelection()

  $('page').innerHTML = html
  listView = { html, el: $('page').firstElementChild }
  listView.el.addEventListener('click', onCardAction)
  listView.el.addEventListener('click', onOrgFilter)
  showSelection()
}

// Shows the org of the clicked filter button and stores the choice.
function onOrgFilter(event) {
  const button = event.target.closest('button[data-org]')
  if (!button) return

  orgFilter = button.dataset.org || null
  writeOrgFilter(orgFilter)
  renderList()
}

// Clears the selection when its session is gone or hidden and outlines the selected row.
function showSelection() {
  if (!shownSessions().some((session) => session.dir === selectedDir)) selectedDir = null

  for (const row of $('page').querySelectorAll('.row.card')) {
    row.classList.toggle('selected', row.dataset.dir === selectedDir)
  }
}

// Moves the selection by `step` rows in display order and stops at the first and last rows.
function moveSelection(step) {
  const rows = [...$('page').querySelectorAll('.row.card')]
  if (rows.length === 0) return

  const last = rows.length - 1
  const first = step > 0 ? 0 : last
  const current = rows.findIndex((row) => row.dataset.dir === selectedDir)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedDir = rows[next].dataset.dir
  showSelection()
  rows[next].scrollIntoView({ block: 'nearest' })
}

function onCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const dir = button.closest('[data-dir]')?.dataset.dir
  const session = state.sessions.find((s) => s.dir === dir)
  if (!session) return

  runAction(session, button.dataset.action)
}

// Returns the row of `worktree`, outlined when `selected`: a link to its page with its branch or short sha, its short path, its session count and its open terminal count.
function worktreeRowHtml(worktree, selected) {
  const count = sessionsOf(worktree.path).length
  const terms = worktreeTerms.get(worktree.path)?.tabs.length ?? 0
  const termCount = terms > 0 ? ` · ▣ ${terms}` : ''
  return `
    <div class="row worktree${selected ? ' selected' : ''}">
      <a class="body" href="${escape(worktreeHash(worktree.path))}">
        <span class="name"><span class="id">${escape(worktree.branch ?? worktree.head ?? '')}</span> <span class="path">${escape(shortPath(worktree.path))}</span></span>
        <span class="label">${count} ${count === 1 ? 'session' : 'sessions'}${termCount}</span>
      </a>
    </div>`
}

// Returns the main row of `repo`, outlined when `selected`: a link to its PRs page with its name and branch.
function mainRowHtml(repo, selected) {
  return `
    <div class="row main${selected ? ' selected' : ''}">
      <a class="body" href="${escape(prsHash(repo.path))}">
        <span class="name"><span class="id">${escape(`${repo.org}/${repo.repo}`)}</span> <span class="path">${escape(repo.branch ?? '')}</span></span>
        <span class="label">PRs ›</span>
      </a>
    </div>`
}

// Returns the greyed main row of `repo`, which has an error: its name, its short path and the error.
function mainErrorRowHtml(repo) {
  return `
    <div class="row main error">
      <div class="body">
        <span class="name"><span class="id">${escape(`${repo.org}/${repo.repo}`)}</span> <span class="path">${escape(shortPath(repo.path))}</span></span>
        <span class="reason">${escape(repo.error)}</span>
      </div>
    </div>`
}

// Returns the checkout `repo` as its main row, then the indented rows of `worktrees` or `No worktrees.`. A checkout with an error has a greyed main row and no worktree rows.
function repoGroupHtml(repo, worktrees) {
  if (repo.error !== null) return `<section class="org-group">${mainErrorRowHtml(repo)}</section>`

  const rows = worktrees.length > 0
    ? worktrees.map((worktree) => worktreeRowHtml(worktree, worktree.path === selectedWorktree)).join('')
    : '<p class="empty">No worktrees.</p>'
  return `
    <section class="org-group">
      ${mainRowHtml(repo, repo.path === selectedWorktree)}
      <div class="rows nested">${rows}</div>
    </section>`
}

// Returns the lowercased words of `query`.
function filterWords(query) {
  return query.toLowerCase().split(/\s+/).filter((word) => word !== '')
}

// Returns true when `text`, lowercased, holds every one of `words`.
function holdsWords(text, words) {
  const lower = text.toLowerCase()
  return words.every((word) => lower.includes(word))
}

// Returns the checkouts the filter shows, in config order, each with its shown worktrees.
function shownRepos() {
  const words = filterWords(repoFilter)
  return (reposState?.repos ?? []).flatMap((repo) => {
    const worktrees = repo.worktrees.filter((worktree) =>
      holdsWords(`${shortPath(worktree.path)} ${worktree.branch ?? worktree.head ?? ''}`, words))
    const shown = worktrees.length > 0 || holdsWords(`${repo.org}/${repo.repo}`, words)
    return shown ? [{ repo, worktrees }] : []
  })
}

// Returns the selectable rows of the repos page in display order as `{ repo, worktree, path }`, where a main row has a null `worktree`. A checkout with an error has no rows.
function shownRows() {
  return shownRepos().flatMap(({ repo, worktrees }) => {
    if (repo.error !== null) return []

    const main = { repo, worktree: null, path: repo.path }
    return [main, ...worktrees.map((worktree) => ({ repo, worktree, path: worktree.path }))]
  })
}

// Returns the shown row whose path is `selectedWorktree`, or undefined.
function selectedRow() {
  return shownRows().find((row) => row.path === selectedWorktree)
}

// Returns the row Enter in the repos filter opens with no selection: the first shown worktree row, else the first shown main row.
function firstFilterRow() {
  const rows = shownRows()
  return rows.find((row) => row.worktree !== null) ?? rows[0]
}

// Returns the page a repos page row opens: the PRs page for a main row, the worktree page for a worktree row.
function rowHash(row) {
  return row.worktree === null ? prsHash(row.path) : worktreeHash(row.path)
}

// Returns the checkouts of the repos page: the config error, the help for an empty config, or one group per shown checkout.
function reposHtml() {
  if (reposState === null) return '<p class="empty">loading…</p>'
  if (reposState.error !== null) return `<p class="config-error">${escape(reposState.error)}</p>`
  if (reposState.repos.length === 0) return REPOS_HELP

  const repos = shownRepos()
  if (repos.length === 0) return '<p class="empty">No worktree matches.</p>'
  return repos.map(({ repo, worktrees }) => repoGroupHtml(repo, worktrees)).join('')
}

// Renders the repos page: the filter field above the shown checkouts. A page already shown keeps its field. A row no longer shown loses the selection.
function renderRepos() {
  if (reposView.el === null || reposView.el !== $('page').firstElementChild) {
    $('page').innerHTML = `
      <div class="column">
        <input type="search" class="repo-filter" id="repo-filter" placeholder="Filter by repo or branch" autocomplete="off" spellcheck="false">
        <div id="repo-list"></div>
      </div>`
    $('repo-filter').value = repoFilter
    $('repo-filter').addEventListener('input', onRepoFilter)
    reposView = { el: $('page').firstElementChild, list: '' }
  }

  if (selectedRow() === undefined) selectedWorktree = null

  const list = reposHtml()
  if (reposView.list === list) return

  $('repo-list').innerHTML = list
  reposView.list = list
}

// Shows the checkouts that match the typed filter.
function onRepoFilter(event) {
  repoFilter = event.currentTarget.value
  renderRepos()
}

// Moves the selection by `step` rows of the repos page in display order and stops at the first and last rows.
function moveWorktreeSelection(step) {
  const paths = shownRows().map((row) => row.path)
  if (paths.length === 0) return

  const last = paths.length - 1
  const first = step > 0 ? 0 : last
  const current = paths.indexOf(selectedWorktree)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedWorktree = paths[next]
  renderRepos()
  $('repo-list').querySelector('.row.selected')?.scrollIntoView({ block: 'nearest' })
}

// Returns the configured checkout and worktree at `path`, or null when no checkout lists it.
function findWorktree(path) {
  for (const repo of reposState?.repos ?? []) {
    const worktree = repo.worktrees.find((w) => w.path === path)
    if (worktree) return { repo, worktree }
  }
  return null
}

// Returns the worktree card: the checkout's name, the worktree's short path and branch, and its actions.
function worktreeCardHtml(repo, worktree) {
  return `
    <div class="session-card">
      <div class="name">
        <div class="id">${escape(`${repo.org}/${repo.repo}`)}</div>
        <div class="path">${escape(shortPath(worktree.path))}</div>
      </div>
      <div class="facts"><span class="pill">${escape(worktree.branch ?? worktree.head ?? '')}</span></div>
      <div class="actions">${actionButtons(WORKTREE_ACTIONS)}</div>
    </div>`
}

// Returns why the repos list lacks a worktree: still loading, the list's error, or not configured.
function missingWorktreeHtml() {
  if (reposState === null) return '<span class="empty">loading…</span>'
  if (reposState.error !== null) return `<span class="config-error">${escape(reposState.error)}</span>`
  return '<span class="empty">not a configured worktree</span>'
}

// Returns the card of the worktree at `path` when the repos list lacks it: its path and the reason.
function missingWorktreeCardHtml(path) {
  return `
    <div class="session-card">
      <div class="name"><div class="path">${escape(path)}</div></div>
      <div class="facts">${missingWorktreeHtml()}</div>
    </div>`
}

// Returns the live sessions of the worktree at `path`, each a link to its page with its id, flow and stage.
function worktreeSessionsHtml(path) {
  const rows = sessionsOf(path).map((session) => `
    <div class="row session ${tint(session)}">
      <a class="body" href="${escape(sessionHref(session))}">
        <span class="name"><span class="id">${escape(session.id)}</span></span>
        <span class="label"><span class="pill">${escape(sessionFlow(session))}</span> ${escape(session.stage ?? 'unknown')}</span>
      </a>
    </div>`)
  return rows.length > 0 ? `<div class="rows">${rows.join('')}</div>` : '<p class="empty">No live sessions.</p>'
}

// Returns the tab strip of `terms`: one tab per terminal with its close button, then the `+` button. Tab `renamingId` shows its name in a text field.
function termTabsHtml(terms, renamingId) {
  const nameHtml = (tab) => tab.id === renamingId
    ? `<input class="term-rename" id="term-rename" value="${escape(tab.name)}" aria-label="Tab name" spellcheck="false">`
    : `<button type="button" class="term-name" data-term="select" data-tab="${tab.id}" aria-pressed="${tab.id === terms.active}">${escape(tab.name)}</button>`

  const tabs = (terms?.tabs ?? []).map((tab) => `
    <span class="term-tab${tab.failed !== null ? ' failed' : ''}">
      ${nameHtml(tab)}
      <button type="button" class="term-close" data-term="close" data-tab="${tab.id}" title="Close ${escape(tab.name)}">×</button>
    </span>`)
  return `${tabs.join('')}<button type="button" class="term-add" data-term="add" title="Open a shell (t)">+</button>`
}

// Writes `html` into the element `id` when it differs from the part `key` of the worktree page.
function updateWorktreePart(key, id, html) {
  if (worktreeView[key] === html) return

  $(id).innerHTML = html
  worktreeView[key] = html
}

// Renders the worktree page of `path`: its card, its sessions, and its terminal tabs with the active terminal. A worktree missing from the repos list keeps the page while it has tabs.
function renderWorktreePage(path) {
  const found = findWorktree(path)
  const terms = worktreeTerms.get(path)
  if (found === null && (terms?.tabs.length ?? 0) === 0) {
    parkWorktreeTerminal()
    $('page').innerHTML = `<div class="column"><p>${missingWorktreeHtml()}</p></div>`
    return
  }

  if (worktreeView.el !== $('page').firstElementChild || worktreeView.path !== path) {
    parkWorktreeTerminal()
    $('page').innerHTML = `
      <div class="session-page">
        <div class="session-bar" id="worktree-card"></div>
        <section id="worktree-sessions"></section>
        <div id="splitter"></div>
        <section class="viewer">
          <div class="term-tabs" id="term-tabs"></div>
          <div class="term-view" id="term-view"></div>
        </section>
      </div>`
    const page = $('page').firstElementChild
    resizeSessionPage(page)
    $('worktree-card').addEventListener('click', onWorktreeCardAction)
    $('term-tabs').addEventListener('click', onTermTabsClick)
    $('term-tabs').addEventListener('keydown', onRenameKey)
    $('term-tabs').addEventListener('focusout', onRenameBlur)
    $('splitter').addEventListener('pointerdown', onSplitterDown)
    worktreeView = { path, el: page, card: '', sessions: '', tabs: '' }
  }

  const card = found === null ? missingWorktreeCardHtml(path) : worktreeCardHtml(found.repo, found.worktree)
  updateWorktreePart('card', 'worktree-card', card)
  updateWorktreePart('sessions', 'worktree-sessions', worktreeSessionsHtml(path))

  if (renaming !== null && !terms?.tabs.some((tab) => tab.id === renaming.id)) renaming = null
  if (renaming === null || $('term-rename') === null) updateWorktreePart('tabs', 'term-tabs', termTabsHtml(terms, renaming?.id))
  showWorktreeTerminal(path)
  if (activeWorktreeTerminal(path) === undefined) worktreeView.el.classList.remove('zoomed')
}

// Opens lazygit in a tab, or the worktree in a tool, for the clicked card button.
function onWorktreeCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const path = worktreeView.path
  if (button.dataset.action === 'lazygit') openWorktreeTerminal(path, 'lazygit')
  else openWorktreeTool(path, button.dataset.action)
}

// Opens a shell, or selects or closes a tab, for the clicked button of the tab strip.
function onTermTabsClick(event) {
  const button = event.target.closest('button[data-term]')
  if (!button) return

  const path = worktreeView.path
  const id = Number(button.dataset.tab)
  if (button.dataset.term === 'add') openWorktreeTerminal(path, 'shell')
  else if (button.dataset.term === 'select') selectWorktreeTerminal(path, id)
  else if (button.dataset.term === 'close') closeWorktreeTerminal(path, id)
}

// Saves the edited tab name on `Enter` and drops it on `Escape`. Keeps every key in the text field from the board shortcuts.
function onRenameKey(event) {
  if (event.target.id !== 'term-rename') return

  event.stopPropagation()
  if (event.key === 'Enter' || event.key === 'Escape') {
    event.preventDefault()
    endRename(event.key === 'Enter')
  }
}

// Saves the edited tab name when the text field loses the focus.
function onRenameBlur(event) {
  if (event.target.id === 'term-rename') endRename(true)
}

// Returns the configured checkout whose main checkout is at `path`, or undefined.
function findRepo(path) {
  return reposState?.repos.find((repo) => repo.path === path)
}

// Returns the linked worktree of `repo` on the branch of `pr`, or undefined.
function prWorktree(repo, pr) {
  return repo.worktrees.find((worktree) => worktree.branch === pr.branch)
}

// Returns the PRs of the shown PRs page whose `#{number} {title} {author} {branch}` holds every filter word.
function shownPrs() {
  const words = filterWords(prFilter)
  return (prsState?.prs ?? []).filter((pr) => holdsWords(`#${pr.number} ${pr.title} ${pr.author} ${pr.branch}`, words))
}

// Returns the icons of a PR row, with the checkout title on the worktree icon when the PR is not `checkedOut`.
function prActions(checkedOut) {
  return PR_ACTIONS.map((entry) => (entry.action === 'worktree' && !checkedOut ? { ...entry, title: PR_CHECKOUT_TITLE } : entry))
}

// Returns the key of `pr` of the main checkout at `path` in `prBusy`.
function prBusyKey(path, pr) {
  return `${path}#${pr.number}`
}

// Returns the hover text of the review state of `pr`: each reviewer with the state of their latest review.
function reviewersTitle(pr) {
  if (pr.reviewers.length === 0) return 'No reviews yet'
  return `Reviewed by ${pr.reviewers.map((reviewer) => `${reviewer.login} (${reviewer.state})`).join(', ')}`
}

// Returns the chips of `pr`: reviewed or to review, then draft.
function prChips(pr) {
  const chips = []
  if (pr.reviewers.length > 0) chips.push('<span class="pr-chip reviewed">reviewed</span>')
  else if (pr.reviewRequested) chips.push('<span class="pr-chip to-review">to review</span>')
  if (pr.draft) chips.push('<span class="pr-chip draft">draft</span>')
  return chips.join('')
}

// Returns the row of `pr` in `repo`, outlined when `selected`: number, title, author and line counts; checkout state or worktree marker, CI and review states; chips and icons.
function prRowHtml(repo, pr, selected) {
  const worktree = prWorktree(repo, pr)
  const busy = prBusy.has(prBusyKey(repo.path, pr))
  const number = escape(pr.number)

  const lines = `<span class="added">+${escape(pr.additions)}</span> <span class="deleted">−${escape(pr.deletions)}</span>`
  const marker = worktree !== undefined ? `<span class="marker">● ${escape(shortPath(worktree.path))}</span>` : ''
  const checkout = busy ? '<span class="marker">checking out…</span>' : marker
  const ci = `<span class="ci ${escape(pr.ci)}">${escape(CI_LABELS[pr.ci] ?? pr.ci)}</span>`
  const review = `<span class="review ${escape(pr.review)}" title="${escape(reviewersTitle(pr))}">${escape(REVIEW_LABELS[pr.review] ?? pr.review)}</span>`

  return `
    <div class="row pr${selected ? ' selected' : ''}${busy ? ' busy' : ''}" data-number="${number}">
      <div class="body">
        <span class="name"><span class="id">#${number}</span> ${escape(pr.title)}</span>
        <span class="label">${escape(pr.author)} · ${lines}</span>
        <span class="label">${checkout}</span>
        <span class="label">${ci} · ${review}</span>
      </div>
      <div class="foot">
        <div class="pr-chips">${prChips(pr)}</div>
        <div class="actions">${actionButtons(prActions(worktree !== undefined), ` data-number="${number}"`)}</div>
      </div>
    </div>`
}

// Returns the card of the PRs page of `repo`: its name, its short path and, once loaded, its PR count.
function prCardHtml(repo) {
  const loaded = prsState !== null && !prsState.loading && prsState.error === null
  const count = loaded ? prsState.prs.length : 0
  const facts = loaded ? `<span class="pill">${count} ${count === 1 ? 'PR' : 'PRs'}</span>` : ''
  return `
    <div class="session-card">
      <div class="name">
        <div class="id">${escape(`${repo.org}/${repo.repo}`)}</div>
        <div class="path">${escape(shortPath(repo.path))}</div>
      </div>
      <div class="facts">${facts}</div>
    </div>`
}

// Returns the PR list of the PRs page of `repo`: loading, the error, no PRs, no match, or one row per shown PR.
function prListHtml(repo) {
  if (prsState === null || prsState.loading) return '<p class="empty">loading…</p>'
  if (prsState.error !== null) return `<p class="config-error">${escape(prsState.error)}</p>`
  if (prsState.prs.length === 0) return '<p class="empty">No open PRs.</p>'

  const prs = shownPrs()
  if (prs.length === 0) return '<p class="empty">No PR matches.</p>'
  return `<div class="rows">${prs.map((pr) => prRowHtml(repo, pr, pr.number === selectedPr)).join('')}</div>`
}

// Returns why the repos list lacks the main checkout of a PRs page: still loading, the list's error, or not configured.
function missingRepoHtml() {
  if (reposState === null) return '<span class="empty">loading…</span>'
  if (reposState.error !== null) return `<span class="config-error">${escape(reposState.error)}</span>`
  return '<span class="empty">not a configured repo</span>'
}

// Writes `html` into the element `id` when it differs from the part `key` of the PRs page.
function updatePrsPart(key, id, html) {
  if (prsView[key] === html) return

  $(id).innerHTML = html
  prsView[key] = html
}

// Renders the PRs page of the main checkout at `path`: its card, the filter field and the shown PRs. A page already shown keeps its field. A page without PRs for `path` fetches them. A PR no longer shown loses the selection.
function renderPrsPage(path) {
  const repo = findRepo(path)
  if (repo === undefined) {
    $('page').innerHTML = `<div class="column"><p>${missingRepoHtml()}</p></div>`
    return
  }

  if (prsView.el === null || prsView.el !== $('page').firstElementChild || prsView.path !== path) {
    $('page').innerHTML = `
      <div class="column">
        <div id="pr-card"></div>
        <input type="search" class="repo-filter" id="pr-filter" placeholder="Filter by number, title, author or branch" autocomplete="off" spellcheck="false">
        <div id="pr-list"></div>
      </div>`
    $('pr-filter').value = prFilter
    $('pr-filter').addEventListener('input', onPrFilter)
    $('pr-list').addEventListener('click', onPrListClick)
    prsView = { path, el: $('page').firstElementChild, card: '', list: '' }
  }

  if (prsState?.path !== path) loadPrs(path)
  if (!shownPrs().some((pr) => pr.number === selectedPr)) selectedPr = null

  updatePrsPart('card', 'pr-card', prCardHtml(repo))
  updatePrsPart('list', 'pr-list', prListHtml(repo))
}

// Shows the PRs that match the typed filter.
function onPrFilter(event) {
  prFilter = event.currentTarget.value
  renderPrsPage(prsView.path)
}

// Returns the shown PR of `number`, or undefined.
function shownPr(number) {
  return shownPrs().find((pr) => pr.number === number)
}

// Runs the action of the clicked PR icon, or selects the PR whose row was clicked.
function onPrListClick(event) {
  const button = event.target.closest('button[data-action]')
  if (button) {
    const pr = shownPr(Number(button.dataset.number))
    if (pr !== undefined) runPrAction(prsView.path, pr, button.dataset.action)
    return
  }

  const row = event.target.closest('.row.pr')
  if (!row) return

  selectedPr = Number(row.dataset.number)
  renderPrsPage(prsView.path)
}

// Moves the selection by `step` shown PRs and stops at the first and last PRs.
function movePrSelection(step) {
  const numbers = shownPrs().map((pr) => pr.number)
  if (numbers.length === 0) return

  const last = numbers.length - 1
  const first = step > 0 ? 0 : last
  const current = numbers.indexOf(selectedPr)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedPr = numbers[next]
  renderPrsPage(prsView.path)
  $('pr-list').querySelector('.row.selected')?.scrollIntoView({ block: 'nearest' })
}

function missingScripts() {
  const missing = []
  if (typeof marked === 'undefined') missing.push('marked.min.js not loaded')
  if (typeof DOMPurify === 'undefined') missing.push('purify.min.js not loaded')
  if (typeof hljs === 'undefined') missing.push('highlight.min.js not loaded')
  if (typeof Diff2HtmlUI === 'undefined') missing.push('diff2html-ui-base.min.js not loaded')
  if (typeof Terminal === 'undefined') missing.push('xterm.js not loaded')
  if (typeof FitAddon === 'undefined') missing.push('addon-fit.js not loaded')
  return missing
}

function codeBlock(text) {
  return `<pre><code>${escape(text)}</code></pre>`
}

function prettyJson(text) {
  try {
    return JSON.stringify(JSON.parse(text), null, 2)
  } catch {
    return text
  }
}

// Returns the language, `path=` and `lines=` words of a fence info string.
function parseInfo(info) {
  const words = info.split(/\s+/).filter((word) => word !== '')
  const value = (key) => words.find((word) => word.startsWith(`${key}=`))?.slice(key.length + 1) ?? null
  return { lang: words[0] ?? '', path: value('path'), lines: value('lines') }
}

// Tells whether `text` holds a `diff --git` line or a `---` line followed by a `+++` line.
function hasDiffHeaders(text) {
  return /^diff --git /m.test(text) || /^--- [^\n]*\n\+\+\+ /m.test(text)
}

// Returns a diff block with a layout toggle for a `diff` fence with file headers, else the code in highlight.js colours under its `path:lines`.
function fenceHtml(text, info) {
  const { lang, path, lines } = parseInfo(info)
  if (lang === 'diff' && hasDiffHeaders(text)) {
    const index = pendingDiffs.push(text) - 1
    return (
      `<div class="diff" data-diff="${index}"><div class="diff-bar">` +
      '<button type="button" data-layout="line-by-line" aria-pressed="true">Unified</button>' +
      '<button type="button" data-layout="side-by-side" aria-pressed="false">Split</button>' +
      '</div><div class="diff-body"></div></div>'
    )
  }

  const head = path && lines ? `<div class="code-path">${escape(path)}:${escape(lines)}</div>` : ''
  const code = hljs.getLanguage(lang) ? hljs.highlight(text, { language: lang }).value : escape(text)
  return `<div class="code">${head}<pre><code class="hljs">${code}</code></pre></div>`
}

function markdownRenderer() {
  const renderer = new marked.Renderer()
  renderer.code = ({ text, lang }) => fenceHtml(text, lang ?? '')
  return renderer
}

function fileHtml(path, text) {
  if (path.endsWith('.md') && missingScripts().length === 0) {
    pendingDiffs = []
    const markdown = marked.parse(text, { gfm: true, renderer: markdownRenderer() })
    const html = DOMPurify.sanitize(markdown, { FORBID_TAGS: ['style', 'form'] })
    return `<div class="markdown">${html}</div>`
  }
  if (path.endsWith('.json')) return codeBlock(prettyJson(text))
  return codeBlock(text)
}

// Draws each diff block of `view` unified from `pendingDiffs`, and keeps its text on the block.
function drawDiffs(view) {
  for (const block of view.querySelectorAll('.diff[data-diff]')) {
    block.diffText = pendingDiffs[Number(block.dataset.diff)] ?? ''
    drawDiff(block, 'line-by-line')
  }
}

// Draws the text of the diff block `block` into its body in `outputFormat`.
function drawDiff(block, outputFormat) {
  const body = block.querySelector('.diff-body')
  const config = { outputFormat, drawFileList: false, matching: 'lines', highlight: true }
  new Diff2HtmlUI(body, block.diffText, config, hljs).draw()
}

// Redraws the diff block of the clicked toggle button in its layout, and presses only that button.
function onDiffToggle(event) {
  const button = event.target.closest('.diff-bar button[data-layout]')
  const block = button?.closest('.diff[data-diff]')
  if (!block) return

  for (const other of block.querySelectorAll('.diff-bar button[data-layout]')) {
    other.setAttribute('aria-pressed', String(other === button))
  }
  drawDiff(block, button.dataset.layout)
}

function reviewNames(files, round) {
  const prefix = `round-${round}/reviews/`
  return files
    .filter((path) => path.startsWith(prefix) && path.endsWith('.md') && !path.slice(prefix.length).includes('/'))
    .map((path) => path.slice(prefix.length, -3))
    .sort((a, b) => a.localeCompare(b))
}

function displayName(path) {
  return path.endsWith('.md') ? path.slice(0, -3) : path
}

// Returns the file the pane shows when the route names none.
function defaultFile(session, files, round) {
  if (sessionFlow(session) === 'review') return reviewDefaultFile(session, files, round)
  if (sessionFlow(session) === 'vibe') return vibeDefaultFile(session)
  if (session.stage === 'blocked') return 'session.json'
  if (sessionFlow(session) === 'walk') return 'overview.md'

  const stage = phaseStage(session)
  const report = `round-${round}/report.md`
  if (stage === 'verify') return files.includes(report) ? report : 'tasks.md'
  if (stage === 'triage') return report
  return Object.hasOwn(STAGE_FILE, stage) ? STAGE_FILE[stage] : null
}

// Returns the file the pane shows for a review session when the route names none.
function reviewDefaultFile(session, files, round) {
  if (session.stage === 'blocked') return 'session.json'

  const report = `round-${round}/report.md`
  const submit = `round-${round}/submit.md`
  if (session.stage === 'verify') return files.includes(report) ? report : 'request.md'
  if (session.stage === 'submit' || session.stage === 'done') return files.includes(submit) ? submit : report
  return null
}

// Returns the file the pane shows for a vibe session when the route names none.
function vibeDefaultFile(session) {
  if (session.stage === 'blocked') return 'session.json'
  if (session.stage === 'implement') return 'request.md'
  if (session.stage === 'done') return 'tasks.md'
  return null
}

function sessionRound(session) {
  return Number.isInteger(session.round) && session.round > 0 ? session.round : 0
}

// Returns true when `round` has its `triage.md`, or for a review session its `submit.md` or a done `comment` run.
function roundClosed(session, round, files, runs) {
  if (sessionFlow(session) !== 'review') return files.includes(`round-${round}/triage.md`)

  const commented = runs.some((run) => run.stop === 'comment' && run.round === round && run.outcome === 'done')
  return commented || files.includes(`round-${round}/submit.md`)
}

// Returns `round` while it is not closed, else the next round.
function openRound(session, files, runs) {
  const round = sessionRound(session)
  return round > 0 && !roundClosed(session, round, files, runs) ? round : round + 1
}

// Returns true when a build session implements once more after its last round.
function hasFinalImplement(session, files) {
  const round = sessionRound(session)
  return session.lastRound === true && round > 0 && files.includes(`round-${round}/triage.md`)
}

// Returns the rounds the line shows, in order.
function shownRounds(session, files, runs) {
  const round = sessionRound(session)
  const open = openRound(session, files, runs)
  const rounds = []
  for (let n = 1; n <= round; n += 1) rounds.push(n)

  const working = ['implement', 'verify'].includes(phaseStage(session))
  if (open > round && working && !hasFinalImplement(session, files)) rounds.push(open)
  if (rounds.length === 0) rounds.push(1)
  return rounds
}

// Returns a pending stop of `kind`, with `file` as its main file when the file exists.
function newStop(kind, round, file, files) {
  return {
    kind,
    round,
    label: STOP_LABELS[kind],
    state: 'pending',
    file: files.includes(file) ? file : null,
    links: [],
    reviewers: null,
    runs: [],
    durationMs: null,
    note: null,
    summary: null,
    progress: null,
    triage: null,
  }
}

// Attaches to `stop` the runs of its kind in `round` and returns it.
function withRuns(stop, runs, round = stop.round) {
  stop.runs = runs.filter((run) => run.stop === stop.kind && run.round === round)
  return stop
}

function existingLinks(files, links) {
  return links.filter((link) => files.includes(link.path))
}

function findStop(stops, kind, round) {
  return stops.findIndex((stop) => stop.kind === kind && stop.round === round)
}

function taskProgress(session) {
  const done = integerOrNull(session.counts?.tasksDone)
  const open = integerOrNull(session.counts?.tasksOpen)
  if (done === null || open === null || done + open === 0) return null
  return { done, total: done + open }
}

function triageCounts(session) {
  const triage = {
    mustFix: integerOrNull(session.counts?.mustFix),
    shouldFix: integerOrNull(session.counts?.shouldFix),
    nit: integerOrNull(session.counts?.nit),
  }
  return Object.values(triage).some((count) => count !== null) ? triage : null
}

// Returns the Review stop of `round`, with one reviewer per review file, the runs of `kinds` that no reviewer claims, and the time of all its runs.
function reviewStop(round, files, runs, kinds) {
  const stop = newStop('review', round, `round-${round}/report.md`, files)
  stop.links = existingLinks(files, [{ label: 'extras', path: `round-${round}/extras.md` }])

  const reviews = runs.filter((run) => run.stop === 'review' && run.round === round)
  stop.reviewers = reviewNames(files, round).map((name) => {
    const path = `round-${round}/reviews/${name}.md`
    return { name, path, run: reviews.findLast((run) => run.file === path) ?? null }
  })

  const owned = runs.filter((run) => kinds.includes(run.stop) && run.round === round)
  const claimed = new Set(stop.reviewers.map((reviewer) => reviewer.path))
  const claims = (run) => run.stop === 'review' && claimed.has(run.file)
  stop.runs = owned.filter((run) => !claims(run))
  stop.durationMs = elapsedMs(owned)
  return stop
}

// Returns the Triage stop of `round`, linking each round file that no other stop shows.
function triageStop(session, round, files, runs) {
  const prefix = `round-${round}/`
  const stop = withRuns(newStop('triage', round, `${prefix}triage.md`, files), runs)

  const shown = new Set([
    ...['report.md', 'triage.md', 'extras.md', 'submit.md'].map((name) => prefix + name),
    ...reviewNames(files, round).map((name) => `${prefix}reviews/${name}.md`),
  ])
  stop.links = files
    .filter((path) => path.startsWith(prefix) && !shown.has(path))
    .sort((a, b) => a.localeCompare(b))
    .map((path) => ({ label: displayName(path.slice(prefix.length)), path }))

  if (round === sessionRound(session) && stop.file !== null) stop.triage = triageCounts(session)
  return stop
}

function doneStop(files) {
  const stop = newStop('done', 0, 'deferred.md', files)
  stop.links = existingLinks(files, [{ label: 'decisions', path: 'decisions.md' }])
  return stop
}

// Returns the stops of a build session and the index of its current stop.
function buildFlowStops(session, files, runs, outcomes) {
  const stops = [
    withRuns(newStop('request', 0, 'request.md', files), runs),
    withRuns(newStop('spec', 0, 'spec.md', files), runs),
    withRuns(newStop('plan', 0, 'plan.md', files), runs),
  ]
  const open = openRound(session, files, runs)
  const progress = taskProgress(session)

  for (const round of shownRounds(session, files, runs)) {
    // A round after a `finalize` triage starts at its Review.
    if (outcomes[round - 1] !== 'finalize') {
      const implement = withRuns(newStop('implement', round, 'tasks.md', files), runs)
      if (round === open) implement.progress = progress
      stops.push(implement)
    }
    stops.push(reviewStop(round, files, runs, ['review', 'report']), triageStop(session, round, files, runs))
  }

  const final = hasFinalImplement(session, files)
  if (final) {
    const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs, open)
    implement.progress = progress
    stops.push(implement)
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'spec' || stage === 'plan') current = findStop(stops, stage, 0)
  if (stage === 'implement') current = findStop(stops, 'implement', final ? 0 : open)
  if (stage === 'verify') current = findStop(stops, 'review', open)
  if (stage === 'triage') current = findStop(stops, 'triage', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a review session and the index of its current stop.
function reviewFlowStops(session, files, runs) {
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs)]
  for (const round of shownRounds(session, files, runs)) {
    stops.push(
      reviewStop(round, files, runs, ['review']),
      withRuns(newStop('report', round, `round-${round}/report.md`, files), runs),
      withRuns(newStop('comment', round, `round-${round}/submit.md`, files), runs),
    )
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  const open = openRound(session, files, runs)
  let current = -1
  if (stage === 'verify') current = findStop(stops, files.includes(`round-${open}/report.md`) ? 'report' : 'review', open)
  if (stage === 'submit') current = findStop(stops, 'comment', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a vibe session and the index of its current stop.
function vibeFlowStops(session, files, runs) {
  const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs)
  implement.progress = taskProgress(session)
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs), implement, doneStop(files)]

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'implement') current = 1
  if (stage === 'done') current = 2
  return { stops, current }
}

// Returns the stops of a walk session: the overview, then one stop per step of `walk` with its file when it is written.
function walkFlowStops(session, files, runs, walk) {
  const overview = { ...newStop('overview', 0, null, files), file: 'overview.md', summary: stringOrNull(walk?.summary) }
  const steps = (walk?.steps ?? []).map(({ n, title, summary }) => ({
    ...newStop('step', 0, stepPath(n), files),
    label: `Step ${n}: ${title}`,
    summary: stringOrNull(summary),
  }))
  return [overview, ...steps]
}

// Sets the states of the walk stops, and puts the reason of a blocked walk on the overview.
function setWalkStates(session, stops) {
  const unwritten = (stop) => stop.kind === 'step' && stop.file === null
  const writing = session.stage === 'walk' ? stops.findIndex(unwritten) : -1
  stops.forEach((stop, i) => {
    if (!unwritten(stop)) stop.state = 'done'
    else stop.state = i === writing ? 'writing' : 'pending'
  })

  const overview = stops[0]
  if (session.stage === 'blocked') {
    overview.state = 'blocked'
    overview.note = stringOrNull(session.blocked?.reason)
    overview.links.push({ label: 'session.json', path: 'session.json' })
  }
  return stops
}

function currentState(session, stop) {
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done' && stop.kind === 'done') return 'done'
  if ((session.stage === 'triage' || session.stage === 'submit') && sessionMode(session) === 'interactive') return 'waiting'
  return 'current'
}

// Returns the stops of the session's line, with their states, files and runs.
function buildStops(session, files, runs, outcomes = {}, walk = null) {
  const flow = sessionFlow(session)
  if (flow === 'walk') return setWalkStates(session, walkFlowStops(session, files, runs, walk))

  const flowStops = flow === 'review' ? reviewFlowStops : flow === 'vibe' ? vibeFlowStops : buildFlowStops
  const { stops, current } = flowStops(session, files, runs, outcomes)

  stops.forEach((stop, i) => {
    if (stop.kind === 'request' || (current >= 0 && i < current)) stop.state = 'done'
    else if (i === current) stop.state = currentState(session, stop)
    else stop.state = 'pending'
  })

  const blocked = stops[current]
  if (blocked?.state === 'blocked') {
    if (blocked.kind === 'implement' && blocked.file !== null) blocked.links.push({ label: 'tasks', path: blocked.file })
    blocked.file = 'session.json'
    blocked.note = stringOrNull(session.blocked?.reason)
  }
  return stops
}

function distinct(values) {
  return [...new Set(values.filter((value) => value !== null))]
}

function sumOrNull(values) {
  const present = values.filter((value) => value !== null)
  return present.length > 0 ? present.reduce((sum, value) => sum + value, 0) : null
}

// Returns the span from the earliest `started` to the latest `ended` of `runs` when every run has both, else the sum of `durationMs`.
function elapsedMs(runs) {
  const starts = runs.map((run) => Date.parse(run.started ?? ''))
  const ends = runs.map((run) => Date.parse(run.ended ?? ''))
  if (runs.length > 0 && [...starts, ...ends].every(Number.isFinite)) return Math.max(...ends) - Math.min(...starts)
  return sumOrNull(runs.map((run) => run.durationMs))
}

// Returns the distinct agents and models of `runs`, and each sum over the runs that record it.
function runTotals(runs) {
  return {
    agents: distinct(runs.map((run) => run.agent)),
    models: distinct(runs.map((run) => run.model)),
    tokens: sumOrNull(runs.map((run) => run.tokens)),
    durationMs: sumOrNull(runs.map((run) => run.durationMs)),
    toolUses: sumOrNull(runs.map((run) => run.toolUses)),
  }
}

// Returns true when `stop` opens `path` as its main file, a link or a reviewer.
function stopShows(stop, path) {
  if (stop === undefined || path === null) return false

  return (
    stop.file === path ||
    stop.links.some((link) => link.path === path) ||
    (stop.reviewers ?? []).some((reviewer) => reviewer.path === path)
  )
}

// Returns the index of the last non-pending stop that shows `path`, else of the first stop that shows it, else -1.
function stopIndexForFile(stops, path) {
  const matches = stops.flatMap((stop, i) => (stopShows(stop, path) ? [i] : []))
  const reached = matches.filter((i) => stops[i].state !== 'pending')
  return reached.at(-1) ?? matches[0] ?? -1
}

// Returns the names of the stop model cases that fail.
function metroSelfCheck() {
  const buildSession = (fields) => ({ flow: 'build', mode: 'default', round: 0, lastRound: false, blocked: null, ...fields })
  const kinds = (stops) => stops.map((stop) => stop.kind).join(' ')
  const line = (stops) => stops.map((stop) => `${stop.kind}${stop.round}:${stop.state}`).join(' ')

  const cases = {
    'no-runs': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['request.md', 'round-1/triage.md'], parseRuns(''))
      return parseRuns('').length === 0 && stops.every((stop) => stop.runs.length === 0)
    },

    'truncated-line': () => {
      const runs = parseRuns('{"stop":"spec","round":0,"tokens":5}\n{"stop":"pl')
      return runs.length === 1 && runs[0].tokens === 5
    },

    'bad-types': () => parseRuns('{"stop":"spec","round":0,"tokens":"many"}')[0].tokens === null,

    'run-duration': () => {
      const duration = (fields) => parseRuns(JSON.stringify({ stop: 'implement', round: 1, ...fields }))[0].durationMs
      const started = '2026-10-22T10:00:00Z'
      const ended = '2026-10-22T10:01:30Z'
      return (
        duration({ started, ended, durationMs: null }) === 90000 &&
        duration({ started, ended, durationMs: 1000 }) === 1000 &&
        duration({ started: ended, ended: started }) === null &&
        duration({ started: 'soon', ended }) === null
      )
    },

    'verify-before-bump': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['round-1/triage.md'], [])
      const current = stops.find((stop) => stop.state === 'current')
      return current?.kind === 'review' && current.round === 2
    },

    blocked: () => {
      const session = buildSession({ stage: 'blocked', round: 1, blocked: { stage: 'implement', reason: 'x' } })
      const stops = buildStops(session, ['round-1/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'blocked')
      return (
        stops[i]?.kind === 'implement' &&
        stops[i].note === 'x' &&
        stops[i].file === 'session.json' &&
        stops.slice(i + 1).every((stop) => stop.state === 'pending')
      )
    },

    waiting: () => {
      const stops = buildStops(buildSession({ stage: 'triage', round: 1, mode: 'interactive' }), ['round-1/report.md'], [])
      return stops.find((stop) => stop.kind === 'triage')?.state === 'waiting'
    },

    'last-round': () => {
      const session = buildSession({ stage: 'implement', round: 2, lastRound: true })
      const stops = buildStops(session, ['round-1/triage.md', 'round-2/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'current')
      return stops[i]?.kind === 'implement' && stops[i - 1]?.kind === 'triage' && stops[i + 1]?.kind === 'done'
    },

    'review-flow': () => {
      const stops = buildStops({ flow: 'review', stage: 'submit', round: 1 }, ['round-1/report.md'], [])
      return kinds(stops) === 'request review report comment done'
    },

    'no-findings-round': () => {
      const session = { flow: 'review', stage: 'blocked', round: 1, blocked: { stage: 'verify' } }
      const runs = parseRuns('{"stop":"comment","round":1,"outcome":"done"}')
      const stops = buildStops(session, ['request.md', 'round-1/report.md'], runs)
      const expected = 'request0:done review1:done report1:done comment1:done review2:blocked report2:pending comment2:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-finalize': () => {
      const outcomes = { 1: 'next round', 2: triageOutcome('# Triage: round 2\n\n- F1: dismiss → D1\n\noutcome: finalize\n') }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      const expected =
        'request0:done spec0:done plan0:done implement1:done review1:done triage1:done implement2:done review2:done triage2:done ' +
        'review3:current triage3:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-last-round': () => {
      const outcomes = { 1: 'next round', 2: 'last round' }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      return line(stops).endsWith('triage2:done implement3:done review3:current triage3:pending done0:pending')
    },

    'feedback-after-finalize': () => {
      const session = buildSession({ stage: 'triage', round: 2, feedbackImport: { round: 2, phase: 'normalize' } })
