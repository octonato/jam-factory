// Returns true when `route` shows the root page of a standalone window, whatever file of a session it shows.
function isRoot(route) {
  if (standaloneRoot === null || route.kind !== standaloneRoot.kind) return false
  if (route.kind === 'session') return sessionHref(route) === sessionHref(standaloneRoot)
  return route.path === standaloneRoot.path
}

// Returns the paths of the worktrees whose pages and sessions a standalone window may show.
function standaloneWorktrees() {
  if (standaloneRoot.kind === 'worktree' || standaloneRoot.kind === 'github') return [standaloneRoot.path]

  if (standaloneRoot.kind === 'session') {
    const session = state.sessions.find((s) => sessionHref(s) === sessionHref(standaloneRoot))
    const path = session === undefined ? null : listedWorktree(session.worktree)
    return path === null ? [] : [path]
  }

  if (standaloneRoot.kind === 'prs') {
    const repo = reposState?.repos.find((r) => r.path === standaloneRoot.path)
    return repo === undefined ? [] : repo.worktrees.map((worktree) => worktree.path)
  }
  return []
}

// Returns true when the window may show `route`.
function inScope(route) {
  if (standaloneRoot === null || isRoot(route)) return true

  const worktrees = standaloneWorktrees()
  const scoped = (path) => worktrees.some((worktree) => sameWorktree(worktree, path))
  if (route.kind === 'worktree' || route.kind === 'github') return scoped(route.path)
  if (route.kind !== 'session') return false

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  return session !== undefined && scoped(session.worktree)
}

// Returns the hash a back key goes to for the destination `hash`, or null when the back key does nothing.
function backTarget(hash) {
  if (standaloneRoot === null) return hash
  if (isRoot(parseRoute(shownHash))) return null
  return inScope(parseRoute(hash)) ? hash : rootHash
}

// Returns the title of a standalone window, or null in the main window or while the names of its root are unknown.
function standaloneTitle() {
  if (standaloneRoot === null) return null

  if (standaloneRoot.kind === 'worktree' || standaloneRoot.kind === 'github') {
    const found = findWorktree(standaloneRoot.path)
    return found === null ? null : `Jam · ${found.repo.repo}/${found.worktree.branch ?? found.worktree.head ?? ''}`
  }

  if (standaloneRoot.kind === 'session') {
    const session = state.sessions.find((s) => sessionHref(s) === sessionHref(standaloneRoot))
    return session === undefined ? null : `Jam · ${branchName(session)}`
  }

  if (standaloneRoot.kind === 'prs') {
    const repo = findRepo(standaloneRoot.path)
    return repo === undefined ? null : `Jam · ${repo.repo} PRs`
  }
  return null
}

// Sets the app window title to `standaloneTitle()` when it changed. Does nothing in a browser.
function syncTitle() {
  const title = standaloneTitle()
  if (window.__TAURI__?.window === undefined || title === null || title === windowTitle) return

  windowTitle = title
  window.__TAURI__.window
    .getCurrentWindow()
    .setTitle(title)
    .catch((err) => tell(`Could not set the window title: ${err}`))
}

// Renders the new route. An out-of-scope route restores the shown route. Leaving the edited file asks to discard unsaved changes, and cancel restores the shown route.
function onHashChange() {
  if (!inScope(parseRoute(location.hash))) {
    location.hash = shownHash
    return
  }

  if (editing === null || routeShows(parseRoute(location.hash), editing)) return render()

  const back = shownHash
  confirmDiscard(render, () => {
    location.hash = back
  })
}

// Answers a close request of the app window: true closes it now, false keeps it while the user answers the discard prompt.
function onCloseRequested() {
  if (!hasUnsavedChanges()) return true

  if (!$('modal').open) confirmDiscard(closeWindow)
  return false
}

// Asks the app to close its window. Does nothing in a browser.
function closeWindow() {
  window.__TAURI__?.window
    .getCurrentWindow()
    .close()
    .catch((err) => tell(`Could not close the window: ${err}`))
}

// Asks the browser to confirm a reload or close while the editor holds unsaved changes.
function onBeforeUnload(event) {
  if (!hasUnsavedChanges()) return

  event.preventDefault()
  event.returnValue = true
}

// Runs the list shortcut for `key` and returns true when it acted.
function listKey(key) {
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    moveSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  const session = shownSessions().find((s) => s.dir === selectedDir)
  if (!session) return false

  if (key === 'Enter') {
    location.hash = sessionHref(session)
    return true
  }
  return sessionAction(session, key)
}

// Runs the repos page shortcut for `key` and returns true when it acted.
function reposKey(key) {
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    moveWorktreeSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  if (key === '/') {
    $('repo-filter')?.focus()
    return true
  }

  const row = selectedRow()
  if (row === undefined) return false

  if (key === 'Enter') {
    location.hash = rowHash(row)
    return true
  }

  if (row.worktree === null && key === NEW_WORKTREE_KEY) {
    createWorktree(row.path)
    return true
  }

  if (row.worktree === null) return false

  if (key === REMOVE_WORKTREE_KEY) {
    removeWorktree(row.path, false)
    return true
  }
  return worktreeAction(row.path, key)
}

// Runs the shortcut for `key` in the focused filter field `field`, the repos page's or the PRs page's, and returns true when it acted.
function filterKey(key, field) {
  const prs = field.id === 'pr-filter'

  if (key === 'ArrowDown' || key === 'ArrowUp') {
    const step = key === 'ArrowDown' ? 1 : -1
    field.blur()
    if (prs) movePrSelection(step)
    else moveWorktreeSelection(step)
    return true
  }

  if (key === 'Enter' && prs) {
    field.blur()
    if (selectedPr === null) movePrSelection(1)
    prsKey('Enter', prsView.path)
    return true
  }

  if (key === 'Enter') {
    field.blur()
    if (selectedWorktree === null) selectedWorktree = firstFilterRow()?.path ?? null

    const row = selectedRow()
    if (row !== undefined) location.hash = rowHash(row)
    return true
  }

  if (key === 'Escape') {
    field.blur()
    return true
  }
  return false
}

// Runs the session item shortcut for `key` on `session` and returns true when it acted.
// The tool keys open the listed worktree of `session`, else the worktree that `session` records.
function sessionKey(key, session) {
  if (BACK_KEYS.includes(key)) {
    leavePage(sessionWorktree(session))
    return true
  }

  if (key === 'w') {
    startEditing()
    return true
  }

  if (key === 'ArrowDown' || key === 'ArrowUp') return moveStop(session, key === 'ArrowDown' ? 1 : -1)

  if (key === 'a') {
    archiveSession(session)
    return true
  }

  if (key === REMOVE_WORKTREE_KEY) {
    const path = sessionWorktree(session)
    if (findWorktree(path) === null) return false

    removeWorktree(path, true)
    return true
  }

  if (!Object.hasOwn(WORKTREE_KEYS, key)) return false

  const action = WORKTREE_KEYS[key]
  const path = sessionWorktree(session)
  if (action === 'lazygit' || action === 'shell') openSessionWorktree(session, action)
  else if (findWorktree(path) === null) openTool(session, action)
  else openWorktreeTool(path, action)
  return true
}

// Runs the shortcut for `key` on the page of the missing session `route` and returns true when it acted. A back key off the root of a standalone window goes to the root.
function missingSessionKey(key, route) {
  if (standaloneRoot === null || isRoot(route) || !BACK_KEYS.includes(key)) return false

  location.hash = rootHash
  return true
}

// Runs the worktree page shortcut for `key` on the worktree at `path` and returns true when it acted.
function worktreeKey(key, path) {
  if (BACK_KEYS.includes(key)) {
    leavePage(path)
    return true
  }

  if (findWorktree(path) === null) return false

  if (key === REMOVE_WORKTREE_KEY) {
    removeWorktree(path, true)
    return true
  }
  return worktreeAction(path, key)
}

// Leaves the worktree page of `path` for `pageOrigin` once the editor holds no unsaved changes.
// Selects there the session last shown on the page, or restores the PRs selection and filter, or selects `path` on the repos page.
function leavePage(path) {
  const origin = pageOrigin ?? { hash: null, selectedPr: null, prFilter: '', dir: null }
  const target = backTarget(origin.hash ?? '#/')
  if (target === null) return

  confirmDiscard(() => {
    if (origin.hash === null) selectedWorktree = path
    else if (origin.hash === '#/sessions') selectedDir = origin.dir ?? selectedDir
    else {
      selectedPr = origin.selectedPr
      prFilter = origin.prFilter
    }
    location.hash = target
  })
}

// Runs the PRs page shortcut for `key` on the PRs page of the main checkout at `path` and returns true when it acted.
function prsKey(key, path) {
  if (BACK_KEYS.includes(key)) {
    const target = backTarget('#/')
    if (target === null) return true

    selectedWorktree = path
    location.hash = target
    return true
  }

  if (key === 'ArrowDown' || key === 'ArrowUp') {
    movePrSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  if (key === '/') {
    $('pr-filter')?.focus()
    return true
  }

  if (key === NEW_WORKTREE_KEY) {
    createWorktree(path)
    return true
  }

  const pr = shownPr(selectedPr)
  if (pr === undefined || !Object.hasOwn(PR_KEYS, key)) return false

  runPrAction(path, pr, PR_KEYS[key])
  return true
}

// Returns the shortcut name of `event`, or null when its modifiers make it no shortcut.
function shortcutKey(event) {
  if (event.key === '[' && event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) return 'Meta+['
  if (event.metaKey || event.ctrlKey || event.altKey) return null
  return event.key
}

// Handles a key pressed in the editor, and returns true when the editor has the focus. `Escape` saves and returns to view mode, `Cmd+S` saves.
function editorKey(event) {
  if (editing === null || !event.target.closest('#view')) return false

  if (event.key === 'Escape') {
    event.preventDefault()
    stopEditing()
  }
  if (event.key === 's' && event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) {
    event.preventDefault()
    saveFile()
  }
  return true
}

// Returns true for Shift+Cmd+K, false for Shift+Cmd+J, and null for any other key.
function zoomKey(event) {
  if (!event.metaKey || !event.shiftKey || event.ctrlKey || event.altKey) return null

  const key = event.key.toLowerCase()
  if (key === 'k') return true
  if (key === 'j') return false
  return null
}

// Returns the terminal tab action of `event`: `previous` for Shift+Cmd+[, `next` for Shift+Cmd+], `rename` for Cmd+I, `new` for Cmd+T, and null for any other key.
function tabKey(event) {
  if (!event.metaKey || event.ctrlKey || event.altKey) return null

  const key = event.key.toLowerCase()
  if (event.shiftKey) {
    if (key === '[' || key === '{') return 'previous'
    if (key === ']' || key === '}') return 'next'
    return null
  }

  if (key === 'i') return 'rename'
  if (key === 't') return 'new'
  return null
}

// Returns the bar step of `event`: `previous` for Alt+Cmd+[, `next` for Alt+Cmd+], and null for any other key.
function barKey(event) {
  if (!event.metaKey || !event.altKey || event.ctrlKey || event.shiftKey) return null

  if (event.code === 'BracketLeft') return 'previous'
  if (event.code === 'BracketRight') return 'next'
  return null
}

// Returns the pop-up tab of `event`: `all` for Cmd+K, `branches`, `worktrees` and `terminals` for Shift+Cmd+B, W and T, and null for any other key.
function jumpShortcut(event) {
  if (!event.metaKey || event.ctrlKey || event.altKey) return null

  const key = event.key.toLowerCase()
  if (!event.shiftKey) return key === 'k' ? 'all' : null
  return Object.hasOwn(JUMP_SHIFT_KEYS, key) ? JUMP_SHIFT_KEYS[key] : null
}

// Returns the window action of `event`: `detach` for Cmd+N, `board` for Cmd+0, and null for any other key.
function windowKey(event) {
  if (!event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return null

  if (event.key.toLowerCase() === 'n') return 'detach'
  if (event.key === '0') return 'board'
  return null
}

// Runs the window action `action` and returns true when it applies to this window.
function runWindowAction(action) {
  if (action === 'detach') {
    if (!canDetach(location.hash)) return false
    detachWorktree()
    return true
  }

  if (standaloneRoot === null || window.__TAURI__ === undefined) return false
  openMainWindow()
  return true
}

// Handles `event` in the open pop-up and returns true when it acted. The shortcut of the active tab closes the pop-up.
function jumpKey(event) {
  const tab = jumpShortcut(event)
  if (tab !== null) {
    if (tab === jump.tab) closeJump()
    else switchJumpTab(tab)
    return true
  }

  const tabAction = tabKey(event)
  if (tabAction === 'previous' || tabAction === 'next') {
    stepJumpTab(tabAction === 'next' ? 1 : -1)
    return true
  }

  if (event.key === 'Escape') {
    closeJump()
    return true
  }

  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    moveJumpSelection(event.key === 'ArrowDown' ? 1 : -1)
    return true
  }

  if (event.key !== 'Enter') return false

  const row = shownJumpRows().find((shown) => shown.path === jump.selected)
  if (row === undefined) return false

  openJumpRow(row, event.metaKey)
  return true
}

// Dispatches a shortcut key to the open pop-up, or else to the shown page. Leaves every key to the modal above the pop-up.
function onKey(event) {
  if (jump !== null) {
    if (!$('modal').open && jumpKey(event)) event.preventDefault()
    return
  }

  const jumpTab = jumpShortcut(event)
  if (jumpTab !== null && !$('modal').open && !$('shortcuts').open) {
    event.preventDefault()
    openJump(jumpTab)
    return
  }

  const windowAction = windowKey(event)
  if (windowAction !== null && !$('modal').open && !$('shortcuts').open && runWindowAction(windowAction)) {
    event.preventDefault()
    return
  }

  if (editorKey(event)) return

  if ($('shortcuts').open) {
    if (event.key === '?') {
      event.preventDefault()
      toggleShortcuts()
    }
    return
  }

  const zoom = zoomKey(event)
  if (zoom !== null && zoomWorktreeTerminal(zoom)) {
    event.preventDefault()
    return
  }

  const tabAction = tabKey(event)
  if (tabAction !== null && !$('modal').open && worktreeTabAction(tabAction)) {
    event.preventDefault()
    return
  }

  const barStep = barKey(event)
  if (barStep !== null && !$('modal').open && stepBarItem(barStep === 'next' ? 1 : -1)) {
    event.preventDefault()
    return
  }

  if (event.target.closest('#term-view')) return

  const key = shortcutKey(event)
  if (key === null) return
  if ($('modal').open) return

  const filter = event.target.closest('#repo-filter, #pr-filter')
  if (filter) {
    if (filterKey(key, filter)) event.preventDefault()
    return
  }

  if (event.target.closest('input, textarea, select, [contenteditable]')) return
  if (key === 'Enter' && event.target.closest('button, a')) return

  if (key === '?') {
    event.preventDefault()
    toggleShortcuts()
    return
  }

  const route = parseRoute(location.hash)
  if (route.kind === 'repos') {
    if (reposKey(key)) event.preventDefault()
    return
  }

  if (route.kind === 'sessions') {
    if (listKey(key)) event.preventDefault()
    return
  }

  if (route.kind === 'terminals') {
    if (terminalsKey(key)) event.preventDefault()
    return
  }

  if (route.kind === 'worktree' || route.kind === 'github') {
    if (worktreeKey(key, route.path)) event.preventDefault()
    return
  }

  if (route.kind === 'prs') {
    if (prsKey(key, route.path)) event.preventDefault()
    return
  }

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (session ? sessionKey(key, session) : missingSessionKey(key, route)) event.preventDefault()
}

// Returns the stored font size, or the default when it is missing or out of range.
function readFontSize() {
  try {
    const size = Number(localStorage.getItem(FONT_KEY))
    return Number.isInteger(size) && size >= FONT_MIN && size <= FONT_MAX ? size : FONT_DEFAULT
  } catch {
    return FONT_DEFAULT
  }
}

function writeFontSize(size) {
  try {
    localStorage.setItem(FONT_KEY, String(size))
  } catch {}
}

function showFontSize(size) {
  fontSize = size
  document.documentElement.style.fontSize = `${size}px`
  $('font-value').textContent = `${size}px`
  $('font-down').disabled = size <= FONT_MIN
  $('font-up').disabled = size >= FONT_MAX

  for (const { tabs } of worktreeTerms.values()) {
    for (const tab of tabs) {
      tab.term.options.fontSize = terminalFontSize()
      tab.fit.fit()
    }
  }

  showGithubView()
}

function stepFontSize(step) {
  const size = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + step))
  showFontSize(size)
  writeFontSize(size)
}

// Returns the stored org filter, or null for every org.
function readOrgFilter() {
  try {
    return localStorage.getItem(ORG_KEY) || null
  } catch {
    return null
  }
}

function writeOrgFilter(org) {
  try {
    localStorage.setItem(ORG_KEY, org ?? '')
  } catch {}
}

async function poll() {
  try {
    const [{ sessions, problems }, , terminals] = await Promise.all([loadSessions(), loadRepos(), loadTerminals()])
    if (terminals !== null) syncTerminals(terminals)
    markSeen()
    for (const session of sessions) {
      const problem = sessionProblem(session)
      if (problem !== null) problems.push(`${sessionName(session)}: ${problem}`)
    }
    problems.push(...missingScripts())
    if (state.failedChecks.length > 0) problems.push(`metro self-check failed: ${state.failedChecks.join(', ')}`)

    state.sessions = sessions
    state.problems = problems
    $('status').textContent = `${sessions.length} sessions`
    $('problems').innerHTML = problems.map((p) => `<div>${escape(p)}</div>`).join('')
    render()
  } catch (err) {
    $('status').textContent = `error: ${err.message}`
  }
}

$('font-down').addEventListener('click', () => stepFontSize(-1))
$('font-up').addEventListener('click', () => stepFontSize(1))
showFontSize(readFontSize())
orgFilter = readOrgFilter()
if (standaloneRoot !== null) $('board-header').hidden = true

$('modal-input').addEventListener('keydown', onModalInputKey)
$('jump-input').addEventListener('input', onJumpInput)
$('jump-tabs').addEventListener('click', onJumpTabsClick)
$('jump').addEventListener('close', () => { jump = null })
for (const id of GITHUB_OVERLAYS) $(id).addEventListener('close', showGithubView)

window.addEventListener('hashchange', onHashChange)
window.addEventListener('beforeunload', onBeforeUnload)
window.addEventListener('resize', onSessionResize)
window.addEventListener('resize', showGithubView)
window.addEventListener('focus', onWindowFocus)
document.addEventListener('keydown', onKey)
state.failedChecks = metroSelfCheck()
poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
