<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jam Board</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --ink-2: #55554f;
    --muted: #8a8a82;
    --line: #e2e2dc;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --accent: #2f6fdb;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211;
      --surface: #1a1a19;
      --ink: #ededea;
      --ink-2: #b5b5ae;
      --muted: #85857e;
      --line: #2e2e2b;
      --accent: #6c9cf0;
    }
  }

  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #ededea;
    --ink-2: #b5b5ae;
    --muted: #85857e;
    --line: #2e2e2b;
    --accent: #6c9cf0;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #page {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }

  a { color: var(--accent); }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  header h1 { margin: 0; font-size: 1.286rem; }

  .tabs { display: flex; gap: 4px; }

  .tab {
    padding: 0 6px;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tab:hover { color: var(--accent); }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  #status { color: var(--muted); font-size: 0.857rem; }
  #problems { color: var(--critical); padding: 0 16px; }

  .font-size {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-left: auto;
    color: var(--ink-2);
    font-size: 0.857rem;
  }

  #font-value { min-width: 3em; text-align: center; }

  .font-size button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .font-size button:hover:enabled { border-color: var(--accent); }
  .font-size button:disabled { color: var(--muted); cursor: default; }

  .column {
    max-width: 80%;
    margin: 16px auto;
  }

  .rows { display: grid; gap: 8px; }
  .empty { color: var(--muted); }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone, var(--accent));
    border-radius: 6px;
  }

  .row.waiting { --tone: var(--warning); }
  .row.blocked { --tone: var(--critical); }
  .row.done { --tone: var(--good); }

  .row:has(> a.body:hover) { border-color: var(--accent); border-left-color: var(--tone, var(--accent)); }

  .row.card.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 3px;
  }

  .row .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    color: inherit;
    text-decoration: none;
  }

  .row .actions {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 8px;
  }

  .icon {
    display: flex;
    padding: 4px;
    color: var(--ink-2);
    font: inherit;
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  .icon svg {
    width: 1.1em;
    height: 1.1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon:hover { color: var(--accent); }
  .icon[data-action="archive"]:hover { color: var(--critical); }

  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .id { font-weight: 600; }
  .row .path { color: var(--muted); }
  .row .label { color: var(--ink-2); font-size: 0.857rem; }
  .row .warn { color: var(--warning); }

  .steps { display: flex; align-items: center; }

  .steps .line {
    width: 8px;
    height: 2px;
    background: var(--muted);
  }

  .steps .dot {
    --dot: var(--ink-2);
    width: 10px;
    height: 10px;
    border: 2px solid var(--dot);
    border-radius: 50%;
  }

  .steps .dot.past { background: var(--dot); }

  .steps .dot.current {
    --dot: var(--accent);
    background: var(--dot);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot);
  }

  .steps .dot.future { --dot: var(--muted); }
  .steps .dot.waiting { --dot: var(--warning); }
  .steps .dot.blocked { --dot: var(--critical); border-radius: 2px; }
  .steps .dot.done { --dot: var(--good); }

  #page:has(> .session-page) { overflow: hidden; }

  .session-page {
    display: flex;
    flex-direction: column;
    gap: 12px;
    height: calc(100% - 32px);
  }

  #modal {
    max-width: 480px;
    padding: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #modal::backdrop { background: rgb(0 0 0 / 40%); }

  #modal p { margin: 0 0 16px; }

  #modal .buttons { display: flex; justify-content: flex-end; gap: 8px; }

  #modal button {
    padding: 4px 12px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  #modal button:hover { border-color: var(--accent); }

  .flow-pane,
  #view {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .flow-pane {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    flex: none;
  }

  .flow-pane > * { grid-area: 1 / 1; }

  .flow-toggle {
    z-index: 2;
    align-self: start;
    justify-self: end;
    margin: 4px;
    background: var(--surface);
  }

  .flow-pane.collapsed .flow-toggle svg { transform: rotate(180deg); }

  .flow-strip {
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .flow-strip::-webkit-scrollbar { display: none; }

  .flow-pane.collapsed > .flow-strip {
    height: 0;
    visibility: hidden;
  }

  #view {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 24px;
  }

  #view pre {
    margin: 0 0 12px;
    padding: 10px 12px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #view code { font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .flow {
    --node-h: 3em;
    --back-h: 1.25em;
    --edge: 2px solid var(--muted);
    display: grid;
    grid-template-rows: auto var(--back-h) auto auto;
    align-items: center;
    width: max-content;
    margin: 0 auto;
    padding: 1.5em 1em;
    font-size: 1.071rem;
  }

  .flow > * { grid-row: 1; }
  .flow > .loop { grid-row: 1 / -1; }

  .edge {
    width: 2em;
    border-top: var(--edge);
  }

  .stub {
    flex: 1;
    min-width: 1em;
    border-top: var(--edge);
  }

  .node {
    --tone: var(--ink-2);
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    height: var(--node-h);
    padding: 0 1.5em;
    white-space: nowrap;
    color: var(--ink);
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--tone);
    border-radius: 6px;
  }

  a.node:hover { color: var(--accent); }

  .node.current {
    --tone: var(--accent);
    font-weight: 600;
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--tone);
  }

  .node.future {
    --tone: var(--muted);
    color: var(--muted);
    border-style: dashed;
  }

  .node.waiting { --tone: var(--warning); }
  .node.blocked { --tone: var(--critical); }
  .node.done { --tone: var(--good); }

  .node.selected,
  .chip.selected {
    outline: 2px solid var(--ink-2);
  }

  .node.selected { outline-offset: 6px; }
  .chip.selected { outline-offset: 3px; }

  .branches {
    display: grid;
    grid-auto-rows: 1fr;
  }

  .branches.ends { justify-items: start; }

  .branch {
    position: relative;
    display: flex;
    align-items: center;
    padding: 0.4em 0;
  }

  .branch::before,
  .fan-in > .branch::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    border-left: var(--edge);
  }

  .branch::before { left: 0; }
  .fan-in > .branch::after { right: 0; }
  .branch:first-child::before, .branch:first-child::after { top: calc(50% - 1px); }
  .branch:last-child::before, .branch:last-child::after { bottom: calc(50% - 1px); }

  .loop {
    display: grid;
    grid-template-columns: repeat(5, auto);
    grid-template-rows: subgrid;
    align-items: center;
  }

  .loop > * { grid-row: 1; }

  .loop > .loop-end {
    grid-row: 1 / 3;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .loop-end::before,
  .loop-end::after {
    content: '';
    flex: 1 0 0;
    box-sizing: border-box;
  }

  .loop-end::after {
    flex-basis: var(--back-h);
    align-self: stretch;
    border-bottom: var(--edge);
  }

  .loop-end.start::after {
    margin-left: calc(50% - 1px);
    border-left: var(--edge);
    border-bottom-left-radius: 8px;
  }

  .loop-end.finish::after {
    margin-right: calc(50% - 1px);
    border-right: var(--edge);
    border-bottom-right-radius: 8px;
  }

  .loop-end > .branches { margin: -0.4em 0; }

  .loop > .back-edge {
    grid-row: 2;
    grid-column: 2 / 5;
    align-self: end;
    border-bottom: var(--edge);
  }

  .loop > .chips,
  .loop > .rounds {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: 0;
    min-width: 100%;
  }

  .loop > .chips {
    grid-row: 3;
    gap: 0.5em 0.75em;
    margin-top: 1em;
  }

  .loop > .rounds {
    grid-row: 4;
    gap: 6px;
    margin-top: 0.75em;
  }

  .chip {
    padding: 0.2em 0.75em;
    color: var(--ink-2);
    font-size: 0.8em;
    white-space: nowrap;
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .chip:hover { color: var(--accent); border-color: var(--accent); }

  .rounds button {
    width: 2em;
    height: 2em;
    padding: 0;
    font: inherit;
    font-size: 0.929rem;
    color: var(--ink-2);
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--muted);
    border-radius: 50%;
  }

  .rounds button:hover { border-color: var(--accent); }

  .rounds button.picked {
    color: var(--surface);
    background: var(--accent);
    border-color: var(--accent);
  }

  .markdown { line-height: 1.55; overflow-wrap: break-word; }
  .markdown > :first-child { margin-top: 0; }

  .markdown h1,
  .markdown h2,
  .markdown h3,
  .markdown h4,
  .markdown h5,
  .markdown h6 {
    margin: 24px 0 8px;
    line-height: 1.25;
  }

  .markdown h1 { font-size: 1.571rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .markdown h2 { font-size: 1.286rem; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .markdown h3 { font-size: 1.071rem; }
  .markdown h4, .markdown h5, .markdown h6 { font-size: 1rem; }

  .markdown p,
  .markdown ul,
  .markdown ol,
  .markdown table,
  .markdown blockquote {
    margin: 0 0 12px;
  }

  .markdown ul, .markdown ol { padding-left: 24px; }
  .markdown li + li { margin-top: 2px; }
  .markdown li > ul, .markdown li > ol { margin: 2px 0 0; }

  .markdown li:has(> input[type="checkbox"]),
  .markdown li:has(> p:first-child > input[type="checkbox"]:first-child) {
    list-style: none;
  }

  .markdown input[type="checkbox"] { margin: 0 6px 0 -20px; vertical-align: middle; }

  .markdown table { border-collapse: collapse; }

  .markdown th,
  .markdown td {
    padding: 6px 10px;
    text-align: left;
    border: 1px solid var(--line);
  }

  .markdown th { background: var(--bg); }

  .markdown :not(pre) > code {
    padding: 1px 4px;
    background: var(--bg);
    border-radius: 4px;
  }

  .markdown blockquote {
    margin-left: 0;
    padding: 0 12px;
    color: var(--ink-2);
    border-left: 3px solid var(--line);
  }

  .markdown hr { border: 0; border-top: 1px solid var(--line); }
  .markdown img { max-width: 100%; }

  @media (max-width: 640px) {
    .column { max-width: none; margin: 16px; }
    .row .body { grid-template-columns: auto minmax(0, 1fr); }
    .row .name { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Jam Board</h1>
  <nav class="tabs"><a class="tab" href="#/" aria-current="page">Sessions</a></nav>
  <span id="status">loading…</span>
  <div class="font-size">
    <button type="button" id="font-down" title="Smaller text">A−</button>
    <span id="font-value">18px</span>
    <button type="button" id="font-up" title="Larger text">A+</button>
  </div>
</header>
<div id="problems"></div>
<main id="page"></main>
<dialog id="modal">
  <form method="dialog">
    <p id="modal-text"></p>
    <div class="buttons">
      <button value="cancel" id="modal-cancel">Cancel</button>
      <button value="ok">OK</button>
    </div>
  </form>
</dialog>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script>
const POLL_MS = 2000
const FLOWS = {
  build: {
    phases: ['spec', 'plan', 'impl', 'review', 'triage', 'done'],
    stagePhase: {
      spec: 'spec',
      plan: 'plan',
      implement: 'impl',
      verify: 'review',
      triage: 'triage',
      done: 'done',
    },
  },
  review: {
    phases: ['review', 'submit', 'done'],
    stagePhase: {
      verify: 'review',
      submit: 'submit',
      done: 'done',
    },
  },
  vibe: {
    phases: ['impl', 'done'],
    stagePhase: {
      implement: 'impl',
      done: 'done',
    },
  },
}
const STAGE_FILE = {
  spec: 'spec.md',
  plan: 'plan.md',
  implement: 'tasks.md',
  done: 'deferred.md',
}

const FONT_KEY = 'jam-board-font-size'
const FONT_MIN = 12
const FONT_MAX = 24
const FONT_DEFAULT = 18

const FLOW_KEY = 'jam-board-flow-collapsed'
const FLOW_ICON = '<path d="M8 12.5v-9M4 7.5l4-4 4 4"/>'

const CARD_ACTIONS = [
  {
    action: 'intellij',
    title: 'Open in IntelliJ (i)',
    icon: '<rect x="1.75" y="1.75" width="12.5" height="12.5" rx="1.5"/><path d="M5 4.75v6.5M11 4.75v4.5a1.75 1.75 0 0 1-3.5 0"/>',
  },
  { action: 'zed', title: 'Open in Zed (e)', icon: '<path d="M3.5 3.5h9l-9 9h9"/>' },
  { action: 'iterm', title: 'Open in iTerm (t)', icon: '<path d="M3 4.5 6.5 8 3 11.5M8.5 11.5H13"/>' },
  {
    action: 'archive',
    title: 'Archive (a)',
    icon: '<path d="M2.5 4.5h11M6.5 4.5V2.75h3V4.5M4 4.5l.75 9h6.5l.75-9M6.75 7v4M9.25 7v4"/>',
  },
]
const TOOL_LABELS = { intellij: 'IntelliJ', zed: 'Zed', iterm: 'iTerm', github: 'GitHub' }
const ACTION_KEYS = { a: 'archive', t: 'iterm', e: 'zed', i: 'intellij', o: 'github' }

const $ = (id) => document.getElementById(id)
const state = { sessions: [], problems: [] }
let listView = { html: '', el: null }
let sessionView = { dir: null, el: null, row: '', graph: null }
let lastView = { key: null, text: null }
let pickedRound = null
let renderSeq = 0
let fontSize = FONT_DEFAULT
let flowCollapsed = false
let selectedDir = null

function escape(text) {
  return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.text()
}

// Lists the entries of a directory from the server's HTML listing.
async function listDir(url) {
  let html
  try {
    html = await fetchText(url)
  } catch {
    return []
  }
  const doc = new DOMParser().parseFromString(html, 'text/html')
  return [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((href) => !href.startsWith('?') && !href.startsWith('/') && !href.startsWith('.'))
}

async function listFiles(dir, prefix = '') {
  const files = []
  for (const entry of await listDir(encodePath(dir + prefix))) {
    if (entry.endsWith('/')) files.push(...(await listFiles(dir, prefix + entry)))
    else files.push(prefix + entry)
  }
  return files
}

async function loadSessions() {
  const repos = (await listDir('./')).filter((e) => e.endsWith('/'))
  const sessions = []
  const problems = []

  for (const repo of repos) {
    const ids = (await listDir(`${repo}sessions/`)).filter((e) => e.endsWith('/'))
    for (const id of ids) {
      const dir = `${repo}sessions/${id}`
      try {
        const session = JSON.parse(await fetchText(`${dir}session.json`))
        if (session.archived === true) continue

        session.dir = dir
        sessions.push(session)
      } catch (err) {
        problems.push(`${dir}: ${err.message}`)
      }
    }
  }
  return { sessions, problems }
}

function decode(segment) {
  try {
    return decodeURIComponent(segment)
  } catch {
    return segment
  }
}

function parseRoute(hash) {
  const segments = hash.replace(/^#\/?/, '').split('/').filter((s) => s !== '').map(decode)
  if (segments.length === 0) return null

  const [repo, id = '', ...rest] = segments
  return { repo, id, path: rest.length > 0 ? rest.join('/') : null }
}

function sessionHref(session) {
  return `#/${encodeURIComponent(session.repo)}/${encodeURIComponent(session.id)}`
}

function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/')
}

function fileHref(session, path) {
  return `${sessionHref(session)}/${encodePath(path)}`
}

function shortPath(worktree) {
  return String(worktree || '').split('/').filter((s) => s !== '').slice(-3).join('/')
}

function sessionFlow(session) {
  return session.flow || 'build'
}

// Returns the phases and stage map of the session's flow, or null for an unknown flow.
function flowOf(session) {
  const flow = sessionFlow(session)
  return Object.hasOwn(FLOWS, flow) ? FLOWS[flow] : null
}

// Returns the stage that sets the phase: `blocked.stage` for a blocked session.
function phaseStage(session) {
  return session.stage === 'blocked' ? session.blocked?.stage : session.stage
}

function currentPhase(session) {
  const flow = flowOf(session)
  const stage = phaseStage(session)
  return flow !== null && Object.hasOwn(flow.stagePhase, stage) ? flow.stagePhase[stage] : null
}

// Returns the problem with the session's flow or stage, or null when both are known.
function sessionProblem(session) {
  if (flowOf(session) === null) return `unknown flow "${sessionFlow(session)}"`
  if (!currentPhase(session)) return `unknown stage "${phaseStage(session)}"`
  return null
}

function sessionMode(session) {
  return session.mode || 'default'
}

function tint(session) {
  if (session.stage === 'triage' && sessionMode(session) === 'interactive') return 'waiting'
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done') return 'done'
  return ''
}

function indicator(session) {
  const phases = flowOf(session)?.phases ?? []
  const current = phases.indexOf(currentPhase(session))
  return phases.map((phase, i) => {
    const step = i < current ? 'past' : i === current ? 'current' : 'future'
    const color = i === current || session.stage === 'done' ? tint(session) : ''
    const line = i > 0 ? '<span class="line"></span>' : ''
    return `${line}<span class="dot ${step} ${color}" title="${phase}"></span>`
  }).join('')
}

function stepLabel(session) {
  const phase = currentPhase(session) || phaseStage(session) || 'unknown'
  const parts = [escape(sessionMode(session))]
  if (sessionFlow(session) !== 'build') parts.push(escape(sessionFlow(session)))
  parts.push(escape(session.stage === 'blocked' ? `blocked at ${phase}` : phase))
  if (session.round > 0) parts.push(`round ${escape(session.round)}`)
  if (session.lastRound === true) parts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    parts.push(`<span class="warn">${escape(counts.deferred - counts.issued)} deferred without issue</span>`)
  }
  return parts.join(' · ')
}

function rowContent(session) {
  return `
    <span class="name"><span class="id">${escape(session.id)}</span> <span class="path">${escape(shortPath(session.worktree))}</span></span>
    <span class="steps">${indicator(session)}</span>
    <span class="label">${stepLabel(session)}</span>`
}

function cardActions(session) {
  return CARD_ACTIONS.map(({ action, title, icon }) => `
    <button type="button" class="icon" data-action="${action}" title="${title}">
      <svg viewBox="0 0 16 16" aria-hidden="true">${icon}</svg>
    </button>`).join('')
}

function renderList() {
  const sessions = [...state.sessions].sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')))
  const rows = sessions.map((session) => `
    <div class="row card ${tint(session)}" data-dir="${escape(session.dir)}">
      <a class="body" href="${escape(sessionHref(session))}">${rowContent(session)}</a>
      <span class="actions">${cardActions(session)}</span>
    </div>`).join('')
  const html = `<div class="column rows">${rows || '<p class="empty">No sessions yet.</p>'}</div>`
  if (listView.el === $('page').firstElementChild && listView.html === html) return showSelection()

  $('page').innerHTML = html
  listView = { html, el: $('page').firstElementChild }
  listView.el.addEventListener('click', onCardAction)
  showSelection()
}

// Clears the selection when its session is gone and outlines the selected row.
function showSelection() {
  if (!state.sessions.some((session) => session.dir === selectedDir)) selectedDir = null

  for (const row of $('page').querySelectorAll('.row.card')) {
    row.classList.toggle('selected', row.dataset.dir === selectedDir)
  }
}

// Moves the selection by `step` rows in display order and stops at the first and last rows.
function moveSelection(step) {
  const rows = [...$('page').querySelectorAll('.row.card')]
  if (rows.length === 0) return

  const last = rows.length - 1
  const first = step > 0 ? 0 : last
  const current = rows.findIndex((row) => row.dataset.dir === selectedDir)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedDir = rows[next].dataset.dir
  showSelection()
  rows[next].scrollIntoView({ block: 'nearest' })
}

function onCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const dir = button.closest('.card')?.dataset.dir
  const session = state.sessions.find((s) => s.dir === dir)
  if (!session) return

  if (button.dataset.action === 'archive') archiveSession(session)
  else openTool(session, button.dataset.action)
}

function missingScripts() {
  const missing = []
  if (typeof marked === 'undefined') missing.push('marked.min.js not loaded')
  if (typeof DOMPurify === 'undefined') missing.push('purify.min.js not loaded')
  return missing
}

function codeBlock(text) {
  return `<pre><code>${escape(text)}</code></pre>`
}

function prettyJson(text) {
  try {
    return JSON.stringify(JSON.parse(text), null, 2)
  } catch {
    return text
  }
}

function fileHtml(path, text) {
  if (path.endsWith('.md') && missingScripts().length === 0) {
    const html = DOMPurify.sanitize(marked.parse(text, { gfm: true }), { FORBID_TAGS: ['style', 'form'] })
    return `<div class="markdown">${html}</div>`
  }
  if (path.endsWith('.json')) return codeBlock(prettyJson(text))
  return codeBlock(text)
}

function nodeState(session, phase) {
  const phases = flowOf(session)?.phases ?? []
  const current = phases.indexOf(currentPhase(session))
  const i = phases.indexOf(phase)
  if (i < current) return 'past'
  if (i > current || current < 0) return 'future'
  return `current ${tint(session)}`
}

function graphNode(session, open, label, state, path = null) {
  if (path === null) return `<span class="node ${state}">${escape(label)}</span>`

  const selected = path === open ? ' selected' : ''
  return `<a class="node ${state}${selected}" href="${escape(fileHref(session, path))}">${escape(label)}</a>`
}

function reviewNames(files, round) {
  const prefix = `round-${round}/reviews/`
  return files
    .filter((path) => path.startsWith(prefix) && path.endsWith('.md') && !path.slice(prefix.length).includes('/'))
    .map((path) => path.slice(prefix.length, -3))
    .sort((a, b) => a.localeCompare(b))
}

function reviewNodes(session, files, round, state, open) {
  const names = round > 0 ? reviewNames(files, round) : []
  if (names.length > 0) {
    return names.map((name) => graphNode(session, open, name, state, `round-${round}/reviews/${name}.md`))
  }

  const running = round > 0 && round === session.round && session.stage === 'verify'
  return [graphNode(session, open, running ? 'review · running' : 'review', state)]
}

function displayName(path) {
  return path.endsWith('.md') ? path.slice(0, -3) : path
}

// Returns the chips whose file exists: triage, extras, the other files of round `round` without a node, then decisions.
function chips(files, round) {
  const list = []
  if (round > 0) {
    const prefix = `round-${round}/`
    const named = [
      { label: 'triage', path: `${prefix}triage.md` },
      { label: 'extras', path: `${prefix}extras.md` },
    ]
    const covered = new Set([
      `${prefix}report.md`,
      `${prefix}submit.md`,
      ...named.map((chip) => chip.path),
      ...reviewNames(files, round).map((name) => `${prefix}reviews/${name}.md`),
    ])
    const others = files
      .filter((path) => path.startsWith(prefix) && !covered.has(path))
      .sort((a, b) => a.localeCompare(b))
      .map((path) => ({ label: displayName(path.slice(prefix.length)), path }))
    list.push(...named, ...others)
  }

  list.push({ label: 'decisions', path: 'decisions.md' })
  return list.filter((chip) => files.includes(chip.path))
}

function chipsHtml(session, files, round, open) {
  const links = chips(files, round).map(({ label, path }) => {
    const selected = path === open ? ' selected' : ''
    return `<a class="chip${selected}" href="${escape(fileHref(session, path))}">${escape(label)}</a>`
  })
  return links.length > 0 ? `<div class="chips">${links.join('')}</div>` : ''
}

function roundButtons(session) {
  if (!(session.round > 0)) return ''

  const shown = pickedRound ?? session.round
  const buttons = []
  for (let round = 1; round <= session.round; round += 1) {
    const picked = round === shown ? ' class="picked"' : ''
    buttons.push(`<button type="button" data-round="${round}" title="round ${round}"${picked}>${round}</button>`)
  }
  return `<div class="rounds">${buttons.join('')}</div>`
}

// Returns the round the graph shows: the picked one, else the last one, or 0 before the first round.
function shownRound(session) {
  return session.round > 0 ? (pickedRound ?? session.round) : 0
}

// Returns the file the pane shows when the route names none.
function defaultFile(session, files, round) {
  if (sessionFlow(session) === 'review') return reviewDefaultFile(session, files, round)
  if (sessionFlow(session) === 'vibe') return vibeDefaultFile(session)
  if (session.stage === 'blocked') return 'session.json'

  const stage = phaseStage(session)
  const report = `round-${round}/report.md`
  if (stage === 'verify') return files.includes(report) ? report : 'tasks.md'
  if (stage === 'triage') return report
  return Object.hasOwn(STAGE_FILE, stage) ? STAGE_FILE[stage] : null
}

// Returns the file the pane shows for a review session when the route names none.
function reviewDefaultFile(session, files, round) {
  if (session.stage === 'blocked') return 'session.json'

  const report = `round-${round}/report.md`
  const submit = `round-${round}/submit.md`
  if (session.stage === 'verify') return files.includes(report) ? report : 'request.md'
  if (session.stage === 'submit' || session.stage === 'done') return files.includes(submit) ? submit : report
  return null
}

// Returns the file the pane shows for a vibe session when the route names none.
function vibeDefaultFile(session) {
  if (session.stage === 'blocked') return 'session.json'
  if (session.stage === 'implement') return 'request.md'
  if (session.stage === 'done') return 'tasks.md'
  return null
}

function graphHtml(session, files, round, open) {
  if (sessionFlow(session) === 'review') return reviewGraphHtml(session, files, round, open)
  if (sessionFlow(session) === 'vibe') return vibeGraphHtml(session, open)

  const phases = FLOWS.build.phases
  const phase = phases.indexOf(currentPhase(session))
  const fixing = round > 0 && phase >= 0 && phase < phases.indexOf('review')
  const finished = round < session.round || fixing
  const reviewState = finished ? 'past' : nodeState(session, 'review')
  const triageState = finished ? 'past' : nodeState(session, 'triage')
  const doneState = session.stage === 'done' ? nodeState(session, 'done') : 'future'
  const blockedState = session.stage === 'blocked' ? 'current blocked' : 'future'

  const edge = '<span class="edge"></span>'
  const stub = '<span class="stub"></span>'
  const reviews = reviewNodes(session, files, round, reviewState, open)
    .map((node) => `<div class="branch">${stub}${node}${stub}</div>`)
    .join('')
  const triagePath = round > 0 ? `round-${round}/report.md` : null

  return `
    <div class="flow">
      ${graphNode(session, open, 'request', 'past', 'request.md')}
      ${edge}
      ${graphNode(session, open, 'spec', nodeState(session, 'spec'), 'spec.md')}
      ${edge}
      ${graphNode(session, open, 'plan', nodeState(session, 'plan'), 'plan.md')}
      ${edge}
      <div class="loop">
        <div class="loop-end start">${graphNode(session, open, 'impl', nodeState(session, 'impl'), 'tasks.md')}</div>
        ${edge}
        <div class="branches fan-in">${reviews}</div>
        ${edge}
        <div class="loop-end finish">${graphNode(session, open, 'triage', triageState, triagePath)}</div>
        <span class="back-edge"></span>
        ${chipsHtml(session, files, round, open)}
        ${roundButtons(session)}
      </div>
      ${edge}
      <div class="branches ends">
        <div class="branch">${stub}${graphNode(session, open, 'done', doneState, 'deferred.md')}</div>
        <div class="branch">${stub}${graphNode(session, open, 'blocked', blockedState, 'session.json')}</div>
      </div>
    </div>`
}

function reviewGraphHtml(session, files, round, open) {
  const finished = round < session.round
  const reviewState = finished ? 'past' : nodeState(session, 'review')
  const commentState = finished ? 'past' : nodeState(session, 'submit')
  const doneState = session.stage === 'done' ? nodeState(session, 'done') : 'future'
  const blockedState = session.stage === 'blocked' ? 'current blocked' : 'future'

  const edge = '<span class="edge"></span>'
  const stub = '<span class="stub"></span>'
  const reviews = reviewNodes(session, files, round, reviewState, open)
    .map((node) => `<div class="branch">${stub}${node}${stub}</div>`)
    .join('')
  const reportPath = round > 0 ? `round-${round}/report.md` : null
  const commentPath = round > 0 ? `round-${round}/submit.md` : null
  const donePath = session.round > 0 ? `round-${session.round}/submit.md` : null

  return `
    <div class="flow">
      ${graphNode(session, open, 'request', 'past', 'request.md')}
      ${edge}
      <div class="loop">
        <div class="loop-end start"><div class="branches fan-in">${reviews}</div></div>
        ${edge}
        ${graphNode(session, open, 'report', reviewState, reportPath)}
        ${edge}
        <div class="loop-end finish">${graphNode(session, open, 'comment', commentState, commentPath)}</div>
        <span class="back-edge"></span>
        ${chipsHtml(session, files, round, open)}
        ${roundButtons(session)}
      </div>
      ${edge}
      <div class="branches ends">
        <div class="branch">${stub}${graphNode(session, open, 'done', doneState, donePath)}</div>
        <div class="branch">${stub}${graphNode(session, open, 'blocked', blockedState, 'session.json')}</div>
      </div>
    </div>`
}

function vibeGraphHtml(session, open) {
  const doneState = session.stage === 'done' ? nodeState(session, 'done') : 'future'
  const blockedState = session.stage === 'blocked' ? 'current blocked' : 'future'

  const edge = '<span class="edge"></span>'
  const stub = '<span class="stub"></span>'

  return `
    <div class="flow">
      ${graphNode(session, open, 'request', 'past', 'request.md')}
      ${edge}
      ${graphNode(session, open, 'impl', nodeState(session, 'impl'), 'tasks.md')}
      ${edge}
      <div class="branches ends">
        <div class="branch">${stub}${graphNode(session, open, 'done', doneState)}</div>
        <div class="branch">${stub}${graphNode(session, open, 'blocked', blockedState, 'session.json')}</div>
      </div>
    </div>`
}

function onPickRound(event) {
  const button = event.target.closest('button[data-round]')
  if (!button) return

  pickedRound = Number(button.dataset.round)

  const route = parseRoute(location.hash)
  const match = /^round-\d+\/(.+)$/.exec(route.path ?? '')
  if (match) location.hash = fileHref(route, `round-${pickedRound}/${match[1]}`)
  render()
}

// Shows `path` in the pane, or a blank pane when it is null or missing.
async function showFile(session, files, path, seq) {
  const key = path === null ? null : session.dir + path

  let text = null
  if (path !== null && files.includes(path)) text = await fetchText(encodePath(key)).catch(() => null)

  if (seq !== renderSeq) return
  if (lastView.key === key && lastView.text === text) return

  const sameFile = lastView.key === key
  lastView = { key, text }
  $('view').innerHTML = text === null ? '' : fileHtml(path, text)
  if (!sameFile) $('view').scrollTop = 0
}

// Shows the modal with `message` and resolves with the value of the button that closed it.
function openModal(message, cancellable) {
  const modal = $('modal')
  $('modal-text').textContent = message
  $('modal-cancel').hidden = !cancellable
  modal.returnValue = ''

  const closed = new Promise((resolve) => {
    modal.addEventListener('close', () => resolve(modal.returnValue), { once: true })
  })
  modal.showModal()
  return closed
}

async function ask(message) {
  return (await openModal(message, true)) === 'ok'
}

async function tell(message) {
  await openModal(message, false)
}

async function archiveSession(session) {
  if (!(await ask(`Archive ${session.repo}/${session.id}? The dashboard will no longer list it.`))) return

  try {
    const res = await fetch(`archive/${encodeURIComponent(session.repo)}/${encodeURIComponent(session.id)}`, { method: 'POST' })
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not archive ${session.repo}/${session.id}: ${err.message}`)
    return
  }

  location.hash = '#/'
  poll()
}

async function openTool(session, tool) {
  const label = TOOL_LABELS[tool]

  try {
    const res = await fetch(`open/${tool}/${encodeURIComponent(session.repo)}/${encodeURIComponent(session.id)}`, { method: 'POST' })
    if (!res.ok) throw new Error((await res.text()).trim() || `${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not open ${session.repo}/${session.id} in ${label}: ${err.message}`)
  }
}

// Runs the action bound to `key` on `session` and returns true when `key` has one.
function sessionAction(session, key) {
  if (!Object.hasOwn(ACTION_KEYS, key)) return false

  const action = ACTION_KEYS[key]
  if (action === 'archive') archiveSession(session)
  else openTool(session, action)
  return true
}

async function renderSessionPage(session, path) {
  const seq = renderSeq
  const row = rowContent(session)

  if (sessionView.el !== $('page').firstElementChild || sessionView.dir !== session.dir) {
    $('page').innerHTML = `
      <div class="column session-page">
        <div class="row card ${tint(session)}" id="session-row" data-dir="${escape(session.dir)}">
          <div class="body">${row}</div>
          <span class="actions">${cardActions(session)}</span>
        </div>
        <section class="flow-pane" id="flow-pane">
          <button type="button" class="icon flow-toggle" id="flow-toggle">
            <svg viewBox="0 0 16 16" aria-hidden="true">${FLOW_ICON}</svg>
          </button>
          <div class="flow-strip" id="flow"></div>
        </section>
        <section id="view"></section>
      </div>`
    $('flow').addEventListener('click', onPickRound)
    $('flow-toggle').addEventListener('click', toggleFlow)
    $('session-row').addEventListener('click', onCardAction)
    showFlowCollapsed()
    sessionView = { dir: session.dir, el: $('page').firstElementChild, row, graph: null }
    lastView = { key: null, text: null }
    pickedRound = null
  } else if (sessionView.row !== row) {
    $('session-row').querySelector('.body').innerHTML = row
    $('session-row').className = `row card ${tint(session)}`
    sessionView.row = row
  }

  const files = await listFiles(session.dir)
  if (seq !== renderSeq) return

  const round = shownRound(session)
  const open = path ?? defaultFile(session, files, round)

  const graph = graphHtml(session, files, round, open)
  if (sessionView.graph !== graph) {
    const first = sessionView.graph === null
    $('flow').innerHTML = graph
    if (first) $('flow').scrollLeft = $('flow').scrollWidth
    sessionView.graph = graph
  }

  await showFile(session, files, open, seq)
}

function renderNotFound() {
  $('page').innerHTML = '<div class="column"><p class="empty">session not found</p></div>'
}

function render() {
  renderSeq += 1
  const route = parseRoute(location.hash)
  if (!route) return renderList()

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (!session) return renderNotFound()

  renderSessionPage(session, route.path)
}

// Runs the list shortcut for `key` and returns true when it acted.
function listKey(key) {
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    moveSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  const session = state.sessions.find((s) => s.dir === selectedDir)
  if (!session) return false

  if (key === 'Enter') {
    location.hash = sessionHref(session)
    return true
  }
  return sessionAction(session, key)
}

// Runs the session page shortcut for `key` on `session` and returns true when it acted.
function sessionKey(key, session) {
  if (key === 'l') {
    selectedDir = session.dir
    location.hash = '#/'
    return true
  }

  if (key === 'ArrowDown' || key === 'ArrowUp') {
    const collapse = key === 'ArrowUp'
    if (flowCollapsed === collapse) return false

    toggleFlow()
    return true
  }

  return sessionAction(session, key)
}

// Dispatches a shortcut key to the shown page.
function onKey(event) {
  if (event.metaKey || event.ctrlKey || event.altKey) return
  if ($('modal').open) return
  if (event.target.closest('input, textarea, select, [contenteditable]')) return
  if (event.key === 'Enter' && event.target.closest('button, a')) return

  const route = parseRoute(location.hash)
  if (!route) {
    if (listKey(event.key)) event.preventDefault()
    return
  }

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (session && sessionKey(event.key, session)) event.preventDefault()
}

// Returns the stored font size, or the default when it is missing or out of range.
function readFontSize() {
  try {
    const size = Number(localStorage.getItem(FONT_KEY))
    return Number.isInteger(size) && size >= FONT_MIN && size <= FONT_MAX ? size : FONT_DEFAULT
  } catch {
    return FONT_DEFAULT
  }
}

function writeFontSize(size) {
  try {
    localStorage.setItem(FONT_KEY, String(size))
  } catch {}
}

function showFontSize(size) {
  fontSize = size
  document.documentElement.style.fontSize = `${size}px`
  $('font-value').textContent = `${size}px`
  $('font-down').disabled = size <= FONT_MIN
  $('font-up').disabled = size >= FONT_MAX
}

function stepFontSize(step) {
  const size = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + step))
  showFontSize(size)
  writeFontSize(size)
}

// Returns true when the stored flow state is collapsed.
function readFlowCollapsed() {
  try {
    return localStorage.getItem(FLOW_KEY) === 'true'
  } catch {
    return false
  }
}

function writeFlowCollapsed(collapsed) {
  try {
    localStorage.setItem(FLOW_KEY, String(collapsed))
  } catch {}
}

function showFlowCollapsed() {
  $('flow-pane').classList.toggle('collapsed', flowCollapsed)
  $('flow-toggle').title = flowCollapsed ? 'Expand flow' : 'Collapse flow'
}

function toggleFlow() {
  flowCollapsed = !flowCollapsed
  showFlowCollapsed()
  writeFlowCollapsed(flowCollapsed)
}

async function poll() {
  try {
    const { sessions, problems } = await loadSessions()
    for (const session of sessions) {
      const problem = sessionProblem(session)
      if (problem !== null) problems.push(`${session.repo}/${session.id}: ${problem}`)
    }
    problems.push(...missingScripts())

    state.sessions = sessions
    state.problems = problems
    $('status').textContent = `${sessions.length} sessions`
    $('problems').innerHTML = problems.map((p) => `<div>${escape(p)}</div>`).join('')
    render()
  } catch (err) {
    $('status').textContent = `error: ${err.message}`
  }
}

$('font-down').addEventListener('click', () => stepFontSize(-1))
$('font-up').addEventListener('click', () => stepFontSize(1))
showFontSize(readFontSize())
flowCollapsed = readFlowCollapsed()

window.addEventListener('hashchange', render)
document.addEventListener('keydown', onKey)
poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
