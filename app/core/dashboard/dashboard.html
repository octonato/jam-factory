<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jam Board</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --ink-2: #55554f;
    --muted: #8a8a82;
    --line: #e2e2dc;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --accent: #2f6fdb;
    --done: var(--good);
    --pending: #c4c4bc;
    --rail: 4px;
    --node: 18px;
    --node-top: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121211;
      --surface: #1a1a19;
      --ink: #ededea;
      --ink-2: #b5b5ae;
      --muted: #85857e;
      --line: #2e2e2b;
      --accent: #6c9cf0;
      --pending: #4a4a45;
    }
  }

  :root[data-theme="dark"] {
    --bg: #121211;
    --surface: #1a1a19;
    --ink: #ededea;
    --ink-2: #b5b5ae;
    --muted: #85857e;
    --line: #2e2e2b;
    --accent: #6c9cf0;
    --pending: #4a4a45;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #page {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }

  a { color: var(--accent); }

  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  header h1 { margin: 0; font-size: 1.286rem; }

  .tabs { display: flex; gap: 4px; }

  .tab {
    padding: 0 6px;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 2px solid transparent;
  }

  .tab:hover { color: var(--accent); }
  .tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

  #status { color: var(--muted); font-size: 0.857rem; }
  #problems { color: var(--critical); padding: 0 16px; }

  .font-size {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-left: auto;
    color: var(--ink-2);
    font-size: 0.857rem;
  }

  #font-value { min-width: 3em; text-align: center; }

  .font-size button {
    padding: 2px 8px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  .font-size button:hover:enabled { border-color: var(--accent); }
  .font-size button:disabled { color: var(--muted); cursor: default; }

  .column {
    max-width: 80%;
    margin: 16px auto;
  }

  .rows { display: grid; gap: 8px; }
  .empty { color: var(--muted); }

  .org-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }

  .org-filter button {
    padding: 2px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 0.857rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .org-filter button:hover { border-color: var(--accent); }
  .org-filter button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

  .org-group + .org-group { margin-top: 24px; }

  .org-group .org {
    margin: 0 0 8px;
    color: var(--ink-2);
    font-size: 0.857rem;
    font-weight: 600;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone, var(--accent));
    border-radius: 6px;
  }

  .row.waiting { --tone: var(--warning); }
  .row.blocked { --tone: var(--critical); }
  .row.done { --tone: var(--good); }

  .row:has(> a.body:hover) { border-color: var(--accent); border-left-color: var(--tone, var(--accent)); }

  .row.card.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 3px;
  }

  .row .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    color: inherit;
    text-decoration: none;
  }

  .row .actions {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 8px;
  }

  .icon {
    display: flex;
    padding: 4px;
    color: var(--ink-2);
    font: inherit;
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  .icon svg {
    width: 1.1em;
    height: 1.1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon:hover { color: var(--accent); }
  .icon[data-action="archive"]:hover { color: var(--critical); }

  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .id { font-weight: 600; }
  .row .path { color: var(--muted); }
  .row .label { color: var(--ink-2); font-size: 0.857rem; }
  .row .warn { color: var(--warning); }

  .steps { display: flex; align-items: center; }

  .steps .line {
    width: 8px;
    height: 2px;
    background: var(--muted);
  }

  .steps .dot {
    --dot: var(--ink-2);
    width: 10px;
    height: 10px;
    border: 2px solid var(--dot);
    border-radius: 50%;
  }

  .steps .dot.past { background: var(--dot); }

  .steps .dot.current {
    --dot: var(--accent);
    background: var(--dot);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot);
  }

  .steps .dot.future { --dot: var(--muted); }
  .steps .dot.waiting { --dot: var(--warning); }
  .steps .dot.blocked { --dot: var(--critical); border-radius: 2px; }
  .steps .dot.done { --dot: var(--good); }

  #page:has(> .session-page) { overflow: hidden; }

  .session-page {
    display: grid;
    grid-template-columns: minmax(0, var(--left, 30%)) 6px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100%;
  }

  #metro-pane {
    overflow: auto;
    padding: 16px 16px 48px;
  }

  #splitter {
    cursor: col-resize;
    touch-action: none;
    background: var(--line);
    border-inline: 2px solid var(--bg);
  }

  #splitter:hover, #splitter.dragging { background: var(--accent); }

  .viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--surface);
  }

  #modal {
    max-width: 480px;
    padding: 16px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #modal::backdrop { background: rgb(0 0 0 / 40%); }

  #modal p { margin: 0 0 16px; }

  #modal .buttons { display: flex; justify-content: flex-end; gap: 8px; }

  #modal button {
    padding: 4px 12px;
    color: var(--ink-2);
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }

  #modal button:hover { border-color: var(--accent); }

  #view {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px 24px;
  }

  #view pre {
    margin: 0 0 12px;
    padding: 10px 12px;
    overflow: auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #view code { font: 0.857rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .session-bar {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }

  .session-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .session-card .name { min-width: 0; }
  .session-card .id { font-size: 1.1rem; font-weight: 600; }
  .session-card .path { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }

  .session-card .facts {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    gap: 6px;
  }

  .session-card .actions {
    display: flex;
    gap: 2px;
    margin: 0 -4px 0 auto;
  }

  .pill {
    padding: 1px 8px;
    color: var(--ink-2);
    font-size: 0.8rem;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  .metro { display: flex; flex-direction: column; }

  .stop {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
  }

  .rail { position: relative; }

  .seg {
    position: absolute;
    left: calc(50% - var(--rail) / 2);
    width: var(--rail);
  }

  .seg.up { top: 0; height: calc(var(--node-top) + var(--node) / 2); }
  .seg.down { top: calc(var(--node-top) + var(--node) / 2); bottom: 0; }
  .seg.full { top: 0; bottom: 0; }

  .seg.travelled { background: var(--tone, var(--done)); }

  .seg.todo {
    background: repeating-linear-gradient(to bottom, var(--pending) 0 8px, transparent 8px 13px);
  }

  .stop.done { --tone: var(--done); }
  .stop.current { --tone: var(--accent); }
  .stop.waiting { --tone: var(--warning); }
  .stop.blocked { --tone: var(--critical); }
  .stop.pending { --tone: var(--pending); }

  .seg.down.travelled, .seg.full.travelled { --tone: var(--done); }

  .node {
    position: absolute;
    z-index: 1;
    top: var(--node-top);
    left: calc(50% - var(--node) / 2);
    display: grid;
    place-items: center;
    width: var(--node);
    height: var(--node);
    color: var(--surface);
    background: var(--surface);
    border: 4px solid var(--tone);
    border-radius: 50%;
  }

  .node svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .done > .rail .node { background: var(--tone); border-width: 0; }
  .blocked > .rail .node { background: var(--tone); border-width: 0; border-radius: 4px; }
  .waiting > .rail .node { background: var(--tone); border-width: 0; }

  .current > .rail .node { animation: pulse 1.6s ease-out infinite; }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }

  .node.interchange {
    height: calc(var(--node) + 14px);
    border-radius: 9px;
  }

  .node.terminus {
    --node: 22px;
    top: calc(var(--node-top) - 2px);
    left: calc(50% - 11px);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--tone);
  }

  .stop .card {
    display: grid;
    gap: 6px;
    width: 100%;
    margin: 6px 0 14px;
    padding: 10px 14px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tone);
    border-radius: 8px;
    cursor: pointer;
  }

  .stop .card:hover { border-color: var(--accent); border-left-color: var(--tone); }
  .stop .card:not([data-path]) { cursor: default; }

  .stop .card.selected {
    outline: 2px solid var(--ink-2);
    outline-offset: 2px;
  }

  .stop.pending .card {
    color: var(--muted);
    background: transparent;
    border-style: dashed;
    border-left-style: solid;
  }

  .card-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .card-head .title { font-weight: 600; font-size: 1.05rem; }
  .card-head .when { margin-left: auto; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

  .badge {
    padding: 0 7px;
    color: var(--tone);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border: 1px solid currentColor;
    border-radius: 999px;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    color: var(--ink-2);
    font-size: 0.85rem;
  }

  .meta b { color: var(--ink); font-weight: 500; }
  .pending .meta b { color: var(--muted); }

  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; }

  .bar {
    height: 4px;
    overflow: hidden;
    background: var(--bg);
    border-radius: 2px;
  }

  .bar > span { display: block; height: 100%; background: var(--tone); }

  .note { color: var(--ink-2); font-size: 0.85rem; }
  .blocked .note, .waiting .note { color: var(--tone); }

  .file {
    padding: 0;
    color: var(--accent);
    font: inherit;
    font-size: 0.8rem;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .file:hover { text-decoration: underline; }

  .reviewers {
    display: grid;
    gap: 2px;
    margin-top: 2px;
    padding-left: 4px;
    border-left: 2px solid var(--line);
  }

  .reviewer {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr);
    align-items: center;
    gap: 2px 8px;
    padding: 4px 6px;
    color: inherit;
    font: inherit;
    font-size: 0.85rem;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
  }

  .reviewer:hover { border-color: var(--accent); }
  .reviewer.selected { outline: 2px solid var(--ink-2); }

  .reviewer .dot {
    width: 10px;
    height: 10px;
    background: var(--done);
    border-radius: 50%;
  }

  .reviewer .agent { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reviewer .facts { grid-column: 2; color: var(--ink-2); font-size: 0.8rem; }

  .stop.round .label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stop.round .label::after {
    content: '';
    flex: 1;
    border-top: 1px dashed var(--line);
  }

  .viewer-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
  }

  .viewer-head:empty { display: none; }
  .viewer-head .path { font-weight: 600; overflow-wrap: anywhere; }
  .viewer-head .by { color: var(--muted); font-size: 0.85rem; }

  .markdown { line-height: 1.55; overflow-wrap: break-word; }
  .markdown > :first-child { margin-top: 0; }

  .markdown h1,
  .markdown h2,
  .markdown h3,
  .markdown h4,
  .markdown h5,
  .markdown h6 {
    margin: 24px 0 8px;
    line-height: 1.25;
  }

  .markdown h1 { font-size: 1.571rem; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .markdown h2 { font-size: 1.286rem; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .markdown h3 { font-size: 1.071rem; }
  .markdown h4, .markdown h5, .markdown h6 { font-size: 1rem; }

  .markdown p,
  .markdown ul,
  .markdown ol,
  .markdown table,
  .markdown blockquote {
    margin: 0 0 12px;
  }

  .markdown ul, .markdown ol { padding-left: 24px; }
  .markdown li + li { margin-top: 2px; }
  .markdown li > ul, .markdown li > ol { margin: 2px 0 0; }

  .markdown li:has(> input[type="checkbox"]),
  .markdown li:has(> p:first-child > input[type="checkbox"]:first-child) {
    list-style: none;
  }

  .markdown input[type="checkbox"] { margin: 0 6px 0 -20px; vertical-align: middle; }

  .markdown table { border-collapse: collapse; }

  .markdown th,
  .markdown td {
    padding: 6px 10px;
    text-align: left;
    border: 1px solid var(--line);
  }

  .markdown th { background: var(--bg); }

  .markdown :not(pre) > code {
    padding: 1px 4px;
    background: var(--bg);
    border-radius: 4px;
  }

  .markdown blockquote {
    margin-left: 0;
    padding: 0 12px;
    color: var(--ink-2);
    border-left: 3px solid var(--line);
  }

  .markdown hr { border: 0; border-top: 1px solid var(--line); }
  .markdown img { max-width: 100%; }

  @media (max-width: 800px) {
    .session-page { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 55fr) minmax(0, 45fr); }
    #splitter { display: none; }
    .viewer { border-top: 1px solid var(--line); }
  }

  @media (max-width: 640px) {
    .column { max-width: none; margin: 16px; }
    .row .body { grid-template-columns: auto minmax(0, 1fr); }
    .row .name { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Jam Board</h1>
  <nav class="tabs"><a class="tab" href="#/" aria-current="page">Sessions</a></nav>
  <span id="status">loading…</span>
  <div class="font-size">
    <button type="button" id="font-down" title="Smaller text">A−</button>
    <span id="font-value">18px</span>
    <button type="button" id="font-up" title="Larger text">A+</button>
  </div>
</header>
<div id="problems"></div>
<main id="page"></main>
<dialog id="modal">
  <form method="dialog">
    <p id="modal-text"></p>
    <div class="buttons">
      <button value="cancel" id="modal-cancel">Cancel</button>
      <button value="ok">OK</button>
    </div>
  </form>
</dialog>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script>
const POLL_MS = 2000
const FLOWS = {
  build: {
    phases: ['spec', 'plan', 'impl', 'review', 'triage', 'done'],
    stagePhase: {
      spec: 'spec',
      plan: 'plan',
      implement: 'impl',
      verify: 'review',
      triage: 'triage',
      done: 'done',
    },
  },
  review: {
    phases: ['review', 'submit', 'done'],
    stagePhase: {
      verify: 'review',
      submit: 'submit',
      done: 'done',
    },
  },
  vibe: {
    phases: ['impl', 'done'],
    stagePhase: {
      implement: 'impl',
      done: 'done',
    },
  },
}
const STAGE_FILE = {
  spec: 'spec.md',
  plan: 'plan.md',
  implement: 'tasks.md',
  done: 'deferred.md',
}
const STOP_LABELS = {
  request: 'Request',
  spec: 'Spec',
  plan: 'Plan',
  implement: 'Implement',
  review: 'Review',
  report: 'Report',
  triage: 'Triage',
  comment: 'Comment',
  done: 'Done',
}

const ORG_KEY = 'jam-board-org'

const FONT_KEY = 'jam-board-font-size'
const FONT_MIN = 12
const FONT_MAX = 24
const FONT_DEFAULT = 18

const NODE_ICONS = {
  done: '<path d="M3.5 8.5l3 3 6-7"/>',
  blocked: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
  waiting: '<path d="M8 4v5M8 12v.01"/>',
}
const BADGES = { done: 'done', current: 'running', waiting: 'needs you', blocked: 'blocked', pending: 'next' }
const TRIAGE_LABELS = { mustFix: 'must fix', shouldFix: 'should fix', nit: 'nit' }
const COUNT_FORMAT = new Intl.NumberFormat('en', { notation: 'compact', maximumSignificantDigits: 3 })
const LEFT_MIN = 320
const RIGHT_MIN = 300

const CARD_ACTIONS = [
  {
    action: 'intellij',
    title: 'Open in IntelliJ (i)',
    icon: '<rect x="1.75" y="1.75" width="12.5" height="12.5" rx="1.5"/><path d="M5 4.75v6.5M11 4.75v4.5a1.75 1.75 0 0 1-3.5 0"/>',
  },
  { action: 'zed', title: 'Open in Zed (e)', icon: '<path d="M3.5 3.5h9l-9 9h9"/>' },
  { action: 'iterm', title: 'Open in iTerm (t)', icon: '<path d="M3 4.5 6.5 8 3 11.5M8.5 11.5H13"/>' },
  {
    action: 'archive',
    title: 'Archive (a)',
    icon: '<rect x="2" y="2.5" width="12" height="3" rx=".5"/><path d="M3 5.5v8h10v-8M6.5 8h3"/>',
  },
]
const TOOL_LABELS = { intellij: 'IntelliJ', zed: 'Zed', iterm: 'iTerm', github: 'GitHub' }
const ACTION_KEYS = { a: 'archive', t: 'iterm', e: 'zed', i: 'intellij', o: 'github' }
const BACK_KEYS = ['l', 'Escape', 'Meta+[']

const $ = (id) => document.getElementById(id)
const state = { sessions: [], problems: [], failedChecks: [] }
let listView = { html: '', el: null }
let sessionView = { dir: null, el: null, card: '', metro: '', head: '', stops: [], selected: -1 }
let lastView = { key: null, text: null }
let renderSeq = 0
let fontSize = FONT_DEFAULT
let leftWidth = null
let selectedDir = null
let orgFilter = null

function escape(text) {
  return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
}

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.text()
}

// Returns the file paths of `session`, or none when the list cannot be fetched.
async function listFiles(session) {
  try {
    const { files } = JSON.parse(await fetchText(`api/files/${sessionPath(session)}`))
    return Array.isArray(files) ? files : []
  } catch {
    return []
  }
}

function stringOrNull(value) {
  return typeof value === 'string' ? value : null
}

function integerOrNull(value) {
  return Number.isInteger(value) ? value : null
}

// Returns the milliseconds from `started` to `ended` when both are valid times and `ended` comes after `started`, else null.
function spanMs(started, ended) {
  const start = Date.parse(started ?? '')
  const end = Date.parse(ended ?? '')
  return Number.isFinite(start) && Number.isFinite(end) && end > start ? end - start : null
}

// Returns the runs of a `runs.jsonl` text and skips each line without a string `stop` and an integer `round`.
function parseRuns(text) {
  const runs = []
  for (const line of String(text).split('\n')) {
    let value
    try {
      value = JSON.parse(line)
    } catch {
      continue
    }
    if (value === null || typeof value !== 'object') continue
    if (typeof value.stop !== 'string' || !Number.isInteger(value.round)) continue

    const started = stringOrNull(value.started)
    const ended = stringOrNull(value.ended)
    runs.push({
      stop: value.stop,
      round: value.round,
      agent: stringOrNull(value.agent),
      task: stringOrNull(value.task),
      model: stringOrNull(value.model),
      started,
      ended,
      durationMs: integerOrNull(value.durationMs) ?? spanMs(started, ended),
      tokens: integerOrNull(value.tokens),
      toolUses: integerOrNull(value.toolUses),
      file: stringOrNull(value.file),
      outcome: stringOrNull(value.outcome),
    })
  }
  return runs
}

// Returns the runs of the session in `dir`, or none when its `runs.jsonl` is absent or cannot be fetched.
async function loadRuns(dir, files) {
  if (!files.includes('runs.jsonl')) return []

  try {
    return parseRuns(await fetchText(encodePath(`${dir}runs.jsonl`)))
  } catch {
    return []
  }
}

// Returns the value of the last `outcome:` line of a `triage.md` text, or null.
function triageOutcome(text) {
  const match = [...String(text).matchAll(/^outcome:\s*(.+?)\s*$/gm)].at(-1)
  return match ? match[1] : null
}

// Returns the triage outcome of each round in `files` whose `triage.md` can be fetched, keyed by round.
async function loadOutcomes(dir, files) {
  const outcomes = {}
  const reads = files.map(async (path) => {
    const round = path.match(/^round-(\d+)\/triage\.md$/)?.[1]
    if (round === undefined) return

    const text = await fetchText(encodePath(dir + path)).catch(() => null)
    if (text !== null) outcomes[round] = triageOutcome(text)
  })
  await Promise.all(reads)
  return outcomes
}

// Returns the sessions of the `api/sessions` reply, and a problem line for each entry with an error.
async function loadSessions() {
  const { sessions: entries } = JSON.parse(await fetchText('api/sessions'))
  const sessions = []
  const problems = []

  for (const { org, repo, session: id, data, error } of entries) {
    if (error !== undefined) {
      problems.push(`${org}/${repo}/${id}: ${error}`)
      continue
    }

    sessions.push({ ...data, org, repo, id, dir: `api/file/${org}/${repo}/${id}/` })
  }
  return { sessions, problems }
}

function decode(segment) {
  try {
    return decodeURIComponent(segment)
  } catch {
    return segment
  }
}

function parseRoute(hash) {
  const segments = hash.replace(/^#\/?/, '').split('/').filter((s) => s !== '').map(decode)
  if (segments.length === 0) return null

  const [org, repo = '', id = '', ...rest] = segments
  return { org, repo, id, path: rest.length > 0 ? rest.join('/') : null }
}

// Returns `{org}/{repo}/{id}` of `session`, each segment percent-encoded.
function sessionPath(session) {
  return [session.org, session.repo, session.id].map(encodeURIComponent).join('/')
}

function sessionName(session) {
  return `${session.org}/${session.repo}/${session.id}`
}

function sessionHref(session) {
  return `#/${sessionPath(session)}`
}

function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/')
}

function fileHref(session, path) {
  return `${sessionHref(session)}/${encodePath(path)}`
}

function shortPath(worktree) {
  return String(worktree || '').split('/').filter((s) => s !== '').slice(-3).join('/')
}

function sessionFlow(session) {
  return session.flow || 'build'
}

// Returns the phases and stage map of the session's flow, or null for an unknown flow.
function flowOf(session) {
  const flow = sessionFlow(session)
  return Object.hasOwn(FLOWS, flow) ? FLOWS[flow] : null
}

// Returns the stage that sets the phase: `blocked.stage` for a blocked session.
function phaseStage(session) {
  return session.stage === 'blocked' ? session.blocked?.stage : session.stage
}

function currentPhase(session) {
  const flow = flowOf(session)
  const stage = phaseStage(session)
  return flow !== null && Object.hasOwn(flow.stagePhase, stage) ? flow.stagePhase[stage] : null
}

// Returns the problem with the session's flow or stage, or null when both are known.
function sessionProblem(session) {
  if (flowOf(session) === null) return `unknown flow "${sessionFlow(session)}"`
  if (!currentPhase(session)) return `unknown stage "${phaseStage(session)}"`
  return null
}

function sessionMode(session) {
  return session.mode || 'default'
}

function tint(session) {
  if (session.stage === 'triage' && sessionMode(session) === 'interactive') return 'waiting'
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done') return 'done'
  return ''
}

function indicator(session) {
  const phases = flowOf(session)?.phases ?? []
  const current = phases.indexOf(currentPhase(session))
  return phases.map((phase, i) => {
    const step = i < current ? 'past' : i === current ? 'current' : 'future'
    const color = i === current || session.stage === 'done' ? tint(session) : ''
    const line = i > 0 ? '<span class="line"></span>' : ''
    return `${line}<span class="dot ${step} ${color}" title="${phase}"></span>`
  }).join('')
}

function stepLabel(session) {
  const phase = currentPhase(session) || phaseStage(session) || 'unknown'
  const parts = [escape(sessionMode(session))]
  if (sessionFlow(session) !== 'build') parts.push(escape(sessionFlow(session)))
  parts.push(escape(session.stage === 'blocked' ? `blocked at ${phase}` : phase))
  if (session.round > 0) parts.push(`round ${escape(session.round)}`)
  if (session.lastRound === true) parts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    parts.push(`<span class="warn">${escape(counts.deferred - counts.issued)} deferred without issue</span>`)
  }
  return parts.join(' · ')
}

function rowContent(session) {
  return `
    <span class="name"><span class="id">${escape(sessionName(session))}</span> <span class="path">${escape(shortPath(session.worktree))}</span></span>
    <span class="steps">${indicator(session)}</span>
    <span class="label">${stepLabel(session)}</span>`
}

function cardActions(session) {
  return CARD_ACTIONS.map(({ action, title, icon }) => `
    <button type="button" class="icon" data-action="${action}" title="${title}">
      <svg viewBox="0 0 16 16" aria-hidden="true">${icon}</svg>
    </button>`).join('')
}

// Returns the distinct orgs of `sessions`, sorted.
function sessionOrgs(sessions) {
  return [...new Set(sessions.map((session) => session.org))].sort((a, b) => a.localeCompare(b))
}

// Returns the org the list shows, or null for every org when the filter names none or an org without sessions.
function shownOrg() {
  return sessionOrgs(state.sessions).includes(orgFilter) ? orgFilter : null
}

function shownSessions() {
  const org = shownOrg()
  return state.sessions.filter((session) => org === null || session.org === org)
}

// Returns the org filter: an `All` button, then one button per org.
function orgFilterHtml(orgs, shown) {
  const button = (org, label) => `
    <button type="button" data-org="${escape(org ?? '')}" aria-pressed="${org === shown}">${escape(label)}</button>`
  return `<nav class="org-filter">${[button(null, 'All'), ...orgs.map((org) => button(org, org))].join('')}</nav>`
}

function rowHtml(session) {
  return `
    <div class="row card ${tint(session)}" data-dir="${escape(session.dir)}">
      <a class="body" href="${escape(sessionHref(session))}">${rowContent(session)}</a>
      <span class="actions">${cardActions(session)}</span>
    </div>`
}

// Renders the shown sessions under one heading per org, with the org filter above them.
function renderList() {
  const sessions = shownSessions().sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')))
  const groups = sessionOrgs(sessions).map((org) => `
    <section class="org-group">
      <h2 class="org">${escape(org)}</h2>
      <div class="rows">${sessions.filter((session) => session.org === org).map(rowHtml).join('')}</div>
    </section>`).join('')

  const orgs = sessionOrgs(state.sessions)
  const filter = orgs.length > 0 ? orgFilterHtml(orgs, shownOrg()) : ''
  const html = `<div class="column">${filter}${groups || '<p class="empty">No sessions yet.</p>'}</div>`
  if (listView.el === $('page').firstElementChild && listView.html === html) return showSelection()

  $('page').innerHTML = html
  listView = { html, el: $('page').firstElementChild }
  listView.el.addEventListener('click', onCardAction)
  listView.el.addEventListener('click', onOrgFilter)
  showSelection()
}

// Shows the org of the clicked filter button and stores the choice.
function onOrgFilter(event) {
  const button = event.target.closest('button[data-org]')
  if (!button) return

  orgFilter = button.dataset.org || null
  writeOrgFilter(orgFilter)
  renderList()
}

// Clears the selection when its session is gone or hidden and outlines the selected row.
function showSelection() {
  if (!shownSessions().some((session) => session.dir === selectedDir)) selectedDir = null

  for (const row of $('page').querySelectorAll('.row.card')) {
    row.classList.toggle('selected', row.dataset.dir === selectedDir)
  }
}

// Moves the selection by `step` rows in display order and stops at the first and last rows.
function moveSelection(step) {
  const rows = [...$('page').querySelectorAll('.row.card')]
  if (rows.length === 0) return

  const last = rows.length - 1
  const first = step > 0 ? 0 : last
  const current = rows.findIndex((row) => row.dataset.dir === selectedDir)
  const next = current < 0 ? first : Math.min(last, Math.max(0, current + step))

  selectedDir = rows[next].dataset.dir
  showSelection()
  rows[next].scrollIntoView({ block: 'nearest' })
}

function onCardAction(event) {
  const button = event.target.closest('button[data-action]')
  if (!button) return

  const dir = button.closest('[data-dir]')?.dataset.dir
  const session = state.sessions.find((s) => s.dir === dir)
  if (!session) return

  if (button.dataset.action === 'archive') archiveSession(session)
  else openTool(session, button.dataset.action)
}

function missingScripts() {
  const missing = []
  if (typeof marked === 'undefined') missing.push('marked.min.js not loaded')
  if (typeof DOMPurify === 'undefined') missing.push('purify.min.js not loaded')
  return missing
}

function codeBlock(text) {
  return `<pre><code>${escape(text)}</code></pre>`
}

function prettyJson(text) {
  try {
    return JSON.stringify(JSON.parse(text), null, 2)
  } catch {
    return text
  }
}

function fileHtml(path, text) {
  if (path.endsWith('.md') && missingScripts().length === 0) {
    const html = DOMPurify.sanitize(marked.parse(text, { gfm: true }), { FORBID_TAGS: ['style', 'form'] })
    return `<div class="markdown">${html}</div>`
  }
  if (path.endsWith('.json')) return codeBlock(prettyJson(text))
  return codeBlock(text)
}

function reviewNames(files, round) {
  const prefix = `round-${round}/reviews/`
  return files
    .filter((path) => path.startsWith(prefix) && path.endsWith('.md') && !path.slice(prefix.length).includes('/'))
    .map((path) => path.slice(prefix.length, -3))
    .sort((a, b) => a.localeCompare(b))
}

function displayName(path) {
  return path.endsWith('.md') ? path.slice(0, -3) : path
}

// Returns the file the pane shows when the route names none.
function defaultFile(session, files, round) {
  if (sessionFlow(session) === 'review') return reviewDefaultFile(session, files, round)
  if (sessionFlow(session) === 'vibe') return vibeDefaultFile(session)
  if (session.stage === 'blocked') return 'session.json'

  const stage = phaseStage(session)
  const report = `round-${round}/report.md`
  if (stage === 'verify') return files.includes(report) ? report : 'tasks.md'
  if (stage === 'triage') return report
  return Object.hasOwn(STAGE_FILE, stage) ? STAGE_FILE[stage] : null
}

// Returns the file the pane shows for a review session when the route names none.
function reviewDefaultFile(session, files, round) {
  if (session.stage === 'blocked') return 'session.json'

  const report = `round-${round}/report.md`
  const submit = `round-${round}/submit.md`
  if (session.stage === 'verify') return files.includes(report) ? report : 'request.md'
  if (session.stage === 'submit' || session.stage === 'done') return files.includes(submit) ? submit : report
  return null
}

// Returns the file the pane shows for a vibe session when the route names none.
function vibeDefaultFile(session) {
  if (session.stage === 'blocked') return 'session.json'
  if (session.stage === 'implement') return 'request.md'
  if (session.stage === 'done') return 'tasks.md'
  return null
}

function sessionRound(session) {
  return Number.isInteger(session.round) && session.round > 0 ? session.round : 0
}

// Returns true when `round` has its `triage.md`, or for a review session its `submit.md` or a done `comment` run.
function roundClosed(session, round, files, runs) {
  if (sessionFlow(session) !== 'review') return files.includes(`round-${round}/triage.md`)

  const commented = runs.some((run) => run.stop === 'comment' && run.round === round && run.outcome === 'done')
  return commented || files.includes(`round-${round}/submit.md`)
}

// Returns `round` while it is not closed, else the next round.
function openRound(session, files, runs) {
  const round = sessionRound(session)
  return round > 0 && !roundClosed(session, round, files, runs) ? round : round + 1
}

// Returns true when a build session implements once more after its last round.
function hasFinalImplement(session, files) {
  const round = sessionRound(session)
  return session.lastRound === true && round > 0 && files.includes(`round-${round}/triage.md`)
}

// Returns the rounds the line shows, in order.
function shownRounds(session, files, runs) {
  const round = sessionRound(session)
  const open = openRound(session, files, runs)
  const rounds = []
  for (let n = 1; n <= round; n += 1) rounds.push(n)

  const working = ['implement', 'verify'].includes(phaseStage(session))
  if (open > round && working && !hasFinalImplement(session, files)) rounds.push(open)
  if (rounds.length === 0) rounds.push(1)
  return rounds
}

// Returns a pending stop of `kind`, with `file` as its main file when the file exists.
function newStop(kind, round, file, files) {
  return {
    kind,
    round,
    label: STOP_LABELS[kind],
    state: 'pending',
    file: files.includes(file) ? file : null,
    links: [],
    reviewers: null,
    runs: [],
    durationMs: null,
    note: null,
    progress: null,
    triage: null,
  }
}

// Attaches to `stop` the runs of its kind in `round` and returns it.
function withRuns(stop, runs, round = stop.round) {
  stop.runs = runs.filter((run) => run.stop === stop.kind && run.round === round)
  return stop
}

function existingLinks(files, links) {
  return links.filter((link) => files.includes(link.path))
}

function findStop(stops, kind, round) {
  return stops.findIndex((stop) => stop.kind === kind && stop.round === round)
}

function taskProgress(session) {
  const done = integerOrNull(session.counts?.tasksDone)
  const open = integerOrNull(session.counts?.tasksOpen)
  if (done === null || open === null || done + open === 0) return null
  return { done, total: done + open }
}

function triageCounts(session) {
  const triage = {
    mustFix: integerOrNull(session.counts?.mustFix),
    shouldFix: integerOrNull(session.counts?.shouldFix),
    nit: integerOrNull(session.counts?.nit),
  }
  return Object.values(triage).some((count) => count !== null) ? triage : null
}

// Returns the Review stop of `round`, with one reviewer per review file, the runs of `kinds` that no reviewer claims, and the time of all its runs.
function reviewStop(round, files, runs, kinds) {
  const stop = newStop('review', round, `round-${round}/report.md`, files)
  stop.links = existingLinks(files, [{ label: 'extras', path: `round-${round}/extras.md` }])

  const reviews = runs.filter((run) => run.stop === 'review' && run.round === round)
  stop.reviewers = reviewNames(files, round).map((name) => {
    const path = `round-${round}/reviews/${name}.md`
    return { name, path, run: reviews.findLast((run) => run.file === path) ?? null }
  })

  const owned = runs.filter((run) => kinds.includes(run.stop) && run.round === round)
  const claimed = new Set(stop.reviewers.map((reviewer) => reviewer.path))
  const claims = (run) => run.stop === 'review' && claimed.has(run.file)
  stop.runs = owned.filter((run) => !claims(run))
  stop.durationMs = elapsedMs(owned)
  return stop
}

// Returns the Triage stop of `round`, linking each round file that no other stop shows.
function triageStop(session, round, files, runs) {
  const prefix = `round-${round}/`
  const stop = withRuns(newStop('triage', round, `${prefix}triage.md`, files), runs)

  const shown = new Set([
    ...['report.md', 'triage.md', 'extras.md', 'submit.md'].map((name) => prefix + name),
    ...reviewNames(files, round).map((name) => `${prefix}reviews/${name}.md`),
  ])
  stop.links = files
    .filter((path) => path.startsWith(prefix) && !shown.has(path))
    .sort((a, b) => a.localeCompare(b))
    .map((path) => ({ label: displayName(path.slice(prefix.length)), path }))

  if (round === sessionRound(session) && stop.file !== null) stop.triage = triageCounts(session)
  return stop
}

function doneStop(files) {
  const stop = newStop('done', 0, 'deferred.md', files)
  stop.links = existingLinks(files, [{ label: 'decisions', path: 'decisions.md' }])
  return stop
}

// Returns the stops of a build session and the index of its current stop.
function buildFlowStops(session, files, runs, outcomes) {
  const stops = [
    withRuns(newStop('request', 0, 'request.md', files), runs),
    withRuns(newStop('spec', 0, 'spec.md', files), runs),
    withRuns(newStop('plan', 0, 'plan.md', files), runs),
  ]
  const open = openRound(session, files, runs)
  const progress = taskProgress(session)

  for (const round of shownRounds(session, files, runs)) {
    // A round after a `finalize` triage starts at its Review.
    if (outcomes[round - 1] !== 'finalize') {
      const implement = withRuns(newStop('implement', round, 'tasks.md', files), runs)
      if (round === open) implement.progress = progress
      stops.push(implement)
    }
    stops.push(reviewStop(round, files, runs, ['review', 'report']), triageStop(session, round, files, runs))
  }

  const final = hasFinalImplement(session, files)
  if (final) {
    const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs, open)
    implement.progress = progress
    stops.push(implement)
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'spec' || stage === 'plan') current = findStop(stops, stage, 0)
  if (stage === 'implement') current = findStop(stops, 'implement', final ? 0 : open)
  if (stage === 'verify') current = findStop(stops, 'review', open)
  if (stage === 'triage') current = findStop(stops, 'triage', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a review session and the index of its current stop.
function reviewFlowStops(session, files, runs) {
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs)]
  for (const round of shownRounds(session, files, runs)) {
    stops.push(
      reviewStop(round, files, runs, ['review']),
      withRuns(newStop('report', round, `round-${round}/report.md`, files), runs),
      withRuns(newStop('comment', round, `round-${round}/submit.md`, files), runs),
    )
  }
  stops.push(doneStop(files))

  const stage = phaseStage(session)
  const open = openRound(session, files, runs)
  let current = -1
  if (stage === 'verify') current = findStop(stops, files.includes(`round-${open}/report.md`) ? 'report' : 'review', open)
  if (stage === 'submit') current = findStop(stops, 'comment', sessionRound(session))
  if (stage === 'done') current = findStop(stops, 'done', 0)
  return { stops, current }
}

// Returns the stops of a vibe session and the index of its current stop.
function vibeFlowStops(session, files, runs) {
  const implement = withRuns(newStop('implement', 0, 'tasks.md', files), runs)
  implement.progress = taskProgress(session)
  const stops = [withRuns(newStop('request', 0, 'request.md', files), runs), implement, doneStop(files)]

  const stage = phaseStage(session)
  let current = -1
  if (stage === 'implement') current = 1
  if (stage === 'done') current = 2
  return { stops, current }
}

function currentState(session, stop) {
  if (session.stage === 'blocked') return 'blocked'
  if (session.stage === 'done' && stop.kind === 'done') return 'done'
  if ((session.stage === 'triage' || session.stage === 'submit') && sessionMode(session) === 'interactive') return 'waiting'
  return 'current'
}

// Returns the stops of the session's line, with their states, files and runs.
function buildStops(session, files, runs, outcomes = {}) {
  const flow = sessionFlow(session)
  const flowStops = flow === 'review' ? reviewFlowStops : flow === 'vibe' ? vibeFlowStops : buildFlowStops
  const { stops, current } = flowStops(session, files, runs, outcomes)

  stops.forEach((stop, i) => {
    if (stop.kind === 'request' || (current >= 0 && i < current)) stop.state = 'done'
    else if (i === current) stop.state = currentState(session, stop)
    else stop.state = 'pending'
  })

  const blocked = stops[current]
  if (blocked?.state === 'blocked') {
    if (blocked.kind === 'implement' && blocked.file !== null) blocked.links.push({ label: 'tasks', path: blocked.file })
    blocked.file = 'session.json'
    blocked.note = stringOrNull(session.blocked?.reason)
  }
  return stops
}

function distinct(values) {
  return [...new Set(values.filter((value) => value !== null))]
}

function sumOrNull(values) {
  const present = values.filter((value) => value !== null)
  return present.length > 0 ? present.reduce((sum, value) => sum + value, 0) : null
}

// Returns the span from the earliest `started` to the latest `ended` of `runs` when every run has both, else the sum of `durationMs`.
function elapsedMs(runs) {
  const starts = runs.map((run) => Date.parse(run.started ?? ''))
  const ends = runs.map((run) => Date.parse(run.ended ?? ''))
  if (runs.length > 0 && [...starts, ...ends].every(Number.isFinite)) return Math.max(...ends) - Math.min(...starts)
  return sumOrNull(runs.map((run) => run.durationMs))
}

// Returns the distinct agents and models of `runs`, and each sum over the runs that record it.
function runTotals(runs) {
  return {
    agents: distinct(runs.map((run) => run.agent)),
    models: distinct(runs.map((run) => run.model)),
    tokens: sumOrNull(runs.map((run) => run.tokens)),
    durationMs: sumOrNull(runs.map((run) => run.durationMs)),
    toolUses: sumOrNull(runs.map((run) => run.toolUses)),
  }
}

// Returns true when `stop` opens `path` as its main file, a link or a reviewer.
function stopShows(stop, path) {
  if (stop === undefined || path === null) return false

  return (
    stop.file === path ||
    stop.links.some((link) => link.path === path) ||
    (stop.reviewers ?? []).some((reviewer) => reviewer.path === path)
  )
}

// Returns the index of the last non-pending stop that shows `path`, else of the first stop that shows it, else -1.
function stopIndexForFile(stops, path) {
  const matches = stops.flatMap((stop, i) => (stopShows(stop, path) ? [i] : []))
  const reached = matches.filter((i) => stops[i].state !== 'pending')
  return reached.at(-1) ?? matches[0] ?? -1
}

// Returns the names of the stop model cases that fail.
function metroSelfCheck() {
  const buildSession = (fields) => ({ flow: 'build', mode: 'default', round: 0, lastRound: false, blocked: null, ...fields })
  const kinds = (stops) => stops.map((stop) => stop.kind).join(' ')
  const line = (stops) => stops.map((stop) => `${stop.kind}${stop.round}:${stop.state}`).join(' ')

  const cases = {
    'no-runs': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['request.md', 'round-1/triage.md'], parseRuns(''))
      return parseRuns('').length === 0 && stops.every((stop) => stop.runs.length === 0)
    },

    'truncated-line': () => {
      const runs = parseRuns('{"stop":"spec","round":0,"tokens":5}\n{"stop":"pl')
      return runs.length === 1 && runs[0].tokens === 5
    },

    'bad-types': () => parseRuns('{"stop":"spec","round":0,"tokens":"many"}')[0].tokens === null,

    'run-duration': () => {
      const duration = (fields) => parseRuns(JSON.stringify({ stop: 'implement', round: 1, ...fields }))[0].durationMs
      const started = '2026-10-22T10:00:00Z'
      const ended = '2026-10-22T10:01:30Z'
      return (
        duration({ started, ended, durationMs: null }) === 90000 &&
        duration({ started, ended, durationMs: 1000 }) === 1000 &&
        duration({ started: ended, ended: started }) === null &&
        duration({ started: 'soon', ended }) === null
      )
    },

    'verify-before-bump': () => {
      const stops = buildStops(buildSession({ stage: 'verify', round: 1 }), ['round-1/triage.md'], [])
      const current = stops.find((stop) => stop.state === 'current')
      return current?.kind === 'review' && current.round === 2
    },

    blocked: () => {
      const session = buildSession({ stage: 'blocked', round: 1, blocked: { stage: 'implement', reason: 'x' } })
      const stops = buildStops(session, ['round-1/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'blocked')
      return (
        stops[i]?.kind === 'implement' &&
        stops[i].note === 'x' &&
        stops[i].file === 'session.json' &&
        stops.slice(i + 1).every((stop) => stop.state === 'pending')
      )
    },

    waiting: () => {
      const stops = buildStops(buildSession({ stage: 'triage', round: 1, mode: 'interactive' }), ['round-1/report.md'], [])
      return stops.find((stop) => stop.kind === 'triage')?.state === 'waiting'
    },

    'last-round': () => {
      const session = buildSession({ stage: 'implement', round: 2, lastRound: true })
      const stops = buildStops(session, ['round-1/triage.md', 'round-2/triage.md'], [])
      const i = stops.findIndex((stop) => stop.state === 'current')
      return stops[i]?.kind === 'implement' && stops[i - 1]?.kind === 'triage' && stops[i + 1]?.kind === 'done'
    },

    'review-flow': () => {
      const stops = buildStops({ flow: 'review', stage: 'submit', round: 1 }, ['round-1/report.md'], [])
      return kinds(stops) === 'request review report comment done'
    },

    'no-findings-round': () => {
      const session = { flow: 'review', stage: 'blocked', round: 1, blocked: { stage: 'verify' } }
      const runs = parseRuns('{"stop":"comment","round":1,"outcome":"done"}')
      const stops = buildStops(session, ['request.md', 'round-1/report.md'], runs)
      const expected = 'request0:done review1:done report1:done comment1:done review2:blocked report2:pending comment2:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-finalize': () => {
      const outcomes = { 1: 'next round', 2: triageOutcome('# Triage: round 2\n\n- F1: dismiss → D1\n\noutcome: finalize\n') }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      const expected =
        'request0:done spec0:done plan0:done implement1:done review1:done triage1:done implement2:done review2:done triage2:done ' +
        'review3:current triage3:pending done0:pending'
      return line(stops) === expected
    },

    'verify-after-last-round': () => {
      const outcomes = { 1: 'next round', 2: 'last round' }
      const stops = buildStops(buildSession({ stage: 'verify', round: 2 }), ['round-1/triage.md', 'round-2/triage.md'], [], outcomes)
      return line(stops).endsWith('triage2:done implement3:done review3:current triage3:pending done0:pending')
    },

    'feedback-after-finalize': () => {
      const session = buildSession({ stage: 'triage', round: 2, feedbackImport: { round: 2, phase: 'normalize' } })
      const files = ['round-1/triage.md', 'round-2/reviews/github-feedback.md']
      const stops = buildStops(session, files, [], { 1: 'finalize' })
      const expected =
        'request0:done spec0:done plan0:done implement1:done review1:done triage1:done review2:done triage2:current done0:pending'
      return line(stops) === expected
    },

    'vibe-flow': () => {
      const stops = buildStops({ flow: 'vibe', stage: 'implement', round: 0 }, [], [])
      return kinds(stops) === 'request implement done'
    },

    'reviewer-run': () => {
      const path = 'round-1/reviews/a.md'
      const runs = parseRuns(`{"stop":"review","round":1,"file":"${path}"}\n{"stop":"review","round":1,"file":null}`)
      const review = buildStops(buildSession({ stage: 'triage', round: 1 }), [path], runs).find((stop) => stop.kind === 'review')
      return review.reviewers[0]?.run?.file === path && review.runs.length === 1 && review.runs[0].file === null
    },

    'review-time': () => {
      const files = ['round-1/reviews/a.md', 'round-1/reviews/b.md']
      const a = '{"stop":"review","round":1,"file":"round-1/reviews/a.md","started":"2026-10-22T10:00:00Z","ended":"2026-10-22T10:05:00Z"}'
      const b = '{"stop":"review","round":1,"file":"round-1/reviews/b.md","started":"2026-10-22T10:01:00Z","ended":"2026-10-22T10:09:00Z","durationMs":480000}'
      const report = '{"stop":"report","round":1,"started":"2026-10-22T10:09:00Z","ended":"2026-10-22T10:09:45Z","durationMs":45000}'
      const untimed = '{"stop":"review","round":1,"durationMs":1000}'

      const time = (lines) => {
        const stops = buildStops(buildSession({ stage: 'triage', round: 1 }), files, parseRuns(lines.join('\n')))
        return stops.find((stop) => stop.kind === 'review').durationMs
      }
      return time([a, b, report]) === 585000 && time([b, report, untimed]) === 526000
    },

    'run-totals': () => {
      const totals = runTotals(parseRuns('{"stop":"spec","round":0,"model":"m","tokens":2}\n{"stop":"spec","round":0,"model":"m"}'))
      return totals.models.join() === 'm' && totals.agents.length === 0 && totals.tokens === 2 && totals.toolUses === null
    },
  }

  return Object.keys(cases).filter((name) => {
    try {
      return !cases[name]()
    } catch {
      return true
    }
  })
}

// Returns `count` in short form, such as 35.6k.
function formatCount(count) {
  return COUNT_FORMAT.format(count).replace('K', 'k')
}

// Returns `ms` as hours, minutes and seconds, such as 4m 12s.
function formatDuration(ms) {
  const seconds = Math.round(ms / 1000)
  if (seconds < 60) return `${seconds}s`

  const minutes = Math.floor(seconds / 60)
  if (minutes < 60) return `${minutes}m ${seconds % 60}s`
  return `${Math.floor(minutes / 60)}h ${minutes % 60}m`
}

// Returns the earliest valid `started` time of `runs`, or null.
function firstStarted(runs) {
  const times = runs.map((run) => Date.parse(run.started ?? '')).filter(Number.isFinite)
  return times.length > 0 ? new Date(Math.min(...times)) : null
}

// Returns the session card: the session's name, worktree, facts and actions.
function sessionCardHtml(session, runs) {
  const stage = session.stage === 'blocked' ? `blocked at ${phaseStage(session) ?? 'unknown'}` : session.stage ?? 'unknown'
  const facts = [sessionFlow(session), sessionMode(session), stage]
  if (sessionRound(session) > 0) facts.push(`round ${sessionRound(session)}`)
  if (session.lastRound === true) facts.push('last round')

  const counts = { deferred: 0, issued: 0, ...session.counts }
  if (session.stage === 'done' && counts.deferred > counts.issued) {
    facts.push(`${counts.deferred - counts.issued} deferred without issue`)
  }

  const started = firstStarted(runs)
  if (started !== null) facts.push(`started ${started.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}`)

  const tokens = runTotals(runs.filter((run) => run.agent !== null && run.agent !== 'main')).tokens
  if (tokens !== null) facts.push(`${formatCount(tokens)} agent tokens`)

  return `
    <div class="session-card" data-dir="${escape(session.dir)}">
      <div class="name">
        <div class="id">${escape(sessionName(session))}</div>
        <div class="path">${escape(shortPath(session.worktree))}</div>
      </div>
      <div class="facts">${facts.map((fact) => `<span class="pill">${escape(fact)}</span>`).join('')}</div>
      <div class="actions">${cardActions(session)}</div>
    </div>`
}

// Returns the node of `stop`: a capsule for Review, a double ring for Done, else a circle.
function nodeHtml(stop) {
  const shape = stop.kind === 'review' ? ' interchange' : stop.kind === 'done' ? ' terminus' : ''
  const icon = Object.hasOwn(NODE_ICONS, stop.state)
    ? `<svg viewBox="0 0 16 16" aria-hidden="true">${NODE_ICONS[stop.state]}</svg>`
    : ''
  return `<span class="node${shape}">${icon}</span>`
}

function segHtml(position, reached) {
  return `<span class="seg ${position} ${reached ? 'travelled' : 'todo'}"></span>`
}

function metaHtml(facts) {
  return `<div class="meta">${facts.map((fact) => `<span>${fact}</span>`).join('')}</div>`
}

// Returns the models, tokens and tool uses of `totals` that have data, as HTML.
function usageFacts({ models, tokens, toolUses }) {
  const facts = []
  if (models.length > 0) facts.push(`<b>${escape(models.join(', '))}</b>`)
  if (tokens !== null) facts.push(`${formatCount(tokens)} tokens`)
  if (toolUses !== null) facts.push(`${toolUses} tool uses`)
  return facts
}

// Returns one button per reviewer: its agent, then the model, tokens and duration of its run.
function reviewersHtml(reviewers, open) {
  const rows = reviewers.map(({ name, path, run }) => {
    const facts = []
    if (run?.model) facts.push(escape(run.model))
    if (Number.isInteger(run?.tokens)) facts.push(`${formatCount(run.tokens)} tokens`)
    if (Number.isInteger(run?.durationMs)) facts.push(formatDuration(run.durationMs))

    const selected = path === open ? ' selected' : ''
    const line = facts.length > 0 ? `<span class="facts">${facts.join(' · ')}</span>` : ''
    return `
      <button type="button" class="reviewer${selected}" data-path="${escape(path)}" title="${escape(path)}">
        <span class="dot"></span>
        <span class="agent">${escape(run?.agent ?? name)}</span>
        ${line}
      </button>`
  })
  return `<div class="reviewers">${rows.join('')}</div>`
}

// Returns the card of `stop`: its title, its badge and the facts the session has data for.
function stopCardHtml(stop, open, selected) {
  const totals = runTotals(stop.runs)
  const lines = []

  if (totals.agents.length > 0) lines.push(`<div class="meta mono">${escape(totals.agents.join(', '))}</div>`)

  const usage = usageFacts(totals)
  if (usage.length > 0) lines.push(metaHtml(usage))

  if (stop.progress !== null) {
    const { done, total } = stop.progress
    lines.push(metaHtml([`tasks <b>${done}/${total}</b>`]))
    lines.push(`<div class="bar"><span style="width: ${Math.round((100 * done) / total)}%"></span></div>`)
  }

  if (stop.triage !== null) {
    const counts = Object.entries(TRIAGE_LABELS)
      .filter(([key]) => stop.triage[key] !== null)
      .map(([key, label]) => `<b>${stop.triage[key]}</b> ${label}`)
    lines.push(metaHtml(counts))
  }

  if ((stop.reviewers ?? []).length > 0) lines.push(reviewersHtml(stop.reviewers, open))
  if (stop.note !== null) lines.push(`<div class="note">${escape(stop.note)}</div>`)

  if (stop.links.length > 0) {
    const links = stop.links.map(
      ({ label, path }) => `<button type="button" class="file" data-path="${escape(path)}">${escape(label)}</button>`,
    )
    lines.push(`<div class="meta">${links.join('')}</div>`)
  }

  const durationMs = stop.kind === 'request' ? null : stop.durationMs ?? totals.durationMs
  const when = durationMs !== null ? `<span class="when">${formatDuration(durationMs)}</span>` : ''
  const path = stop.file !== null ? ` data-path="${escape(stop.file)}"` : ''
  return `
    <div class="card${selected ? ' selected' : ''}"${path}>
      <div class="card-head">
        <span class="title">${escape(stop.label)}</span>
        <span class="badge">${BADGES[stop.state]}</span>
        ${when}
      </div>
      ${lines.join('')}
    </div>`
}

// Returns the metro line: a round label before each round's first stop, then one row per stop.
function metroHtml(stops, open, selected) {
  const reached = (stop) => stop !== undefined && stop.state !== 'pending'
  const rows = []
  let labelled = 0

  stops.forEach((stop, i) => {
    if (stop.round > 0 && stop.round !== labelled) {
      labelled = stop.round
      rows.push(`
        <div class="stop round">
          <div class="rail">${segHtml('full', reached(stop))}</div>
          <div class="label">Round ${stop.round}</div>
        </div>`)
    }

    const up = i > 0 ? segHtml('up', reached(stop)) : ''
    const down = i < stops.length - 1 ? segHtml('down', reached(stops[i + 1])) : ''
    rows.push(`
      <div class="stop ${stop.state}" data-index="${i}">
        <div class="rail">${up}${down}${nodeHtml(stop)}</div>
        ${stopCardHtml(stop, open, i === selected)}
      </div>`)
  })
  return rows.join('')
}

// Returns the viewer head: the open path, then the label and agents of `stop`.
function viewerHeadHtml(stop, open) {
  if (open === null) return ''

  const path = `<span class="path">${escape(open)}</span>`
  if (stop === undefined) return path

  const reviewer = (stop.reviewers ?? []).find((r) => r.path === open)
  const agents = reviewer ? (reviewer.run?.agent ? [reviewer.run.agent] : []) : runTotals(stop.runs).agents
  return `${path}<span class="by">${escape([stop.label, ...agents].join(' · '))}</span>`
}

// Shows `path` in the pane, or a blank pane when it is null or missing.
async function showFile(session, files, path, seq) {
  const key = path === null ? null : session.dir + path

  let text = null
  if (path !== null && files.includes(path)) text = await fetchText(encodePath(key)).catch(() => null)

  if (seq !== renderSeq) return
  if (lastView.key === key && lastView.text === text) return

  const sameFile = lastView.key === key
  lastView = { key, text }
  $('view').innerHTML = text === null ? '' : fileHtml(path, text)
  if (!sameFile) $('view').scrollTop = 0
}

// Shows the modal with `message` and resolves with the value of the button that closed it.
function openModal(message, cancellable) {
  const modal = $('modal')
  $('modal-text').textContent = message
  $('modal-cancel').hidden = !cancellable
  modal.returnValue = ''

  const closed = new Promise((resolve) => {
    modal.addEventListener('close', () => resolve(modal.returnValue), { once: true })
  })
  modal.showModal()
  return closed
}

async function ask(message) {
  return (await openModal(message, true)) === 'ok'
}

async function tell(message) {
  await openModal(message, false)
}

async function archiveSession(session) {
  if (!(await ask(`Archive ${sessionName(session)}? The dashboard will no longer list it.`))) return

  try {
    const res = await fetch(`api/archive/${sessionPath(session)}`, { method: 'POST' })
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not archive ${sessionName(session)}: ${err.message}`)
    return
  }

  location.hash = '#/'
  poll()
}

async function openTool(session, tool) {
  const label = TOOL_LABELS[tool]

  try {
    const res = await fetch(`api/open/${tool}/${sessionPath(session)}`, { method: 'POST' })
    if (!res.ok) throw new Error((await res.text()).trim() || `${res.status} ${res.statusText}`)
  } catch (err) {
    await tell(`Could not open ${sessionName(session)} in ${label}: ${err.message}`)
  }
}

// Runs the action bound to `key` on `session` and returns true when `key` has one.
function sessionAction(session, key) {
  if (!Object.hasOwn(ACTION_KEYS, key)) return false

  const action = ACTION_KEYS[key]
  if (action === 'archive') archiveSession(session)
  else openTool(session, action)
  return true
}

// Scrolls the metro pane to show the card of stop `index`.
function revealStop(index) {
  const card = $('metro').querySelector(`.stop[data-index="${index}"] > .card`)
  if (!card) return

  card.scrollIntoView({ block: 'nearest' })
}

// Shows `path` of `session`, and renders again when the route already names it.
function openPath(session, path) {
  if (parseRoute(location.hash)?.path === path) render()
  else location.hash = fileHref(session, path)
}

// Selects the stop of the clicked card, reviewer or link, and opens its file.
function onMetroClick(event) {
  const target = event.target.closest('[data-path]')
  const stop = event.target.closest('.stop[data-index]')
  if (!target || !stop) return

  const session = state.sessions.find((s) => s.dir === sessionView.dir)
  if (!session) return

  sessionView.selected = Number(stop.dataset.index)
  openPath(session, target.dataset.path)
}

// Selects the nearest stop with a file in direction `step`, opens the file and returns true when one exists.
function moveStop(session, step) {
  if (sessionView.dir !== session.dir) return false

  const { stops, selected } = sessionView
  let next = selected < 0 && step < 0 ? stops.length - 1 : selected + step
  while (next >= 0 && next < stops.length && stops[next].file === null) next += step
  if (next < 0 || next >= stops.length) return false

  sessionView.selected = next
  revealStop(next)
  openPath(session, stops[next].file)
  return true
}

// Clamps the left column to the page, reserving the splitter and viewer widths. Mobile keeps its stacked layout.
function resizeSessionPage(page, width = leftWidth) {
  const splitterWidth = $('splitter').getBoundingClientRect().width
  if (splitterWidth === 0) return

  const pageWidth = page.getBoundingClientRect().width
  const max = Math.max(0, Math.floor(pageWidth - splitterWidth - RIGHT_MIN))
  const min = Math.min(LEFT_MIN, max)
  leftWidth = Math.round(Math.min(max, Math.max(min, width ?? pageWidth * 0.3)))
  page.style.setProperty('--left', `${leftWidth}px`)
}

function onSessionResize() {
  if (sessionView.el !== null && sessionView.el === $('page').firstElementChild) resizeSessionPage(sessionView.el)
}

// Resizes the left column while the splitter is dragged.
function onSplitterDown(event) {
  const splitter = event.currentTarget
  const page = splitter.parentElement
  const resize = (move) => {
    resizeSessionPage(page, move.clientX - page.getBoundingClientRect().left)
  }

  event.preventDefault()
  splitter.setPointerCapture(event.pointerId)
  splitter.classList.add('dragging')
  splitter.addEventListener('pointermove', resize)
  splitter.addEventListener(
    'lostpointercapture',
    () => {
      splitter.classList.remove('dragging')
      splitter.removeEventListener('pointermove', resize)
    },
    { once: true },
  )
}

async function renderSessionPage(session, path) {
  const seq = renderSeq

  if (sessionView.el !== $('page').firstElementChild || sessionView.dir !== session.dir) {
    $('page').innerHTML = `
      <div class="session-page">
        <div class="session-bar" id="session-card"></div>
        <section id="metro-pane">
          <div class="metro" id="metro"></div>
        </section>
        <div id="splitter"></div>
        <section class="viewer">
          <div class="viewer-head" id="viewer-head"></div>
          <div id="view"></div>
        </section>
      </div>`
    const page = $('page').firstElementChild
    resizeSessionPage(page)
    $('session-card').addEventListener('click', onCardAction)
    $('metro').addEventListener('click', onMetroClick)
    $('splitter').addEventListener('pointerdown', onSplitterDown)
    sessionView = { dir: session.dir, el: page, card: '', metro: '', head: '', stops: [], selected: -1 }
    lastView = { key: null, text: null }
  }

  const files = await listFiles(session)
  const runs = await loadRuns(session.dir, files)
  const outcomes = await loadOutcomes(session.dir, files)
  if (seq !== renderSeq) return

  const card = sessionCardHtml(session, runs)
  if (sessionView.card !== card) {
    $('session-card').innerHTML = card
    sessionView.card = card
  }

  const stops = buildStops(session, files, runs, outcomes)
  const open = path ?? defaultFile(session, files, sessionRound(session))
  if (!stopShows(stops[sessionView.selected], open)) sessionView.selected = stopIndexForFile(stops, open)
  sessionView.stops = stops

  const metro = metroHtml(stops, open, sessionView.selected)
  if (sessionView.metro !== metro) {
    const first = sessionView.metro === ''
    const top = $('metro-pane').scrollTop
    $('metro').innerHTML = metro
    $('metro-pane').scrollTop = top
    sessionView.metro = metro
    if (first) revealStop(sessionView.selected)
  }

  const head = viewerHeadHtml(stops[sessionView.selected], open)
  if (sessionView.head !== head) {
    $('viewer-head').innerHTML = head
    sessionView.head = head
  }

  await showFile(session, files, open, seq)
}

function renderNotFound() {
  $('page').innerHTML = '<div class="column"><p class="empty">session not found</p></div>'
}

function render() {
  renderSeq += 1
  const route = parseRoute(location.hash)
  if (!route) return renderList()

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (!session) return renderNotFound()

  renderSessionPage(session, route.path)
}

// Runs the list shortcut for `key` and returns true when it acted.
function listKey(key) {
  if (key === 'ArrowDown' || key === 'ArrowUp') {
    moveSelection(key === 'ArrowDown' ? 1 : -1)
    return true
  }

  const session = shownSessions().find((s) => s.dir === selectedDir)
  if (!session) return false

  if (key === 'Enter') {
    location.hash = sessionHref(session)
    return true
  }
  return sessionAction(session, key)
}

// Runs the session page shortcut for `key` on `session` and returns true when it acted.
function sessionKey(key, session) {
  if (BACK_KEYS.includes(key)) {
    selectedDir = session.dir
    location.hash = '#/'
    return true
  }

  if (key === 'ArrowDown' || key === 'ArrowUp') return moveStop(session, key === 'ArrowDown' ? 1 : -1)

  return sessionAction(session, key)
}

// Returns the shortcut name of `event`, or null when its modifiers make it no shortcut.
function shortcutKey(event) {
  if (event.key === '[' && event.metaKey && !event.ctrlKey && !event.altKey && !event.shiftKey) return 'Meta+['
  if (event.metaKey || event.ctrlKey || event.altKey) return null
  return event.key
}

// Dispatches a shortcut key to the shown page.
function onKey(event) {
  const key = shortcutKey(event)
  if (key === null) return
  if ($('modal').open) return
  if (event.target.closest('input, textarea, select, [contenteditable]')) return
  if (key === 'Enter' && event.target.closest('button, a')) return

  const route = parseRoute(location.hash)
  if (!route) {
    if (listKey(key)) event.preventDefault()
    return
  }

  const session = state.sessions.find((s) => sessionHref(s) === sessionHref(route))
  if (session && sessionKey(key, session)) event.preventDefault()
}

// Returns the stored font size, or the default when it is missing or out of range.
function readFontSize() {
  try {
    const size = Number(localStorage.getItem(FONT_KEY))
    return Number.isInteger(size) && size >= FONT_MIN && size <= FONT_MAX ? size : FONT_DEFAULT
  } catch {
    return FONT_DEFAULT
  }
}

function writeFontSize(size) {
  try {
    localStorage.setItem(FONT_KEY, String(size))
  } catch {}
}

function showFontSize(size) {
  fontSize = size
  document.documentElement.style.fontSize = `${size}px`
  $('font-value').textContent = `${size}px`
  $('font-down').disabled = size <= FONT_MIN
  $('font-up').disabled = size >= FONT_MAX
}

function stepFontSize(step) {
  const size = Math.min(FONT_MAX, Math.max(FONT_MIN, fontSize + step))
  showFontSize(size)
  writeFontSize(size)
}

// Returns the stored org filter, or null for every org.
function readOrgFilter() {
  try {
    return localStorage.getItem(ORG_KEY) || null
  } catch {
    return null
  }
}

function writeOrgFilter(org) {
  try {
    localStorage.setItem(ORG_KEY, org ?? '')
  } catch {}
}

async function poll() {
  try {
    const { sessions, problems } = await loadSessions()
    for (const session of sessions) {
      const problem = sessionProblem(session)
      if (problem !== null) problems.push(`${sessionName(session)}: ${problem}`)
    }
    problems.push(...missingScripts())
    if (state.failedChecks.length > 0) problems.push(`metro self-check failed: ${state.failedChecks.join(', ')}`)

    state.sessions = sessions
    state.problems = problems
    $('status').textContent = `${sessions.length} sessions`
    $('problems').innerHTML = problems.map((p) => `<div>${escape(p)}</div>`).join('')
    render()
  } catch (err) {
    $('status').textContent = `error: ${err.message}`
  }
}

$('font-down').addEventListener('click', () => stepFontSize(-1))
$('font-up').addEventListener('click', () => stepFontSize(1))
showFontSize(readFontSize())
orgFilter = readOrgFilter()

window.addEventListener('hashchange', render)
window.addEventListener('resize', onSessionResize)
document.addEventListener('keydown', onKey)
state.failedChecks = metroSelfCheck()
poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
