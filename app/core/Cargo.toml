[package]
name = "jam-board-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jam_board_core"

[dependencies]
httparse = "1"
jam-factory-store = { path = "../store" }
percent-encoding = "2"
portable-pty = "0.9"
rmcp = { version = "~3.7", default-features = false, features = ["client", "transport-child-process"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-std", "io-util", "process", "rt-multi-thread", "time"] }
tungstenite = "0.29"

[dev-dependencies]
tempfile = "3"
