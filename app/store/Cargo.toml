[package]
name = "jam-factory-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "jam_factory_store"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
