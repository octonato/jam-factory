[package]
name = "odeck-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "octodeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
odeck-core = { path = "../core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
