[package]
name = "jam-board"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jam-board"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jam-board-core = { path = "../core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
